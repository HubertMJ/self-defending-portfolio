# The Security Analytics detector of the sdp-host data stream (ADR 0034 "Rules from git"): every rule of
# log type sdp_host runs here once a minute, and each finding raises an alert through the one trigger
# the sync adds. A rule belongs to exactly one detector, the one of its source (siem_lint.py).
name: sdp-host-rules
source: host
interval_minutes: 1
rules:
  - 0ee27053-8f8c-4740-a990-98d398477490  # host-ssh-accepted
  - 0a66d582-41d5-41ed-9c45-074725c6f640  # host-ssh-failed
