# log type sdp_siem01 runs here once a minute, and each finding raises an alert through the one trigger
# the sync adds. A rule belongs to exactly one detector, the one of its source (siem_lint.py).
name: sdp-siem01-rules
source: siem01
interval_minutes: 1
