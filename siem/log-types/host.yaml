# Security Analytics log type of the sdp-host data stream (ADR 0034 "Rules from git"). The name has no
# hyphen: SA's correlation list truncates hyphenated log-type names (siem contract S0-#2); the data
# stream keeps its hyphen. Detectors and correlation rules use the name as their category.
name: sdp_host
source: host
description: Logins, sudo, firewall drops and auditd records of k3s01, data stream sdp-host
