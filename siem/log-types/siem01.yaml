# Security Analytics log type of the sdp-siem01 data stream (ADR 0034 "Rules from git"). The name has no
# hyphen: SA's correlation list truncates hyphenated log-type names (siem contract S0-#2); the data
# stream keeps its hyphen. Detectors and correlation rules use the name as their category.
name: sdp_siem01
source: siem01
description: Logins, sudo, firewall drops, auditd and OpenSearch audit records of siem01, data stream sdp-siem01
