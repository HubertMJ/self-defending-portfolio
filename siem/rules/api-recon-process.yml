# The portfolio API's own record of a catalogue command it started in a visitor's terminal (sdp-api,
# siem.command). The command id is fixed by the catalogue, so the technique is the catalogue's claim; the SIEM
# evidence that it happened comes from the other sources.
title: Terminal recon - process discovery
id: e73b1008-1ef3-4438-b3df-a60e9251ac9b
status: experimental
level: low
description: >-
  A visitor listed processes in the attacker terminal (catalogue T1057).
author: Hubert Jabłoński
date: 2026/10/04
logsource:
  product: sdp
  service: api
detection:
  selection:
    event.action: siem.command
    api.state: started
    api.technique: T1057
  condition: selection
tags:
  - attack.discovery
  - attack.t1057
falsepositives:
  - "A visitor (or the canary) running this catalogue command on the public page - that is the point"
