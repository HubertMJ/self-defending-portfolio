# The portfolio API's own record of a catalogue command it started in a visitor's terminal (sdp-api,
# siem.command). The command id is fixed by the catalogue, so the technique is the catalogue's claim; the SIEM
# evidence that it happened comes from the other sources.
title: Terminal credentials - flag file read
id: c688437b-f1eb-4c1b-af13-13738b0fce91
status: experimental
level: high
description: >-
  A visitor read the run's flag file in the attacker terminal (catalogue T1552.001). Falco does not see this
  read by design; the incident board joins it with what follows.
author: Hubert Jabłoński
date: 2026/10/04
logsource:
  product: sdp
  service: api
detection:
  selection:
    event.action: siem.command
    api.state: started
    api.technique: T1552.001
  condition: selection
tags:
  - attack.credential_access
  - attack.t1552.001
falsepositives:
  - "A visitor (or the canary) running this catalogue command on the public page - that is the point"
