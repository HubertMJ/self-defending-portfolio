# A login record of the host's own journal. User names and addresses are pseudonymised before they leave the
# host and host findings are published as counts only (ADR 0034).
title: siem01 - SSH login refused
id: 073abeb3-92b1-48b5-bad5-040b71030364
status: experimental
level: low
description: >-
  An SSH login to siem01 was refused: a wrong key, or a user that may not log in. A user
  outside AllowUsers leaves only "Connection closed by ... [preauth]" (closed-preauth); only the admin
  networks reach port 22, so a connection closed before authentication is a refused attempt.
author: Hubert Jabłoński
date: 2026/10/04
logsource:
  product: sdp
  service: siem01
detection:
  selection:
    host.log: ssh
    ssh.event:
      - failed
      - invalid-user
      - closed-preauth
  condition: selection
tags:
  - attack.credential_access
  - attack.t1110
falsepositives:
  - "The operator offering a key the host does not accept (the canary)"
