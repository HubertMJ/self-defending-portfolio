# A login record of the host's own journal. User names and addresses are pseudonymised before they leave the
# host and host findings are published as counts only (ADR 0034).
title: SIEM host - SSH login accepted
id: be0a7f61-9416-4b12-a6bb-e597485e9538
status: experimental
level: low
description: >-
  An SSH login to the SIEM host succeeded. Only the ansible user may log in, with a key.
author: Hubert Jabłoński
date: 2026/10/04
logsource:
  product: sdp
  service: siem01
detection:
  selection:
    host.log: ssh
    ssh.event: accepted
  condition: selection
tags:
  - attack.lateral_movement
  - attack.t1021.004
falsepositives:
  - "The operator or Ansible logging in (the canary: an operator login)"
