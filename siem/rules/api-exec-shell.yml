# The portfolio API's own record of a catalogue command it started in a visitor's terminal (sdp-api,
# siem.command). The command id is fixed by the catalogue, so the technique is the catalogue's claim; the SIEM
# evidence that it happened comes from the other sources.
title: Terminal execution - interactive shell
id: c78e8dde-6c3b-4410-8425-bd3ccf82bd1a
status: experimental
level: medium
description: >-
  A visitor started an interactive shell in the attacker terminal (catalogue T1059.004); Falco answers it.
author: Hubert Jabłoński
date: 2026/10/04
logsource:
  product: sdp
  service: api
detection:
  selection:
    event.action: siem.command
    api.state: started
    api.technique: T1059.004
  condition: selection
tags:
  - attack.execution
  - attack.t1059.004
falsepositives:
  - "A visitor (or the canary) running this catalogue command on the public page - that is the point"
