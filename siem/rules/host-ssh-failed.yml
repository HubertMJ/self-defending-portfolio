# A login record of the host's own journal. User names and addresses are pseudonymised before they leave the
# host and host findings are published as counts only (ADR 0034).
title: k3s01 - SSH login refused
id: 0a66d582-41d5-41ed-9c45-074725c6f640
status: experimental
level: low
description: >-
  An SSH login to k3s01 was refused: a wrong key, or a user that may not log in.
author: Hubert Jabłoński
date: 2026/10/04
logsource:
  product: sdp
  service: host
detection:
  selection:
    host.log: ssh
    ssh.event:
      - failed
      - invalid-user
  condition: selection
tags:
  - attack.credential_access
  - attack.t1110
falsepositives:
  - "The operator offering a key the host does not accept (the canary)"
