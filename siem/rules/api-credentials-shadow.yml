# The portfolio API's own record of a catalogue command it started in a visitor's terminal (sdp-api,
# siem.command). The command id is fixed by the catalogue, so the technique is the catalogue's claim; the SIEM
# evidence that it happened comes from the other sources.
title: Terminal credentials - password database read
id: 8e8c5e64-5298-46cb-bb6f-45d11ff9f40b
status: experimental
level: medium
description: >-
  A visitor read /etc/shadow in the attacker terminal (catalogue T1003.008); Falco answers it.
author: Hubert Jabłoński
date: 2026/10/04
logsource:
  product: sdp
  service: api
detection:
  selection:
    event.action: siem.command
    api.state: started
    api.technique: T1003.008
  condition: selection
tags:
  - attack.credential_access
  - attack.t1003.008
falsepositives:
  - "A visitor (or the canary) running this catalogue command on the public page - that is the point"
