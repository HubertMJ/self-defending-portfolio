# DNS exfiltration (ADR 0034 "A scenario only correlation catches", ADR 0032 amendment): a flag-shaped
# DNS lookup from a pod (sdp-hubble) and the API's record of the dns-exfil command in that pod's
# terminal (sdp-api) within three minutes. Joined on k8s.pod.ref (<ns>_<pod>, S0-#1). Falco has no rule
# for name lookups, so this pair is the whole detection; the API matches the flag itself (ADR 0036) and
# cites this correlation when SA recorded it (S0-#13).
# Both queries are narrow because each bounds a join: SA runs a side's query over that side's documents
# for every finding of the OTHER log type - any rule of it, hubble-sandbox-policy-drop included - and
# checks the finding's own documents only for the join field (S0-e). The hubble query keeps an API
# finding to the lookups themselves (L7 DNS requests: event_type 129, not the reply, a few per lookup);
# the api query keeps a Hubble finding - a quarantined pod's drops among them - to the one started record
# of each dns-exfil command. With every flow carrying the exporter's stale dns.query (sdp.lua before
# d607ce1) one session's ~3,000 findings joined each other over five minutes and ran siem01 out of heap.
# Three minutes covers the detectors' one-minute interval and the ingest lag.
name: dns-exfil
time_window_ms: 180000
field: k8s.pod.ref
correlate:
  - source: hubble
    query: "hubble.event_type:129 AND hubble.is_reply:false AND _exists_:dns.query"
  - source: api
    query: "api.command_id:dns-exfil AND api.state:started"
