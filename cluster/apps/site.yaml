# Wave 4, beside hello: the landing page (image from HubertMJ/hubertjablon.ski). The detection lab
# preview at /lab/ moved to its own Application (cluster/apps/lab.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: site
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/HubertMJ/self-defending-portfolio.git
    targetRevision: main
    path: cluster/infra/site
  destination:
    server: https://kubernetes.default.svc
    namespace: site
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
