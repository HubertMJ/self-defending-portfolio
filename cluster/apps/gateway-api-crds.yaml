# Wave -2: the CRDs everything downstream is typed against.
#
# Cilium's operator creates the `cilium` GatewayClass only if gateway.networking.k8s.io/v1
# GatewayClass already exists, and cert-manager's gateway-shim only starts if the CRDs are there.
# Both are in later waves, so this must be first.
#
# On a cluster built by this repo the CRDs are already present: the Ansible cilium role applies the
# same pinned release before installing Cilium (ADR 0010). Server-side apply below makes this an
# adoption of those objects rather than a conflict.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/HubertMJ/self-defending-portfolio.git
    targetRevision: main
    # A kustomization whose only resource is the pinned upstream standard-install.yaml. Keeping it
    # in the repo rather than pointing Argo at the release URL means the pin is reviewable in a
    # diff and the version lives next to the reason for it.
    path: cluster/infra/gateway-api-crds
  destination:
    server: https://kubernetes.default.svc
    # CRDs are cluster-scoped; this namespace is only the default for anything that is not.
    namespace: default
  syncPolicy:
    automated:
      # Pruning CRDs deletes every Gateway and HTTPRoute with them. selfHeal keeps drift out;
      # removing a CRD is a decision that should be made by hand.
      prune: false
      selfHeal: true
    syncOptions:
      # Gateway API CRDs exceed the 262 144-byte limit of the client-side
      # kubectl.kubernetes.io/last-applied-configuration annotation. Server-side apply has no such
      # limit and is the only way these apply cleanly.
      - ServerSideApply=true
      - CreateNamespace=false
