# Wave 5: runtime detection, the sensor half (ADR 0013). Falco watches every syscall on the node with
# its modern eBPF probe and sends each alert as JSON to Falcosidekick in `falco-response`
# (cluster/apps/falco-response.yaml), which forwards it to Falco Talon for the response.
#
# Least privilege, as far as the probe allows (ADR 0012, ADR 0013):
#   * modern eBPF in leastPrivileged mode: four capabilities (BPF, PERFMON, SYS_RESOURCE, SYS_PTRACE)
#     instead of `privileged: true`, every other capability dropped;
#   * AppArmor Unconfined (the default profile blocks the bpf() calls), as a pod-level field;
#   * root, because the probe and /proc scanning need it - runAsUser left unset, never `0`;
#   * every host path mounted read-only;
#   * no Kubernetes API access and no k8smeta collector: pod and namespace names come from the
#     container runtime (CRI labels) through the container plugin;
#   * no falcoctl: the image already carries the rules (/etc/falco/falco_rules.yaml, including
#     "Terminal shell in container") and the container plugin (/usr/share/falco/plugins/
#     libcontainer.so), so Falco needs no internet and nothing changes the rules at run time except
#     a commit here.
#
# The namespace `falco` holds this DaemonSet and nothing else: its Pod Security admission is
# `privileged` (PSA cannot express "restricted minus four capabilities"), and the precise judgement is
# Kyverno's restricted-falco rule, which relaxes exactly the controls listed in
# cluster/infra/kyverno-policies/pod-security-restricted.yaml.
#
# One kustomize source: cluster/infra/falco/ renders the falco chart (helmCharts, with the values that
# used to be this file's valuesObject), patches its host mounts read-only, and adds the Namespace,
# the ServiceAccount, the default-deny NetworkPolicy and the CiliumNetworkPolicy. See that
# kustomization for why the chart is no longer a Helm source here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/HubertMJ/self-defending-portfolio.git
    targetRevision: main
    path: cluster/infra/falco
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      # The Namespace (privileged enforce, restricted audit) is a manifest in cluster/infra/falco.
      - CreateNamespace=false
