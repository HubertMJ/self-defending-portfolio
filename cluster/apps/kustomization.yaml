# The app-of-apps: the root Application points at this directory, so adding a component to the
# cluster is adding one file here.
#
# Sync waves, low to high:
#   -2  gateway-api-crds        CRDs the rest is typed against
#   -1  cilium                  CNI + Gateway API data plane (adopted from the Ansible install)
#    0  cert-manager            controller, webhook, CRDs
#    1  cert-manager-issuers    ClusterIssuers + the Cloudflare DNS-01 token (SOPS)
#    1  kyverno                 admission controller + CRDs
#    2  kyverno-policies        the ClusterPolicies it enforces (CRDs must exist first)
#    2  cloudflared             the tunnel (SOPS)
#    3  gateway                 the Gateway and its HTTP-to-HTTPS redirect
#    4  hello                   the page
#    5  policy-reporter         reports UI (cluster-internal) + Trivy CVE details plugin
#    5  trivy-operator          image vulnerability / config / RBAC scanning + PolicyReport adapter
#    5  kube-bench              daily CIS benchmark CronJob (k3s), results in the Job log
#    5  falco                   runtime detection: modern eBPF sensor (privileged namespace, 4 capabilities)
#    5  falco-response          Falcosidekick (alerts in) -> Falco Talon (kill / quarantine in sandbox)
#    5  sandbox                 restricted namespace for test victims, quarantine policy, Talon's Role
#    5  sandbox-unguarded       the twin of sandbox with no Talon reach: Falco detects, nothing responds
#    6  portfolio-api           /api: scenarios, attack runs in sandbox, live Falco/Talon feed, posture
#    6  siem-egress             no pod but the API may connect to the SIEM host siem01 (ADR 0034)
#
# Waves only order the first sync of a fresh cluster loosely: the root Application has no health
# check for its children, so it does not wait for one wave to be healthy before the next. Every
# Application has to converge on its own; the phase 4 ones carry a sync retry for that reason.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - gateway-api-crds.yaml
  - cilium.yaml
  - metrics-server.yaml
  - cert-manager.yaml
  - cert-manager-issuers.yaml
  - kyverno.yaml
  - kyverno-policies.yaml
  - cloudflared.yaml
  - gateway.yaml
  - hello.yaml
  - policy-reporter.yaml
  - trivy-operator.yaml
  - kube-bench.yaml
  - falco.yaml
  - falco-response.yaml
  - sandbox.yaml
  - sandbox-unguarded.yaml
  - portfolio-api.yaml
  - siem-egress.yaml
