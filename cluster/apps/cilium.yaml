# Wave -1: Argo CD adopts the Cilium release that Ansible installed.
#
# Ansible must install Cilium first (ADR 0004): without a CNI there is no pod network, so Argo CD
# itself cannot start. From this commit on, Ansible's copy is the seed and this file is the truth.
#
# Adoption, not reinstallation. The release name (`cilium`) and namespace (`kube-system`) here are
# identical to cilium_release_name / cilium_namespace in ansible/roles/cilium/defaults/main.yml, and
# Argo CD renders the chart and applies the resulting objects rather than driving Helm, so it takes
# ownership of the existing objects field by field. ServerSideApply=true is what makes that safe:
# it merges into the live objects and reports the fields Argo now owns, instead of demanding the
# client-side last-applied annotation that the Helm-created objects do not have. `Replace=true` is
# deliberately NOT set — replacing the Cilium DaemonSet on a single node means deleting the CNI out
# from under every running pod, including Argo CD.
#
# Consequence: `helm list -n kube-system` still shows the Ansible release. It is stale metadata, not
# a second installation; nothing reconciles from it any more. Do not run the Ansible cilium role
# again against a live cluster unless its values still match this file.
#
# The values below MUST stay identical to cilium_values in the Ansible role, image overrides
# included (ADR 0028). scripts/check-cilium-values.sh enforces this in CI.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io
    chart: cilium
    # Pinned; matches cilium_version in ansible/inventory/group_vars/k3s_nodes.yml (ADR 0008).
    targetRevision: 1.19.8
    helm:
      releaseName: cilium
      valuesObject:
        # --- identical to cilium_values in ansible/roles/cilium/defaults/main.yml ---
        # The agent, and its six init containers, from this repository: the 1.19.8 release with the
        # Go binaries rebuilt against fixed dependencies, on upstream's runtime layers (ADR 0028, as
        # operator.image below). Switched last, alone: on one node a broken agent is no pod network.
        image:
          # yamllint disable-line rule:line-length
          override: ghcr.io/hubertmj/self-defending-portfolio/cilium:main@sha256:5c5dcd9b1a13a333194166dfc94051cd7793ab7b65e9a653bd0d831e0d984e29
        kubeProxyReplacement: true
        k8sServiceHost: 10.4.1.20
        k8sServicePort: 6443
        routingMode: native
        ipv4NativeRoutingCIDR: 10.42.0.0/16
        autoDirectNodeRoutes: true
        ipam:
          mode: kubernetes
        bpf:
          masquerade: true
        operator:
          replicas: 1
          prometheus:
            enabled: false
          # Built here from the chart's release with fixed dependencies (ADR 0028). `override` is the
          # whole reference, the chart's repository/tag/digest are not used. Pinned by digest; bumped
          # with scripts/bump-image-digest.sh, which rewrites this file and the Ansible role together.
          image:
            # yamllint disable-line rule:line-length
            override: ghcr.io/hubertmj/self-defending-portfolio/cilium-operator-generic:main@sha256:d1158b4fee55dfdb1b9c100ab6b28faa698be53bf96e8c81e5ca2fbfe7852ef0
        hubble:
          enabled: true
          relay:
            enabled: true
            # ADR 0028, as operator.image above.
            image:
              # yamllint disable-line rule:line-length
              override: ghcr.io/hubertmj/self-defending-portfolio/hubble-relay:main@sha256:d51e22995ec6c98b77f9bb0e7e26b1c29388d488276b866e8cbb0ccffd760126
          ui:
            enabled: false
          # Flow export to a file on the node for the SIEM (ADR 0034, siem contract P2): only flows
          # with a pod in sandbox/ or sandbox-unguarded/ on either side, and a field mask that keeps
          # verdicts, drop reasons, pods, ports and DNS query names but drops addresses, node names
          # and labels. k3s01's Fluent Bit tails the file. A change here rolls the agent (maintenance
          # window), after which run.sh re-measures ADR 0032's quarantine latency.
          export:
            static:
              enabled: true
              filePath: /var/run/cilium/hubble/events.log
              fileMaxSizeMb: 10
              fileMaxBackups: 5
              allowList:
                - '{"source_pod":["sandbox/"]}'
                - '{"destination_pod":["sandbox/"]}'
                - '{"source_pod":["sandbox-unguarded/"]}'
                - '{"destination_pod":["sandbox-unguarded/"]}'
              fieldMask:
                - time
                - verdict
                - drop_reason_desc
                - traffic_direction
                - is_reply
                - source.namespace
                - source.pod_name
                - destination.namespace
                - destination.pod_name
                - l4
                - l7.type
                - l7.dns.query
                - l7.dns.rcode
                - event_type
        policyEnforcementMode: default
        # Which pod labels count towards a Cilium security identity (ADR 0032). The default list is
        # kept (these are appended ignore rules, so the whitelist flag stays off and every other
        # label is still identity-relevant); the two per-run labels the portfolio API stamps on a
        # scenario pod are taken out. They change on every run, so with them in the identity every
        # scenario pod - and every quarantined pod - is a fresh identity that has to be allocated and
        # have its policy computed before isolation can take effect. Out of the identity, all scenario
        # pods share one stable identity, and the quarantined identity (quarantine="true", still
        # identity-relevant) is stable too - so while it stays warm a quarantine is a label flip onto an
        # identity Cilium already knows. It does not stay warm forever: Cilium GCs an unused identity
        # (operator identityGCInterval 15m, identityHeartbeatTimeout 30m, chart defaults), so after a
        # quiet spell the first quarantine is a cold allocation again. run.sh measures both a first
        # (possibly cold) and an immediate second (warm) quarantine against the 3 s bound. The victim's
        # one allowed flow is selected by the stable app.kubernetes.io/managed-by label instead of the
        # run-id (cluster/infra/sandbox/ciliumnetworkpolicy-victim.yaml, portfolio-api CNP).
        labels: "k8s:!sdp.hubertjablon.ski/run-id k8s:!sdp.hubertjablon.ski/scenario"
        # Time an endpoint waits before using a changed identity, so other nodes can whitelist the
        # new one first (ADR 0032). This is a single node: there is no other node to wait for, and
        # the default 5 s is most of the seconds a visitor waited to see a quarantine bite. Dropped
        # to 500 ms - enough to order the identity change ahead of the endpoint regeneration, far
        # under the 3 s the demo needs. tests/scenarios/run.sh measures label-to-isolation live.
        identityChangeGracePeriod: "500ms"
        # The agent delays acting on a pod's changed labels by a random time up to identity-max-jitter
        # (default 30 s), to spread identity churn across a large cluster. Here it is the whole wait
        # between Talon's quarantine label and the pod being cut off (measured 10-36 s), on a node
        # with nothing to spread. Zero: a label change is acted on at once (ADR 0032, amendment).
        extraConfig:
          identity-max-jitter: "0s"
        # Restart the agent when its ConfigMap changes, so a value edited here takes effect on sync
        # instead of waiting for a manual rollout (the chart does not do that by default).
        rollOutCiliumPods: true
        # --- phase 2 additions (ADR 0010); not present in the Ansible role ---
        gatewayAPI:
          # The chart creates the `cilium` GatewayClass only when the Gateway API CRDs are already
          # registered (gatewayClass.create defaults to `auto`, which inspects the cluster's API
          # versions at render time). That is the reason gateway-api-crds sits in wave -2 and this
          # Application in wave -1, and the reason a first sync of a cluster without the CRDs
          # produces a Cilium with no GatewayClass rather than an error.
          enabled: true
          # Trust one proxy hop for X-Forwarded-For/X-Forwarded-Proto. The only path to the Gateway
          # is cloudflared (NetworkPolicy), which relays Cloudflare's headers; with 0 hops Envoy
          # overwrites X-Forwarded-Proto with its own scheme, so the http->https redirect and any
          # per-visitor rate limit would see the tunnel instead of the visitor.
          xffNumTrustedHops: 1
          # Nothing binds a host port: the only path in is the tunnel (ADR 0003). Envoy's listeners
          # stay inside the cluster and are reached through the Gateway's ClusterIP.
          hostNetwork:
            enabled: false
          # Copies Secrets referenced by a listener's certificateRefs into cilium-secrets so
          # Envoy's SDS can read them without cluster-wide Secret access.
          secretsNamespace:
            create: true
            name: cilium-secrets
            sync: true
        envoy:
          # Envoy as its own DaemonSet rather than embedded in the agent. The chart already defaults
          # to this for new installations, but the default is expressed as `null`, so it is stated
          # here: a chart bump must not be able to move the L7 data plane by changing a default.
          enabled: true
          # Upstream's image at the chart's digest plus Ubuntu's OpenSSL update; Envoy is untouched
          # (ADR 0028, as operator.image above).
          image:
            # yamllint disable-line rule:line-length
            override: ghcr.io/hubertmj/self-defending-portfolio/cilium-envoy:main@sha256:ea053fa661b97c6942dc8102e19105942ed37d5406d372a1a38d009c4e199df0
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  ignoreDifferences:
    # Cilium's operator writes the CA and the agent certificates into these Secrets at runtime.
    # They are generated, not declared, so Argo must not flag them as drift and must not revert them.
    - group: ""
      kind: Secret
      name: cilium-ca
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: hubble-server-certs
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: hubble-relay-client-certs
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      # Pruning would let a values typo delete the CNI. selfHeal still reverts manual drift.
      prune: false
      selfHeal: true
    syncOptions:
      # Required for adoption of the Ansible-installed objects; see the note at the top.
      - ServerSideApply=true
      - CreateNamespace=false
