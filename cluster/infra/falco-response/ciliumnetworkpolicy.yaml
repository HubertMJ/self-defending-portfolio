# Falcosidekick accepts alerts from the Falco DaemonSet only, and Falco Talon accepts them from
# Falcosidekick only (plan section 4.3). Neither HTTP API has authentication, so these two policies are
# what keeps any other pod from injecting a fake alert - which would be a way to get a pod in `sandbox`
# killed or quarantined.
#
# Sync wave -1: applied before the Deployment, as in the other phase 4 namespaces.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: falcosidekick
  namespace: falco-response
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: falcosidekick
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: falco
            app.kubernetes.io/name: falco
      toPorts:
        - ports:
            - port: "2801"
              protocol: TCP
    # The kubelet's probes (GET /ping on the same port).
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "2801"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Every alert at or above the Talon output's minimum priority, to Falco Talon.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: falco-talon
      toPorts:
        - ports:
            - port: "2803"
              protocol: TCP
    # The same alerts to the portfolio API's internal (webhook) port, for its live feed (ADR 0015).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: portfolio-api
            app.kubernetes.io/name: portfolio-api
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: falco-talon
  namespace: falco-response
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: falco-talon
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: falcosidekick
      toPorts:
        - ports:
            - port: "2803"
              protocol: TCP
    # The kubelet's probes (GET /healthz on the same port). The embedded NATS port (4222) is not
    # opened: it is only used inside the pod.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "2803"
              protocol: TCP
  egress:
    # The API server: Talon reaches it through the in-cluster service IP from its environment (no DNS),
    # and its k8sevents notifier writes Kubernetes Events. The `kubernetes` Service is DNAT-ed to the
    # API server's real port before policy is evaluated.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # The webhook notifier (talon/config.yaml): every action is reported to the portfolio API's
    # internal port (ADR 0015). Resolving that one name is the only DNS Talon gets; the URL is
    # absolute (trailing dot), so the resolver asks for exactly this name and never for a
    # search-domain variant that this rule would refuse.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: portfolio-api.portfolio-api.svc.cluster.local
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: portfolio-api
            app.kubernetes.io/name: portfolio-api
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
