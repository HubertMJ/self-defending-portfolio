# Falco Talon's response rules (ADR 0013, plan section 4.4; the phase 5 scenarios in ADR 0018). Only
# `sandbox` is ever acted on: every rule matches on the namespace output field, and Talon's RBAC
# (../talon-rbac.yaml) covers no other namespace, so a rule that matched elsewhere would fail with a
# 403 rather than act.
#
# Talon checks this file at start-up (`falco-talon rules check` runs the same validation offline).

# Delete the pod at once. grace_period_seconds 0: a shell in a sandbox pod is the Definition of Done's
# attack, and every second of grace is a second the attacker keeps. ignore_standalone_pods false: the
# DoD victim is a bare Pod, which the actionner would otherwise skip.
- action: Terminate Pod
  description: Delete the pod immediately
  actionner: kubernetes:terminate
  parameters:
    grace_period_seconds: 0
    ignore_standalone_pods: false
    ignore_daemonsets: true
    ignore_statefulsets: true

# Mark the pod; the standing CiliumClusterwideNetworkPolicy in cluster/infra/sandbox cuts all of its
# traffic, both ways, while the label is there. The actionner sends a JSON Patch `replace` on
# /metadata/labels/<key> (actionners/kubernetes/label/label.go at v0.3.0), which fails on a key that
# does not exist yet - so pods in `sandbox` carry the label as "false" from the start
# (tests/runtime/victim-pod.yaml). Lifting the quarantine is removing or resetting the label.
- action: Quarantine Pod
  description: Label the pod so the quarantine network policy isolates it
  actionner: kubernetes:label
  parameters:
    labels:
      sdp.hubertjablon.ski/quarantine: "true"

# The DoD rule: an interactive shell in a sandbox pod is killed. Terminate only, no label first: a
# label is a Pod UPDATE that goes through Kyverno's verify-portfolio-images webhook (failurePolicy
# Fail, 30 s timeout) and would sit in front of the kill.
- rule: Kill terminal shell in sandbox
  description: An interactive shell was opened in a sandbox pod
  match:
    rules:
      - Terminal shell in container
    output_fields:
      - k8s.ns.name=sandbox
  actions:
    - action: Terminate Pod

# The isolation rule: a network tool in a sandbox pod gets the pod quarantined, not killed, so the
# pod stays available for inspection.
- rule: Quarantine network tool in sandbox
  description: A network tool was started in a sandbox pod
  match:
    rules:
      - SDP network tool in sandbox
    output_fields:
      - k8s.ns.name=sandbox
  actions:
    - action: Quarantine Pod

# ---- phase 5 attack scenarios (ADR 0018; cluster/infra/sandbox/scenarios/scenarios.yaml) ----
#
# "shell-in-container" and "network-tool" are answered by the two rules above. The two below cover the
# other two scenarios, both with the existing Terminate Pod action, for the same reason as the DoD rule:
# a credential read and a dropped binary are post-compromise steps, and nothing about the pod is worth
# keeping once either has happened. Both Falco rules are stock rules of the Falco 0.45.0 image
# (/etc/falco/falco_rules.yaml), enabled by default; tests/scenarios/offline.sh checks that every rule
# named here exists in the rules Falco actually loads.

# Scenario "sensitive-file-read": a successful open of /etc/shadow (or sudoers, PAM config) by a
# program not on Falco's trusted list. WARNING, above Falcosidekick's `notice` cut-off.
- rule: Kill sensitive file read in sandbox
  description: A sensitive file such as /etc/shadow was read in a sandbox pod
  match:
    rules:
      - Read sensitive file untrusted
    output_fields:
      - k8s.ns.name=sandbox
  actions:
    - action: Terminate Pod

# Scenario "drop-and-execute": a process started from a binary in the container's writable overlay
# layer, i.e. not shipped in the image (container drift). CRITICAL.
- rule: Kill drifted binary in sandbox
  description: A binary that is not part of the image was executed in a sandbox pod
  match:
    rules:
      - Drop and execute new binary in container
    output_fields:
      - k8s.ns.name=sandbox
  actions:
    - action: Terminate Pod
