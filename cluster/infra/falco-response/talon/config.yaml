# Falco Talon's configuration (ADR 0013). Mounted at /etc/falco-talon/config.yaml by
# ../talon-deployment.yaml. No secret values: the one notifier (a webhook) posts to an in-cluster
# address without credentials, so this is a ConfigMap, not a Secret.
# JSON lines instead of the default `color`, which writes ANSI escapes even into a pipe (so the log
# could not be grepped reliably, ADR 0013 correction). One object per line, with keys such as
# "status", "actionner", "pod" and "namespace": what tests/runtime/run.sh and the phase 6 posture
# page read.
log_format: json
listen_address: 0.0.0.0
listen_port: 2803
# Reload rules.yaml when the ConfigMap volume changes. The configMapGenerator's hash suffix rolls the
# Deployment on a change anyway; this only shortens the window.
watch_rules: true
print_all_events: false
deduplication:
  # Leader election cannot be switched off in practice (the upstream chart renders `false` as `true`,
  # and the event publisher is only set once a leader is known), so it is on and stated. One replica
  # holds Lease falco-talon in $NAMESPACE (falco-response), renewed every 2 s; the Role in
  # ../talon-rbac.yaml grants exactly that Lease.
  leader_election: true
  time_window_seconds: 5
# One notifier: every action is posted to the portfolio API's internal port (ADR 0015), which shows
# it on the live feed and uses it to mark the visitor's run as "responded". Talon's own log (one
# `"status":"success"` line per action, with the pod and namespace) stays the record that
# tests/runtime/run.sh asserts on; a notification line carries the actionner and status but no pod,
# so it cannot satisfy that assertion by itself.
#
# The webhook notifier receives the same title-cased object keys as every notifier ("Pod",
# "Namespace", see below); the API matches them case-insensitively (app/api/internal/webhook).
# Absolute name (trailing dot): one DNS query, which is the only name ../ciliumnetworkpolicy.yaml
# lets Talon resolve. If the API is down, the notification fails and is logged at error level; the
# action itself has already run.
#
# The k8sevents notifier stays off because it cannot work in Talon 0.3.0. notifiers.Notify
# title-cases every object key ("namespace" -> "Namespace") before calling a notifier, but k8sevents
# reads the lowercase key, gets "", and falls back to namespace `default` with an empty pod name.
# Observed on the cluster: "events is forbidden ... in the namespace \"default\"" (ADR 0013,
# correction). Fixed upstream in 87dd820 (it reads Objects["Namespace"]) and 5d5808c (it sets the
# involved object's uid), both on main and both in the commit app/talon builds (ADR 0023) - but not
# in any release. The notifier stays off anyway: turning it on is its own change (the namespace-read
# ClusterRole, the events grant, and a look at what it writes), not a side effect of an image swap.
default_notifiers:
  - webhook
notifiers:
  webhook:
    url: http://portfolio-api.portfolio-api.svc.cluster.local.:8081/internal/talon
    http_method: POST
    content_type: application/json
otel:
  traces_enabled: false
  metrics_enabled: false
