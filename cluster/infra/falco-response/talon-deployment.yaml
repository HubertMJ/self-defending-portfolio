# Falco Talon, the response engine (ADR 0013): Falcosidekick POSTs every alert to it, and it runs
# the matching actions in talon/rules.yaml through the Kubernetes API.
#
# The image is this repository's own build (app/talon, ADR 0023): upstream main at d273e352 (v0.3.0
# plus bug fixes, same configuration keys) compiled with fixed dependencies, Trivy-gated, SBOM'd and
# cosign-signed by build-images.yml. Until then this ran docker.io/falcosecurity/falco-talon:0.3.0,
# whose 24 CRITICAL+HIGH findings no Talon release fixes. Being ours, it is also verified at
# admission: falco-response is in verify-portfolio-images, and restrict-image-registries admits only
# our registry path in this namespace, Falcosidekick's upstream image excepted - the workload here
# that holds API permissions now runs only an image our workflow signed. Pinned by digest in kustomization.yaml.
#
# Plain manifests modelled on the upstream falco-talon chart 0.5.0 (templates/deployment.yaml,
# services.yaml), not the chart itself: the chart writes `image.tag` into the app.kubernetes.io/version
# label, so a tag@digest pin (ADR 0008) renders an invalid label value and the API server rejects the
# Deployment, and the chart has no other place for a digest. Owning the manifests also removes the
# chart's always-rendered ClusterRole and ClusterRoleBinding; Talon's only permissions are the ones in
# talon-rbac.yaml and cluster/infra/sandbox/talon-rbac.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: falco-talon
  namespace: falco-response
  labels:
    app.kubernetes.io/name: falco-talon
spec:
  # One replica: leader election is always on (talon/config.yaml), so a second replica would only
  # stand by, and its memory is better spent elsewhere on one node.
  replicas: 1
  # One previous revision kept for a rollback, not the default ten. The older ones are ReplicaSets at 0
  # replicas that still carried the upstream image from before ADR 0023 and failed
  # restrict-image-registries forever, shown as violations on the posture page (ADR 0035).
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: falco-talon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falco-talon
    spec:
      serviceAccountName: falco-talon
      # Talon acts through the API server; this is the one workload in this namespace that needs a
      # token. What it may do with it is talon-rbac.yaml.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        # The image's own user: distroless nonroot (app/talon/Dockerfile), the same uid as the
        # upstream ko-built image this replaced.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: falco-talon
          # Pinned by digest in kustomization.yaml (ADR 0008, 0011); the tag is informational.
          image: ghcr.io/hubertmj/self-defending-portfolio/talon:main
          imagePullPolicy: IfNotPresent
          args: ["server", "-c", "/etc/falco-talon/config.yaml", "-r", "/etc/falco-talon/rules.yaml"]
          env:
            # The chart's extraEnv default is LOG_LEVEL=warning, which hides the per-action log line
            # tests/runtime/run.sh looks for.
            - name: LOG_LEVEL
              value: info
            # The namespace Talon takes its leader-election Lease in (internal/kubernetes/client/
            # client.go: Lease "falco-talon" in $NAMESPACE, default "falco"). Must be this namespace:
            # the Lease Role is here, and `falco` must not hold anything that talks to the API.
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 2803
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Plan section 3.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/falco-talon/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: rules
              mountPath: /etc/falco-talon/rules.yaml
              subPath: rules.yaml
              readOnly: true
            # The embedded NATS server (deduplication) enables JetStream without a store directory
            # (internal/nats/nats.go), so nats-server creates one under the temp dir at start-up.
            # Streams are memory-only; this only has to be writable.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: falco-talon-config
        - name: rules
          configMap:
            name: falco-talon-rules
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: falco-talon
  namespace: falco-response
  labels:
    app.kubernetes.io/name: falco-talon
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: falco-talon
  ports:
    - name: http
      port: 2803
      targetPort: http
      protocol: TCP
