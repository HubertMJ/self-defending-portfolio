# The non-chart half of cluster/apps/falco-response.yaml: the Namespace with its Pod Security labels,
# the network policy, and Falco Talon in full (Deployment, Service, ServiceAccount, RBAC, config and
# rules - see talon-deployment.yaml for why Talon is not deployed from its chart).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: falco-response

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - ciliumnetworkpolicy.yaml
  - talon-rbac.yaml
  - talon-deployment.yaml

# Talon's image, built and signed by .github/workflows/build-images.yml from app/talon (ADR 0023).
# Pinned by digest (ADR 0008); scripts/bump-image-digest.sh talon <digest> rewrites the line below,
# and tests/scenarios/offline.sh reads it, so the offline rules check runs the image the cluster runs.
# A placeholder digest is refused by `make validate` and CI (scripts/check-image-digests.sh).
images:
  - name: ghcr.io/hubertmj/self-defending-portfolio/talon
    newTag: main
    digest: sha256:ea4faf87416ea0f14a13eb3766d513719a32045281e616474326435c5a200363

configMapGenerator:
  # Hash-suffixed names: a changed rule or setting is a new ConfigMap and rolls the Deployment, which is
  # the reviewed path; Talon's own rules watch (watch_rules) only shortens the window.
  - name: falco-talon-config
    files:
      - talon/config.yaml
  - name: falco-talon-rules
    files:
      - talon/rules.yaml
