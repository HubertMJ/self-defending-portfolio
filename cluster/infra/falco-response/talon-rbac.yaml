# Falco Talon's identity and the part of its permissions that lives outside `sandbox` (ADR 0013). The
# permissions to act on pods are a Role in the sandbox namespace (cluster/infra/sandbox/talon-rbac.yaml),
# so Talon can touch pods there and nowhere else.
#
# What Talon 0.3.0 calls, read from its source at that tag:
#   * leader election: get/create/update Lease "falco-talon" in $NAMESPACE (internal/kubernetes/client);
#   * k8sevents notifier: get the acted-on pod's Namespace, create an Event in it (notifiers/k8sevents);
#   * kubernetes:terminate: get and delete the pod; kubernetes:label: patch the pod (in `sandbox`).
# Nothing else: no secrets, no exec, no nodes, no NetworkPolicies.
#
#   kubectl auth can-i delete pods -n hello --as=system:serviceaccount:falco-response:falco-talon   # no
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco-talon
  namespace: falco-response
---
# Leader election. `create` cannot be limited by resourceNames (the object does not exist yet at that
# point), so it applies to Leases in this namespace in general; get and update are pinned to the one
# Lease Talon uses.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: falco-talon-leader-election
  namespace: falco-response
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["falco-talon"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: falco-talon-leader-election
  namespace: falco-response
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: falco-talon-leader-election
subjects:
  - kind: ServiceAccount
    name: falco-talon
    namespace: falco-response
---
# The k8sevents notifier reads the Namespace object of the pod it acted on. Namespaces are
# cluster-scoped, so this has to be a ClusterRole - pinned by resourceNames to `sandbox`, the only
# namespace Talon acts in (user decision 2026-10-01). It is the only cluster-scoped grant Talon has.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: falco-talon-namespace-read
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["sandbox"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: falco-talon-namespace-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: falco-talon-namespace-read
subjects:
  - kind: ServiceAccount
    name: falco-talon
    namespace: falco-response
