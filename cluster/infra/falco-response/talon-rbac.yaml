# Falco Talon's identity and the part of its permissions that lives outside `sandbox` (ADR 0013). The
# permissions to act on pods are a Role in the sandbox namespace (cluster/infra/sandbox/talon-rbac.yaml),
# so Talon can touch pods there and nowhere else.
#
# What Talon 0.3.0 calls, read from its source at that tag (and unchanged at d273e352, the commit
# app/talon builds since ADR 0023: the terminate and label actionners and the Lease code call the
# same APIs):
#   * leader election: get/create/update Lease "falco-talon" in $NAMESPACE (internal/kubernetes/client);
#   * (k8sevents notifier: Namespace get + Event create - not used, see talon/config.yaml);
#   * webhook notifier (to the portfolio API, ADR 0015): plain HTTP, no Kubernetes API call at all;
#   * kubernetes:terminate: get and delete the pod; kubernetes:label: patch the pod (in `sandbox`).
# Nothing else: no secrets, no exec, no nodes, no NetworkPolicies, and nothing cluster-scoped.
#
#   kubectl auth can-i delete pods -n hello --as=system:serviceaccount:falco-response:falco-talon   # no
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco-talon
  namespace: falco-response
---
# Leader election. `create` cannot be limited by resourceNames (the object does not exist yet at that
# point), so it applies to Leases in this namespace in general; get and update are pinned to the one
# Lease Talon uses.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: falco-talon-leader-election
  namespace: falco-response
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["falco-talon"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: falco-talon-leader-election
  namespace: falco-response
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: falco-talon-leader-election
subjects:
  - kind: ServiceAccount
    name: falco-talon
    namespace: falco-response
