# Default-deny for the namespace, as in cluster/infra/hello; the one CiliumNetworkPolicy in
# ciliumnetworkpolicy.yaml opens what the sensor needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: falco
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
