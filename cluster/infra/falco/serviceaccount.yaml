# Falco's ServiceAccount, owned here instead of by the chart (cluster/apps/falco.yaml,
# serviceAccount.create: false) so that it can carry the one field the chart does not expose. The
# DaemonSet does not set automountServiceAccountToken itself, so this default applies: no API token in
# the sensor's filesystem. Falco reads pod and namespace names from the container runtime, not the API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco
  namespace: falco
automountServiceAccountToken: false
