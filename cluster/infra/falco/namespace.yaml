apiVersion: v1
kind: Namespace
metadata:
  name: falco
  labels:
    # The eBPF sensor needs four capabilities, read-only host paths and root, so PSA `enforce` has to be
    # privileged here; PSA cannot express "restricted minus these". The precise judgement is Kyverno's
    # restricted-falco rule (cluster/infra/kyverno-policies/pod-security-restricted.yaml), which relaxes
    # exactly those controls for the Falco image (ADR 0012). The namespace holds the Falco DaemonSet and
    # nothing else - nothing that talks to the API server, nothing that responds to alerts (that is
    # `falco-response`) - because the pod-level relaxations apply to whatever lands here.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    # `audit` stays restricted so the API server's audit log records the gap. No `warn`: it would repeat
    # the same known list on every sync.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
