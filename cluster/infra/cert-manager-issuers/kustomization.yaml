apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` transformer here on purpose. ClusterIssuers are cluster-scoped, and setting one
# would stamp a meaningless metadata.namespace onto them. The generated Secret carries its own
# namespace, from the encrypted file.
resources:
  - clusterissuer-staging.yaml
  - clusterissuer-prod.yaml

generators:
  # Requires kustomize.buildOptions: --enable-alpha-plugins --enable-exec (see
  # cluster/bootstrap/argocd/argocd-cm.yaml).
  - ksops.yaml
