# KSOPS generator (ADR 0006). kustomize runs the `ksops` exec plugin, which decrypts each listed
# file with the age identity mounted into argocd-repo-server and emits the plaintext resource into
# the build output. The plaintext never touches disk and never enters git.
#
# cloudflare-api-token.sops.yaml is committed (encrypted to the age recipient in .sops.yaml), next to
# its .example template. A fork deletes it and encrypts its own from the template; until that file
# exists, `kustomize build` of this directory fails with "no such file or directory" — loudly, at sync
# time, instead of silently producing a ClusterIssuer that references a Secret that does not exist.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: cert-manager-secret-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - cloudflare-api-token.sops.yaml
