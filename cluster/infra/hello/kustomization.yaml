apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hello

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - networkpolicy.yaml
  - ciliumnetworkpolicy.yaml

# The page lives in the image built by .github/workflows/build-images.yml (ADR 0011, 0016). Only the
# digest is referenced; the tag is informational. Bump = commit (Renovate later):
#   scripts/bump-image-digest.sh web sha256:<digest from the build-images run summary>
#
# The phase 6 frontend (app/web, ADR 0019), built by build-images.yml on main from phases 5/6 stage 1.
# The digest it replaces, signed by the phase 3 build-web.yml, was
# sha256:1f92875a0938d90fb1136d14aedc8fc64a1b97a6566da4ccb63b783313a7dfa5 (the rollback target while
# verify-portfolio-images still accepts that identity).
images:
  - name: ghcr.io/hubertmj/self-defending-portfolio/web
    newTag: main
    digest: sha256:7196d556feab615e8ecc4577085472e286f90bf94413ac7e745840041655fbd5
