apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hello

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - networkpolicy.yaml
  - ciliumnetworkpolicy.yaml

# The page lives in the image built by .github/workflows/build-images.yml (ADR 0011, 0016). Only the
# digest is referenced; the tag is informational. Bump = commit (Renovate later).
images:
  - name: ghcr.io/hubertmj/self-defending-portfolio/web
    newTag: main
    digest: sha256:1f92875a0938d90fb1136d14aedc8fc64a1b97a6566da4ccb63b783313a7dfa5
