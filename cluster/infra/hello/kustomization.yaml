apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hello

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - networkpolicy.yaml
  - ciliumnetworkpolicy.yaml

configMapGenerator:
  # Hash-suffixed, so editing index.html rolls the Deployment instead of waiting for nginx to
  # notice a changed mount.
  - name: hello-content
    files:
      - index.html
