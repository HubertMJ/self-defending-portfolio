# The route a visitor's request actually takes, and the place whose security headers win.
#
# Setting them here as well as in the image means they are enforced for every backend that ever
# attaches to this Gateway, they are a reviewable field in a typed API instead of a string in a
# config file, and swapping nginx for something else does not silently drop them. Since phase 6 the
# web image sends the same set itself (app/web/security-headers.conf, ADR 0019); `set` below replaces
# the image's value header by header, so the two must agree, which scripts/check-web-csp.sh asserts
# for the CSP.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
  namespace: hello
spec:
  parentRefs:
    - name: portfolio
      namespace: gateway
      sectionName: https
  hostnames:
    - hubertjablon.ski
  rules:
    # Cloudflare terminates the visitor's TLS and always reaches the tunnel origin over HTTPS, so
    # a plain-http visitor request still arrives here on the https listener. The edge tells us via
    # X-Forwarded-Proto; answer with a permanent redirect so HSTS can take over. Cloudflare's
    # "Always Use HTTPS" zone setting does the same one hop earlier; this rule makes the behaviour
    # part of the repository instead of a dashboard checkbox.
    - matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            - name: X-Forwarded-Proto
              value: http
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              # Two years, subdomains included. No `preload`: that is a one-way door and the
              # subdomains are not all serving HTTPS yet.
              - name: Strict-Transport-Security
                value: max-age=63072000; includeSubDomains
              # No MIME sniffing: a text/plain upload must never be executed as script.
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
              # The CSP of the site (ADR 0019), character for character the one in
              # app/web/security-headers.conf, which nginx sends and the Playwright suite enforces.
              # `set` replaces the backend's header, so this value is what a visitor gets; if the two
              # ever differ, the page is tested against one policy and served another, and
              # `make validate` (scripts/check-web-csp.sh) fails. Same-origin only: scripts, styles,
              # the /api calls and the event stream ('self'), Trusted Types enforced. Kept at the
              # route rather than dropped so that any backend attached here gets a policy, as
              # ADR 0010 intends.
              - name: Content-Security-Policy
                value: >-
                  default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self';
                  connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none';
                  frame-ancestors 'none'; object-src 'none'; require-trusted-types-for 'script';
                  trusted-types 'none'
              - name: Permissions-Policy
                value: accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()
              - name: Cross-Origin-Opener-Policy
                value: same-origin
      backendRefs:
        - name: hello
          port: 80
