apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: hello
  labels:
    app.kubernetes.io/name: hello
spec:
  replicas: 2
  # Two old ReplicaSets are enough to roll back with; the default ten kept ReplicaSets from before
  # phase 3, whose pod templates still name the upstream nginxinc image. They run no pods, but
  # Kyverno's background scan judges their templates too, so restrict-image-registries kept reporting
  # failures for objects nobody deploys. Old templates age out at the next rollouts.
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
    spec:
      automountServiceAccountToken: false
      securityContext:
        # 101 is the `nginx` user of the nginx-unprivileged base that app/web/Dockerfile builds on.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hello
      containers:
        - name: nginx
          # Our own image (app/web, built and signed by .github/workflows/build-images.yml, ADR 0011,
          # ADR 0016), based on nginx-unprivileged rather than nginx: the stock image starts as root
          # to bind port 80 and then drops privileges, which PSS `restricted` forbids outright; this
          # one listens on 8080 as uid 101 from the start. The tag here is informational:
          # kustomization.yaml's `images:` pins the digest that is actually pulled (ADR 0008).
          image: ghcr.io/hubertmj/self-defending-portfolio/web:main
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 10
          volumeMounts:
            # readOnlyRootFilesystem means nginx's three writable paths have to be provided. They
            # are the only writable bytes in the pod, they are per-pod, and they vanish on restart.
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 16Mi
        - name: run
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
