# Default-deny, identical to cluster/infra/sandbox/networkpolicy.yaml (ADR 0031). The twin keeps every
# preventive layer and is stricter in one: unlike `sandbox` it opens no DNS egress at all (no catalogue
# command resolves a name), so the only flow is ciliumnetworkpolicy-victim.yaml admitting the portfolio
# API to :8080. Nothing in a twin pod can reach anything else, in either direction.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: sandbox-unguarded
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
