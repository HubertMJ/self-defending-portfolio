# DNS out and nothing else, identical to cluster/infra/sandbox/ciliumnetworkpolicy.yaml (ADR 0031).
# The twin's network is just as locked down as `sandbox`: the point of the twin is the missing
# *response*, not a missing *control*. The network-tool scenario still targets the pod's own loopback,
# so no packet leaves the pod and no DNS query is made; this rule only keeps the namespace's preventive
# posture identical to sandbox's.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sandbox-unguarded-dns-only
  namespace: sandbox-unguarded
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
