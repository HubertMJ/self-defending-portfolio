apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  namespace: site
  labels:
    app.kubernetes.io/name: site
spec:
  replicas: 2
  # Two old ReplicaSets are enough to roll back with (as in cluster/infra/hello).
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: site
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: site
    spec:
      automountServiceAccountToken: false
      securityContext:
        # 101 is the `nginx` user of the nginx-unprivileged base that the site's Dockerfile builds on.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: site
      containers:
        - name: nginx
          # The landing page and /lab/, built and signed by HubertMJ/hubertjablon.ski's
          # .github/workflows/build-image.yml. The same nginx-unprivileged shape as hello: port 8080
          # as uid 101 from the start, as PSS `restricted` requires. The tag here is informational:
          # kustomization.yaml's `images:` pins the digest that is actually pulled (ADR 0008).
          image: ghcr.io/hubertmj/hubertjablon.ski/site:main
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 10
          volumeMounts:
            # readOnlyRootFilesystem means nginx's three writable paths have to be provided. They
            # are the only writable bytes in the pod, they are per-pod, and they vanish on restart.
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 16Mi
        - name: run
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
