# The landing page (/) and the detection lab's preview (/lab/): the image built from
# HubertMJ/hubertjablon.ski. The cluster page (/cluster/) stays in hello.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: site

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  # httproute.yaml joins at the cutover: until then the site runs but / still serves the cluster
  # page (checked by scripts/check-web-csp.sh all the same).
  - networkpolicy.yaml
  - ciliumnetworkpolicy.yaml

images:
  - name: ghcr.io/hubertmj/hubertjablon.ski/site
    newTag: main
    # HubertMJ/hubertjablon.ski 72562a4, build-image run 38601159127.
    digest: sha256:c44bd6b36c2377cddab8766d6ebe4656d82d0652edb94924159180f7639cab78
