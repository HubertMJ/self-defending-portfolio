# The landing page (/): the image built from HubertMJ/hubertjablon.ski. The detection lab preview
# (/lab/) is its own component (cluster/infra/lab); the cluster page (/cluster/) stays in hello.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: site

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - networkpolicy.yaml
  - ciliumnetworkpolicy.yaml

images:
  - name: ghcr.io/hubertmj/hubertjablon.ski/site
    newTag: main
    # HubertMJ/hubertjablon.ski e08d23e (PR #14 node panel; PR #13: five project cards, three of them systems from work,
    # linking to /work/ in cluster/infra/work; the ASCII popup inside an open dialog). cosign-verified
    # signed + SPDX SBOM (scripts/verify-image.sh).
    digest: sha256:e86ec43dfb67a27bf5b362c8dd15adb358ac5f044b3850f94ac4012f38041196
