# The landing page (/): the image built from HubertMJ/hubertjablon.ski. The detection lab preview
# (/lab/) is its own component (cluster/infra/lab); the cluster page (/cluster/) stays in hello.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: site

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - networkpolicy.yaml
  - ciliumnetworkpolicy.yaml

images:
  - name: ghcr.io/hubertmj/hubertjablon.ski/site
    newTag: main
    # HubertMJ/hubertjablon.ski 1a67aa8 (the /lab/ page moved to the detection-lab image; its route
    # left this site's HTTPRoute). cosign-verified signed + SPDX SBOM (scripts/verify-image.sh).
    digest: sha256:9de8c2b61bd467242146fd286333f10786002b92fd5d04ad759c1e656f4d338b
