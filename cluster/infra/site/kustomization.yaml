# The landing page (/): the image built from HubertMJ/hubertjablon.ski. The detection lab preview
# (/lab/) is its own component (cluster/infra/lab); the cluster page (/cluster/) stays in hello.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: site

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - networkpolicy.yaml
  - ciliumnetworkpolicy.yaml

images:
  - name: ghcr.io/hubertmj/hubertjablon.ski/site
    newTag: main
    # HubertMJ/hubertjablon.ski 870aada (PR #4: the Detection lab card is "live", not a design
    # preview -- green dot/top border, "Open the lab", hero says both projects run live; plus PR #5
    # which upgrades libx11 for Trivy CVE-2026-88806). cosign-verified signed + SPDX SBOM
    # (scripts/verify-image.sh).
    digest: sha256:30c4cd2871789539ba9a544db9e373e2a47afe5cc69caf137d49e1d99e4a454b
