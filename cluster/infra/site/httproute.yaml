# The landing page's route: `/` exactly, /lab and /site-assets go to the site image; everything
# else (the cluster page at /cluster/, its /assets/, /favicon.svg, /robots.txt, /build.json) stays
# on hello's `/` prefix and /api on portfolio-api. Gateway API ranks an exact match and a longer
# prefix above hello's `/`, so the two routes never compete for a path.
#
# The same headers as hello, character for character: one hostname, one policy. The site image's
# own security-headers.conf carries the same CSP.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site
  namespace: site
spec:
  parentRefs:
    - name: portfolio
      namespace: gateway
      sectionName: https
  hostnames:
    - hubertjablon.ski
  rules:
    # Plain http still arrives on the https listener (see hello); these paths outrank hello's
    # redirect rule, so they redirect here.
    - matches:
        - path:
            type: Exact
            value: /
          headers:
            - name: X-Forwarded-Proto
              value: http
        - path:
            type: PathPrefix
            value: /lab
          headers:
            - name: X-Forwarded-Proto
              value: http
        - path:
            type: PathPrefix
            value: /site-assets
          headers:
            - name: X-Forwarded-Proto
              value: http
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
    - matches:
        - path:
            type: Exact
            value: /
        - path:
            type: PathPrefix
            value: /lab
        - path:
            type: PathPrefix
            value: /site-assets
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              # Two years, subdomains included. No `preload`: that is a one-way door and the
              # subdomains are not all serving HTTPS yet.
              - name: Strict-Transport-Security
                value: max-age=63072000; includeSubDomains
              # No MIME sniffing: a text/plain upload must never be executed as script.
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
              # The CSP of the site (ADR 0019), character for character the one in
              # app/web/security-headers.conf, which nginx sends and the Playwright suite enforces.
              # `set` replaces the backend's header, so this value is what a visitor gets; if the two
              # ever differ, the page is tested against one policy and served another, and
              # `make validate` (scripts/check-web-csp.sh) fails. Same-origin only: scripts, styles,
              # the /api calls and the event stream ('self'), Trusted Types enforced. Kept at the
              # route rather than dropped so that any backend attached here gets a policy, as
              # ADR 0010 intends.
              - name: Content-Security-Policy
                value: >-
                  default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self';
                  connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none';
                  frame-ancestors 'none'; object-src 'none'; require-trusted-types-for 'script';
                  trusted-types 'none'
              - name: Permissions-Policy
                value: accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()
              - name: Cross-Origin-Opener-Policy
                value: same-origin
      backendRefs:
        - name: site
          port: 80
