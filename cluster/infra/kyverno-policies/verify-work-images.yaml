# The work mockups' image policy (cluster/infra/work, HubertMJ/work-mockups), the `work` namespace
# only. The exact same supply-chain checks as verify-lab-images.yaml - a cosign keyless signature and
# an SPDX SBOM attestation made by the repository's own build-image.yml workflow on refs/heads/main,
# discovered through the cosign v3 Sigstore bundle referrers - in its own ClusterPolicy, for the same
# reason the lab has one: a verifyImages rule's failureAction is resolved for the whole policy, so an
# Audit rule next to Enforce rules would be enforced anyway. See verify-portfolio-images.yaml's header
# for the mechanics (keyless/Fulcio/Rekor, SigstoreBundle, the two-field Audit<->Enforce switch).
#
# ---- Audit until the digest is pinned, then Enforce ----
#
# Audit because the first work image has not been built or signed yet and cluster/infra/work pins the
# all-zero placeholder digest: an Enforce rule would reject the work Deployment and `make validate`'s
# `kyverno apply` would fail. In Audit the placeholder is reported as an audit warning and is never
# admitted as verified. In the SAME commit that pins the real digest, flip both rules Audit -> Enforce
# and verify-signature-work's mutateDigest false -> true, exactly as verify-lab-images.yaml was flipped
# (5ca3db4); verify-sbom-attestation-work keeps mutateDigest/verifyDigest false.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-work-images
  annotations:
    policies.kyverno.io/title: Verify work mockups image signature and SBOM
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every container image in the `work` namespace must carry a cosign keyless signature made by
      HubertMJ/work-mockups' build-image.yml workflow on refs/heads/main, and an SPDX SBOM
      attestation signed by the same identity. Audit until the first work image is built and the
      digest pinned (see the header), then Enforce.
spec:
  # Fail, not Ignore, bounded to the one namespace below, as verify-lab-images.yaml is.
  failurePolicy: Fail
  # The same 30 s ceiling as verify-portfolio-images.yaml so a cold verification is not cut off.
  webhookTimeoutSeconds: 30
  # Admission only, same reasoning as verify-portfolio-images.yaml.
  background: false
  rules:
    - name: verify-signature-work
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - work
      verifyImages:
        - imageReferences:
            - "ghcr.io/hubertmj/work-mockups/*"
          type: SigstoreBundle
          # Audit for now; see the header. mutateDigest must be false while auditing (Kyverno refuses
          # an Audit rule that rewrites the image reference), and flips to true with the action.
          failureAction: Audit
          mutateDigest: false
          verifyDigest: true
          required: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    # HubertMJ/work-mockups' build-image.yml on main, anchored at both ends so no
                    # fork, pull_request run or other workflow in that repository satisfies it. The
                    # two-line YAML double-quoted continuation keeps it one unbroken regex under the
                    # column limit, as in verify-lab-images.yaml.
                    subjectRegExp: "^https://github\\.com/HubertMJ/work-mockups/\
                      \\.github/workflows/build-image\\.yml@refs/heads/main$"
                    issuer: https://token.actions.githubusercontent.com
                    rekor:
                      url: https://rekor.sigstore.dev

    - name: verify-sbom-attestation-work
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - work
      verifyImages:
        - imageReferences:
            - "ghcr.io/hubertmj/work-mockups/*"
          failureAction: Audit
          type: SigstoreBundle
          # Stay false in both states, as verify-portfolio-images.yaml's SBOM rule explains:
          # verify-signature-work already pins and verifies the digest.
          mutateDigest: false
          verifyDigest: false
          attestations:
            - type: https://spdx.dev/Document
              attestors:
                - count: 1
                  entries:
                    - keyless:
                        subjectRegExp: "^https://github\\.com/HubertMJ/work-mockups/\
                          \\.github/workflows/build-image\\.yml@refs/heads/main$"
                        issuer: https://token.actions.githubusercontent.com
                        rekor:
                          url: https://rekor.sigstore.dev
              conditions:
                - all:
                    # Shallow on purpose: a signed SPDX document exists and is ours; package-level
                    # judgement is Trivy's job.
                    - key: "{{ spdxVersion || '' }}"
                      operator: NotEquals
                      value: ""
                      message: >-
                        attestation is not an SPDX document: the predicate has no spdxVersion field
