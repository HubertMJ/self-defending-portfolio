# The companion to verify-portfolio-images, and not redundant with it.
#
# verify-portfolio-images says "images from ghcr.io/hubertmj/self-defending-portfolio/ must be signed
# by our workflow". It says nothing about an image from somewhere else entirely: a `docker.io/alpine`
# in the hello namespace matches none of its imageReferences, so it is simply out of scope and
# admitted. This policy closes that door from the other side - in the namespaces that serve the site
# and run the attack scenarios, there is exactly one place an image may come from. Together they mean:
# our registry path only, and signed.
#
# Enforce since phase 3, flipped together with verify-portfolio-images in the commit that moved hello
# to the signed image: before that, hello ran nginxinc/nginx-unprivileged, which this rule rejects
# outright. One grep shows all five policies' current actions:
#
#   grep -n 'failureAction' cluster/infra/kyverno-policies/*.yaml
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict image registries
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      In the namespaces that serve the site and run the demo scenarios, container images may only come
      from this project's own registry path. An image from any other registry or owner is rejected
      before it is pulled, so there is no path by which a third-party image runs there unverified.
spec:
  # Fail: bounded to the namespaces below (and, in falco-response, to Talon's pods), same reasoning
  # as verify-portfolio-images.
  failurePolicy: Fail
  # Pattern matching on a string, so there is a report to be had for pods that already exist.
  background: true
  rules:
    - name: validate-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
              # Kept identical to the namespace list in verify-portfolio-images.yaml: the two policies
              # are one statement about the same set of namespaces, and a divergence between them
              # would mean a namespace where origin is checked but provenance is not, or the reverse.
              # The one deliberate exception is falco-response, which verify-portfolio-images lists
              # whole and this policy covers through the second rule below, for Talon's pods only.
              namespaces:
                - hello
                - sandbox
                - portfolio-api
      validate:
        failureAction: Enforce
        message: >-
          Images in this namespace must come from ghcr.io/hubertmj/self-defending-portfolio/ - that is
          the only registry path whose contents this project builds and signs.
        pattern:
          spec:
            # Trailing `*` matches the repository name and the `:tag@sha256:...` suffix. The prefix is
            # anchored because Kyverno patterns are whole-string matches, so a registry named
            # `evil.example.com/ghcr.io/hubertmj/...` does not satisfy it.
            containers:
              - image: "ghcr.io/hubertmj/self-defending-portfolio/*"
            =(initContainers):
              - image: "ghcr.io/hubertmj/self-defending-portfolio/*"
            =(ephemeralContainers):
              - image: "ghcr.io/hubertmj/self-defending-portfolio/*"
    # Falco Talon in falco-response (ADR 0023). Talon runs this project's own signed build
    # (app/talon), and it is the workload there that holds Kubernetes API permissions (it deletes
    # and labels pods in `sandbox`), so its origin is pinned like the namespaces above. Scoped to its
    # pods by label rather than to the whole namespace because Falcosidekick, next to it, is still
    # docker.io's image and would be rejected by a namespace-wide rule; building it here too would
    # let this rule become a namespace in the list above. The label is the Deployment's selector
    # (cluster/infra/falco-response/talon-deployment.yaml), and only Argo CD writes to falco-response.
    - name: validate-registries-talon
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - falco-response
      # Talon's pods only, by the label the Deployment selects on. A precondition, not a
      # `match.selector`: a label selector in any rule switches off Kyverno's autogen for the whole
      # policy, which would take the Deployment-level rules (and the offline `kyverno apply` gate in
      # `make validate`, which only sees Deployments) away from validate-registries above too.
      # Autogen rewrites request.object.metadata to the pod template's for the controller rules.
      preconditions:
        all:
          - key: "{{ request.object.metadata.labels.\"app.kubernetes.io/name\" || '' }}"
            operator: Equals
            value: falco-talon
      validate:
        failureAction: Enforce
        message: >-
          Falco Talon's images must come from ghcr.io/hubertmj/self-defending-portfolio/ - that is
          the only registry path whose contents this project builds and signs.
        pattern:
          spec:
            # Same pattern as validate-registries.
            containers:
              - image: "ghcr.io/hubertmj/self-defending-portfolio/*"
            =(initContainers):
              - image: "ghcr.io/hubertmj/self-defending-portfolio/*"
            =(ephemeralContainers):
              - image: "ghcr.io/hubertmj/self-defending-portfolio/*"
