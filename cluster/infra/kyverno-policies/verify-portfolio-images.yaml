# Phase 3's Definition of Done: an image that this repository's GitHub Actions workflow did not sign
# does not run.
#
# There is no key anywhere in this repository. Signing is keyless (sigstore/fulcio): the workflow
# proves its identity with the GitHub-issued OIDC token, Fulcio mints a short-lived certificate whose
# SAN is the workflow's own identity URL, cosign signs the digest with it and logs the entry in Rekor.
# Verification is therefore an assertion about *who* produced the image, checked against a public
# transparency log - nothing to rotate, nothing to leak, and a forged signature would have to come
# with a Fulcio certificate issued to this exact workflow on this exact branch.
#
# Both rules run with `failureAction: Enforce`. They started in Audit and were flipped in the commit
# that pointed cluster/infra/hello at the signed digest (docs/bootstrap.md, "Phase 3"): while hello
# still ran nginxinc/nginx-unprivileged, which nobody signed, Enforce would have stopped the site, and
# Audit let the policy be observed working before it was load-bearing. One grep finds every action in
# the directory, across all five policies:
#
#   grep -n 'failureAction' cluster/infra/kyverno-policies/*.yaml
#
# Going back to Audit (for a rollback) is three lines, not two: verify-signature's `mutateDigest` has
# to move with its action, because Kyverno rejects a rule that rewrites the image reference while only
# auditing. The inline comment on that field spells it out. verify-sbom-attestation's `mutateDigest`
# stays false in both states.
#
# `validationFailureAction` at spec level is deprecated in kyverno.io/v1 (it is a whole-policy switch
# that predates per-rule actions), so the action lives on each rule instead.
#
# ---- why both rules say `type: SigstoreBundle` (ADR 0011, amendment 2026-10-01) ----
#
# cosign v3 (build-images.yml pins v3.1.3) writes the new Sigstore bundle format by default: the
# signature and the SPDX attestation are each stored as an OCI 1.1 referrer of the image digest, with
# artifactType application/vnd.dev.sigstore.bundle.v0.3+json. There are no `sha256-<digest>.sig` or
# `.att` tags any more. Kyverno's default `type: Cosign` verifier only looks for those tags, so it
# reported "no signatures found" / "no matching attestations" for an image that `cosign verify`
# accepts, and the hello Deployment could not sync. `type: SigstoreBundle` makes Kyverno discover the
# bundles through the referrers API instead. The other way out - building with
# `--new-bundle-format=false --use-signing-config=false` - was rejected: both flags are deprecated in
# cosign v3 and slated for removal, so it would only postpone this change.
#
# Known limitation, accepted: in SigstoreBundle mode the signature rule has no predicate filter. Any
# bundle that verifies against the identity below satisfies it - including the SBOM attestation
# bundle on its own. That is acceptable because the identity is pinned to this repository's image
# workflow file(s) on main (ADR 0016), so anything that satisfies it was produced by our own pipeline,
# and the presence of the SBOM is asserted separately and exactly by verify-sbom-attestation.
#
# Long term, ClusterPolicy is deprecated as of Kyverno 1.19 in favour of ImageValidatingPolicy
# (policies.kyverno.io/v1), which models Sigstore bundles natively. Migrating is a candidate for a
# later phase, not this one: it is a rewrite of the policy and of tests/admission, not a field change.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-portfolio-images
  annotations:
    policies.kyverno.io/title: Verify portfolio image signatures and SBOM
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every container image from this project's registry path must carry a cosign keyless signature
      made by the build-images.yml workflow on refs/heads/main (or, until hello's digest is rebuilt,
      the phase 3 build-web.yml), and an SPDX SBOM attestation signed by the same identity.
      Unsigned, foreign-signed or SBOM-less images are rejected.
spec:
  # Fail, not Ignore: if the admission controller cannot be reached, a Pod in these namespaces must
  # not be admitted unverified - "we could not check" and "it is signed" are not the same answer.
  # The blast radius of that choice is bounded by the `namespaces` list below; the cluster-wide
  # policy (disallow-latest-tag) deliberately makes the opposite trade.
  failurePolicy: Fail
  # Signature verification is a network round trip to GHCR (referrers and bundle blobs) and the
  # Sigstore TUF trusted root; the Rekor inclusion proof travels inside the bundle. The API server's
  # own 10 s default would cut a cold verification off mid-flight; 30 s is the documented ceiling for
  # a webhook and leaves room for a first-call TUF refresh.
  webhookTimeoutSeconds: 30
  # Admission only. A background scan would re-verify every existing Pod on every policy change and
  # on every resync, which means repeated registry and Rekor traffic for an answer that cannot change
  # for an immutable digest. It also could not mutate anything, which is half of what these rules do.
  background: false
  rules:
    - name: verify-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              # The single list of namespaces this project's own images run in. `sandbox` is created
              # in phase 5 for the attack scenarios; naming it now means the phase 5 commit adds a
              # namespace, not a policy exception. System namespaces are absent rather than
              # excluded: nothing outside this list is in scope, so nothing outside it needs a
              # carve-out, and no global resourceFilter had to be widened in
              # cluster/apps/kyverno.yaml to achieve that.
              # `portfolio-api` (phase 5, ADR 0015) is the one workload here that holds API
              # permissions - it creates and execs into pods in `sandbox` - so it is the last
              # place an unverified image may run.
              namespaces:
                - hello
                - sandbox
                - portfolio-api
                # falco-response runs our build of Talon (ADR 0020), the component that deletes and
                # quarantines pods. Only images under our registry path are checked here
                # (imageReferences), so Falcosidekick's upstream image is out of scope, which is also
                # why restrict-image-registries does not list this namespace.
                - falco-response
      verifyImages:
        # Only this project's images. A rule that matched `*` would demand our signature on
        # every third-party sidecar the cluster ever runs.
        - imageReferences:
            - "ghcr.io/hubertmj/self-defending-portfolio/*"
          # cosign v3 bundles live as OCI 1.1 referrers, not .sig tags; see the header comment. In
          # this mode the rule accepts any valid bundle from the identity below (no predicate
          # filter), which the header explains is acceptable.
          type: SigstoreBundle
          # ---- the phase 3 switch lives here, and it is two fields, not one ----
          #
          # Kyverno refuses to install a verifyImages rule that mutates the digest while only
          # auditing ("mutateDigest must be set to false for 'Audit' failure action"), and rightly
          # so: rewriting the image reference is a change to the workload, which is not something an
          # Audit rule is allowed to do. So the two flip together, and the Audit state has to say
          # mutateDigest: false.
          #
          #   Audit   -> mutateDigest: false
          #   Enforce -> mutateDigest: true
          #
          # mutateDigest matters because without it, verification proves something about the image
          # the tag pointed at during admission while the kubelet is free to pull whatever the tag
          # points at a second later - the classic time-of-check-to-time-of-use gap in tag-based
          # deployment. Rewriting the reference to the digest that was actually verified closes it.
          failureAction: Enforce
          mutateDigest: true
          # Refuse an image reference that cannot be pinned to a digest at all.
          verifyDigest: true
          # Without this, an image for which no signature data exists at all is treated as "no
          # applicable attestor" and admitted. This is the field that makes the policy a gate.
          required: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    # Who may sign: the workflow, by its own identity URL. Anchored at both ends so
                    # that neither a fork (.../OtherOwner/...) nor a pull_request run
                    # (@refs/pull/7/merge) nor a second workflow in this repository satisfies it.
                    # A regex rather than `subject:` because `subject` is an exact string and this
                    # value is long enough that a future tag-triggered build will want an
                    # alternative branch alongside the existing one.
                    # Broken across two lines with YAML's double-quoted line continuation (a
                    # trailing backslash drops the newline and the indentation that follows),
                    # so the value is one unbroken regex despite the 140-column limit.
                    #
                    # Two workflow files, both on refs/heads/main (ADR 0016): build-images.yml
                    # builds every image under app/ since phase 5; build-web.yml is the phase 3
                    # workflow that signed the web digest hello still runs.
                    # TRANSITION: drop `|build-web` once cluster/infra/hello pins a digest built
                    # by build-images.yml. The alternative grants nothing new meanwhile: the file
                    # no longer exists on main, and restoring it there takes the same write access
                    # as editing build-images.yml.
                    subjectRegExp: "^https://github\\.com/HubertMJ/self-defending-portfolio/\
                      \\.github/workflows/(build-images|build-web)\\.yml@refs/heads/main$"
                    # Who vouched for that identity: GitHub's OIDC provider. Pinning the issuer is
                    # what stops an identity minted by any other OIDC provider from matching the
                    # subject above.
                    issuer: https://token.actions.githubusercontent.com
                    rekor:
                      # In SigstoreBundle mode Kyverno does not read this URL: Rekor and Fulcio
                      # trust come from the Sigstore TUF trusted_root.json, and only ignoreTlog is
                      # honoured. It stays as documentation and for a return to `type: Cosign`.
                      # ignoreTlog is left at false: the log entry is the proof that the
                      # signature existed at a point in time, which is what makes a later key
                      # compromise detectable rather than retroactive.
                      url: https://rekor.sigstore.dev

    - name: verify-sbom-attestation
      # A signature says "we built this". An SBOM attestation says "and this is what is inside it",
      # signed by the same identity, which is what makes the phase 6 Trivy posture page's input
      # trustworthy rather than something re-derived from the image at display time.
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - hello
                - sandbox
                - portfolio-api
                - falco-response
      verifyImages:
        - imageReferences:
            - "ghcr.io/hubertmj/self-defending-portfolio/*"
          # Flips with verify-signature's failureAction above. The two mutateDigest fields do NOT
          # both flip, so do not sed this file: verify-signature already pins and verifies the
          # digest, and repeating that here would only mean a second registry round trip for an
          # answer already given. The two lines below stay false in both states.
          failureAction: Enforce
          # Same reason as verify-signature: the attestation is a Sigstore bundle referrer.
          type: SigstoreBundle
          mutateDigest: false
          verifyDigest: false
          attestations:
            # The in-toto predicateType of an SPDX document. In SigstoreBundle mode Kyverno compares
            # this string exactly with the statement's predicateType, so it must be the full URI:
            # cosign's short name `spdxjson` (what build-images.yml and scripts/verify-image.sh pass on
            # the command line) is mapped to this URI by the cosign CLI, and Kyverno does not know
            # the short name.
            - type: https://spdx.dev/Document
              attestors:
                - count: 1
                  entries:
                    - keyless:
                        # Kept identical to verify-signature's (TRANSITION note there).
                        subjectRegExp: "^https://github\\.com/HubertMJ/self-defending-portfolio/\
                          \\.github/workflows/(build-images|build-web)\\.yml@refs/heads/main$"
                        issuer: https://token.actions.githubusercontent.com
                        rekor:
                          url: https://rekor.sigstore.dev
              conditions:
                - all:
                    # Deliberately shallow: the point of this rule is that a signed SPDX document
                    # exists and was produced by our workflow, not that its contents pass a
                    # judgement. Package-level opinions are Trivy's job (phase 4).
                    #
                    # `|| ''` matters: a bare `{{ spdxVersion }}` against a predicate that has no
                    # such field is a variable-substitution error, which Kyverno reports as a rule
                    # error rather than as the clear "not an SPDX document" failure below.
                    - key: "{{ spdxVersion || '' }}"
                      operator: NotEquals
                      value: ""
                      message: >-
                        attestation is not an SPDX document: the predicate has no spdxVersion field
