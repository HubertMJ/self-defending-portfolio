# 301 everything on the HTTP listener to HTTPS. A Gateway API filter, not an annotation — the
# reason Gateway API was chosen over Ingress (ADR 0010).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: gateway
spec:
  parentRefs:
    - name: portfolio
      # Bound to the plaintext listener only, so the HTTPS listener is not caught in a loop.
      sectionName: http
  hostnames:
    - hubertjablon.ski
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
