# The single entry point for hubertjablon.ski.
#
# Cilium materialises this as a LoadBalancer Service named cilium-gateway-portfolio in this
# namespace (its address comes from lb-ip-pool.yaml and is never announced, ADR 0010 amendment).
# cloudflared reaches it by ClusterIP from inside the cluster; an externally reachable address would
# contradict ADR 0003.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: portfolio
  namespace: gateway
  annotations:
    # cert-manager's gateway-shim watches this annotation, reads the listeners' certificateRefs and
    # issues a Certificate for each hostname. Start on letsencrypt-staging (see
    # docs/bootstrap.md), then change this one word to letsencrypt-prod and push.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: cilium
  # Copied by Cilium onto the generated Service. A LoadBalancer Service also gets NodePorts, and the
  # eBPF load balancer (kube-proxy replacement) answers those on every node address before nftables'
  # input drop sees the packet: the Gateway was reachable from the LAN on k3s01:<nodePort>, without
  # Cloudflare in front (ADR 0010 amendment 2026-10-20). With this annotation Cilium installs the
  # ClusterIP frontend only - no NodePort, no LoadBalancer address in the datapath - which is the one
  # cloudflared uses. The Service stays type LoadBalancer, so LB IPAM still gives it its address and
  # the Gateway still reports Programmed. (The GatewayClass's CiliumGatewayClassConfig could only set
  # allocateLoadBalancerNodePorts: false, which still serves the LB address and needs a GatewayClass
  # of our own; this is one field on the Gateway.)
  infrastructure:
    annotations:
      service.cilium.io/type: ClusterIP
  listeners:
    # Port 80 exists only to redirect. Cloudflare already forces HTTPS to the visitor; this covers
    # anything that reaches the tunnel on plain HTTP.
    - name: http
      protocol: HTTP
      port: 80
      hostname: hubertjablon.ski
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              portfolio.hubertjablon.ski/gateway-routes: "true"
    - name: https
      protocol: HTTPS
      port: 443
      hostname: hubertjablon.ski
      tls:
        mode: Terminate
        certificateRefs:
          # Created by cert-manager in this namespace, then mirrored into cilium-secrets by
          # gatewayAPI.secretsNamespace.sync so Envoy's SDS can read it.
          - kind: Secret
            group: ""
            name: portfolio-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              portfolio.hubertjablon.ski/gateway-routes: "true"
