# The detection lab preview (/lab/): the image built from HubertMJ/detection-lab. The landing page
# (/) stays in cluster/infra/site and the cluster page (/cluster/) in hello.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lab

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - networkpolicy.yaml
  - ciliumnetworkpolicy.yaml
  # The daily real run (ADR 0034 amendment 2026-10-18): the CronJob, its own egress policy to siem01,
  # and the KSOPS generator for its SIEM client certificate.
  - cronjob.yaml
  - lab-runner-ciliumnetworkpolicy.yaml

images:
  - name: ghcr.io/hubertmj/detection-lab/lab
    newTag: main
    # HubertMJ/detection-lab main (commit 3b27fed; #36 lines apart), build-image on main: #21 Start run now and the
    # live run view; #22/#25 the lab's own diagram from the way in (in the hero, clickable, animated);
    # #23 the finished-run note; #24/#28 how four copies became one incident (a drawing); #26 the
    # image-build test fix; #27 the lost CSS brace. Pinned by hand, like cluster/infra/site's
    # hubertjablon.ski pin: scripts/bump-image-digest.sh only rewrites this project's own images, not
    # this foreign-repo ref. Verified signed with a verified SPDX SBOM attestation
    # (scripts/verify-image.sh, the detection-lab workflow identity).
    digest: sha256:5adadd5a68fc10fc2ed2e5977c819caa65b02684ea899e40eac0273101621664

# The lab-runner CronJob's SIEM client certificate (KSOPS, ADR 0034), made and encrypted by
# scripts/siem-lab-runner-cert.sh. The CronJob's own image digest is pinned in cronjob.yaml.
generators:
  - ksops.yaml
