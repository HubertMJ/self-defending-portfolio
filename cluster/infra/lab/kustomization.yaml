# The detection lab preview (/lab/): the image built from HubertMJ/detection-lab. The landing page
# (/) stays in cluster/infra/site and the cluster page (/cluster/) in hello.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lab

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - networkpolicy.yaml
  - ciliumnetworkpolicy.yaml
  # The daily real run (ADR 0034 amendment 2026-10-18): the CronJob, its own egress policy to siem01,
  # and the KSOPS generator for its SIEM client certificate.
  - cronjob.yaml
  - lab-runner-ciliumnetworkpolicy.yaml

images:
  - name: ghcr.io/hubertmj/detection-lab/lab
    newTag: main
    # HubertMJ/detection-lab main (commit 118c5e1: #17 the isolated-VM (variant B) real-run view on
    # /cluster/api/lab/latest, /vm and /raw; #18 libx11 upgraded in place for CVE-2026-88806),
    # build-image on main. Pinned by hand, like cluster/infra/site's hubertjablon.ski pin:
    # scripts/bump-image-digest.sh only rewrites this project's own images, not this foreign-repo ref.
    # Verified signed with a verified SPDX SBOM attestation (scripts/verify-image.sh, the
    # detection-lab workflow identity).
    digest: sha256:24cc2f85727721d01e1fda87681273f1cfab8e186688e00e7f297b8afd87385a

# The lab-runner CronJob's SIEM client certificate (KSOPS, ADR 0034), made and encrypted by
# scripts/siem-lab-runner-cert.sh. The CronJob's own image digest is pinned in cronjob.yaml.
generators:
  - ksops.yaml
