# Default-deny for the namespace, as in cluster/infra/hello. Every flow the operator, the Trivy
# server, the scan Jobs and the adapter need is a CiliumNetworkPolicy in ciliumnetworkpolicy.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: trivy-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
