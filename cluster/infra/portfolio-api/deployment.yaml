# The API (ADR 0015). One replica, Recreate, on purpose rather than for lack of a second node:
# the attack limits, the single-run slot, the replay buffer and the run <-> alert correlation are
# in-process state, and Falcosidekick and Talon each post to the Service, i.e. to one pod. Two
# replicas would mean two independent "one run at a time" limits and webhooks landing on the pod
# that does not own the run. Recreate keeps a rollout from briefly running two. The price is a few
# seconds of 503 per rollout, which the page rides out (EventSource reconnects on its own).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-api
  namespace: portfolio-api
  labels:
    app.kubernetes.io/name: portfolio-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: portfolio-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portfolio-api
    spec:
      serviceAccountName: portfolio-api
      # The one workload of ours that needs a token: what it may do with it is rbac.yaml.
      automountServiceAccountToken: true
      # Room for in-flight runs to delete their pods on SIGTERM (main.go waits up to 20 s).
      terminationGracePeriodSeconds: 30
      securityContext:
        # distroless `nonroot`.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Group of the mounted SIEM certificate files (mode 0440 below), so the key is readable by
        # the API's group and by nobody else.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Pinned by digest in kustomization.yaml (ADR 0008, 0011); the tag is informational.
          image: ghcr.io/hubertmj/self-defending-portfolio/api:main
          env:
            # Attack limits raised 20x from the contract's 3 per 10 min per visitor / 30 per hour in
            # total, at the owner's request (2026-10-03), until revoked. Concurrency stays 1 and the
            # sandbox ResourceQuota is unchanged, so the cluster-side blast radius is the same; only
            # the number of runs per window grows. Remove both entries to return to the defaults.
            - name: ATTACKS_PER_IP
              value: "60"
            - name: ATTACKS_GLOBAL
              value: "600"
            # Keeps the Go GC ahead of the memory limit instead of meeting the OOM killer there.
            - name: GOMEMLIMIT
              value: "100MiB"
            # The SIEM, a read-only client (ADR 0034): siem01's address, which its node certificate
            # names (IP SAN); the client certificate is the volume below.
            - name: SIEM_URL
              value: "https://10.4.2.10:9200"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: internal
              containerPort: 8081
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 500m
              memory: 128Mi
          # /api/healthz is outside the request budget and touches nothing but the process.
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          volumeMounts:
            # The scenario catalogue (owned with the scenarios, see kustomization.yaml). A directory
            # mount, not subPath, so the kubelet swaps in a changed ConfigMap and the API picks it up
            # without a restart.
            - name: scenarios
              mountPath: /etc/portfolio-api/scenarios
              readOnly: true
            # tls.crt, tls.key, ca.crt of portfolio-api-g<N> (siem-client.sops.yaml).
            - name: siem
              mountPath: /etc/portfolio-api/siem
              readOnly: true
      volumes:
        - name: scenarios
          configMap:
            name: scenarios
            # The API starts (and serves posture and the event stream) before the catalogue exists;
            # it simply lists no scenarios until then.
            optional: true
            items:
              - key: scenarios.yaml
                path: scenarios.yaml
        # The SIEM client certificate (KSOPS, ADR 0034). Optional: the API starts with the SIEM part
        # off when the Secret is missing. 0440 to the API's group only, the key never world-readable.
        - name: siem
          secret:
            secretName: portfolio-api-siem
            optional: true
            defaultMode: 288  # 0440, group = fsGroup
