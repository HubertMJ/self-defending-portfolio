# The API's identity and every permission it has (ADR 0015). Five grants, each where the objects
# live, and cluster-scoped only where the objects are spread across every namespace:
#
#   Role in sandbox            pods create/get/list/watch/delete, pods/exec create - run a scenario,
#                              wait for it, follow it, exec its command, delete it, find orphans after a
#                              crash
#   Role in sandbox-unguarded  the same, for the twin half of a `compare` run (ADR 0031): the API
#                              creates one pod here and one in sandbox from the same scenario. The twin
#                              gives Talon no reach, but the API still runs and polls its pods here.
#   Role in kube-bench         pods list, pods/log get - read the newest benchmark Job's output
#   Role in portfolio-api      configmaps get/update on `portfolio-stats` only - persist the public
#                              counters across restarts (ADR 0030). No create (the empty ConfigMap is in
#                              git), no other ConfigMap (resourceNames pins the one).
#   ClusterRole (read)      list PolicyReports, ClusterPolicyReports, VulnerabilityReports - they are
#                           written into every namespace that has workloads; list pods - which
#                           images run now, so reports of scaled-to-0 ReplicaSets are not counted
#                           (ADR 0015, amendment 2026-10-02)
#
# Narrower than the contract's maximum on purpose: no `get` on the reports (only listed), no Jobs
# (the pods carry the result), no secrets, no ConfigMaps beyond the one stats counter it writes in its
# own namespace (the scenarios are a mounted volume). It creates, execs, watches and deletes pods only in
# the two sandbox namespaces - `sandbox` and the unguarded twin `sandbox-unguarded` (ADR 0031) - and
# nowhere else; in kube-bench it only reads pod logs. `watch` on pods is scoped to those two namespaces
# and used on one pod at a time: the runner opens it with a field selector on the run's pod name and
# publishes what it sees as `event: pod` (ADR 0021) - the same pods it can already get and list, so it
# reveals nothing new.
#
# What the sandbox grants still mean: this ServiceAccount can create a pod of its choosing in `sandbox`
# or `sandbox-unguarded`. What such a pod can be is bounded elsewhere, not here - Pod Security
# `restricted` (namespace label), our signed images only (verify-portfolio-images,
# restrict-image-registries), the namespace ResourceQuota, default-deny networking, the
# activeDeadlineSeconds Kyverno bound (ADR 0031), and - in `sandbox` only - Falco/Talon acting on it.
#
#   kubectl auth can-i create pods -n hello   --as=system:serviceaccount:portfolio-api:portfolio-api  # no
#   kubectl auth can-i create pods/exec -n sandbox --as=system:serviceaccount:portfolio-api:portfolio-api  # yes
#   kubectl auth can-i get secrets -A         --as=system:serviceaccount:portfolio-api:portfolio-api  # no
#   kubectl auth can-i get pods -n hello      --as=system:serviceaccount:portfolio-api:portfolio-api  # no (list only)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portfolio-api
  namespace: portfolio-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portfolio-api-runner
  namespace: sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # A WebSocket exec is authorised as `create` since Kubernetes 1.31 (it used to be `get`); SPDY
  # was always `create`. No `get` needed on 1.35.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portfolio-api-runner
  namespace: sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portfolio-api-runner
subjects:
  - kind: ServiceAccount
    name: portfolio-api
    namespace: portfolio-api
---
# The same runner grant in the unguarded twin (ADR 0031). Identical verbs: a `compare` run creates and
# execs a pod here exactly as in `sandbox`. What differs is not the API's reach but Talon's - Talon has
# no Role in this namespace, so nothing responds to what Falco detects here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portfolio-api-runner
  namespace: sandbox-unguarded
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portfolio-api-runner
  namespace: sandbox-unguarded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portfolio-api-runner
subjects:
  - kind: ServiceAccount
    name: portfolio-api
    namespace: portfolio-api
---
# kube-bench writes its results to the Job's log only (ADR 0014: no report CRD, no sidecar), so the
# log is what the posture page reads. Pods, not Jobs: the newest Succeeded pod is the newest result.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portfolio-api-kube-bench-read
  namespace: kube-bench
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portfolio-api-kube-bench-read
  namespace: kube-bench
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portfolio-api-kube-bench-read
subjects:
  - kind: ServiceAccount
    name: portfolio-api
    namespace: portfolio-api
---
# The public counters' persistence (ADR 0030): one ConfigMap, portfolio-stats, in this namespace. get
# to read it at start, update to write it back (at most once a minute and on shutdown). resourceNames
# pins it to that single object, so this is not "ConfigMaps in portfolio-api" - it is this one counter.
# No create: the empty ConfigMap is in git (configmap-stats.yaml), so it always exists; Argo ignores its
# data (cluster/apps/portfolio-api.yaml) so the API's writes are not reverted. No delete, no others.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portfolio-api-stats
  namespace: portfolio-api
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["portfolio-stats"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portfolio-api-stats
  namespace: portfolio-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portfolio-api-stats
subjects:
  - kind: ServiceAccount
    name: portfolio-api
    namespace: portfolio-api
---
# The one cluster-scoped grant: list on three report kinds and on pods. Reports are summaries
# (policy, result, CVE counts), not secrets; the Trivy reports' details are already public in the
# Security tab and the images are public. Pods are listed only to learn which image digests run
# (status.containerStatuses[].imageID): a VulnerabilityReport outlives its pods while its ReplicaSet
# is kept at 0 replicas, and without this the page counted images nothing runs. `list` only - no
# get/watch, no pods/log, pods/exec or any subresource outside kube-bench and sandbox; pod specs
# carry no secret values here (Secrets are mounted or referenced, and Secrets stay unreadable).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portfolio-api-posture-read
rules:
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["policyreports", "clusterpolicyreports"]
    verbs: ["list"]
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["vulnerabilityreports"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portfolio-api-posture-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portfolio-api-posture-read
subjects:
  - kind: ServiceAccount
    name: portfolio-api
    namespace: portfolio-api
