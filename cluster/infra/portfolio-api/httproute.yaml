# /api on the portfolio Gateway (ADR 0015). Path-prefix matches are ranked by length before header
# matches, so this route wins over hello's `/` for everything under /api - which is why it repeats
# hello's HTTP-to-HTTPS redirect and sets its own response headers instead of inheriting them.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portfolio-api
  namespace: portfolio-api
spec:
  parentRefs:
    - name: portfolio
      namespace: gateway
      sectionName: https
  hostnames:
    - hubertjablon.ski
  rules:
    # As in cluster/infra/hello/httproute.yaml: Cloudflare reaches the tunnel origin over HTTPS
    # even for a plain-http visitor and says so in X-Forwarded-Proto.
    - matches:
        - path:
            type: PathPrefix
            value: /api
          headers:
            - name: X-Forwarded-Proto
              value: http
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
    # The event stream is one long response. Envoy's default route timeout (15 s) would cut it at
    # the first quiet moment, so the request timeout is switched off for this path only ("0s"
    # disables it, per the Gateway API spec). The stream is still bounded: the API closes it after
    # 30 minutes, and a 15 s heartbeat keeps Envoy's and Cloudflare's idle timers satisfied.
    - matches:
        - path:
            type: Exact
            value: /api/events
      timeouts:
        request: "0s"
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            # Same set on both API rules; keep them identical.
            set:
              - name: Strict-Transport-Security
                value: max-age=63072000; includeSubDomains
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: no-referrer
              # JSON and an event stream: nothing here is ever a document to render, frame or run.
              - name: Content-Security-Policy
                value: "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
              - name: Cross-Origin-Resource-Policy
                value: same-origin
      backendRefs:
        - name: portfolio-api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=63072000; includeSubDomains
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: no-referrer
              # JSON and an event stream: nothing here is ever a document to render, frame or run.
              - name: Content-Security-Policy
                value: "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
              - name: Cross-Origin-Resource-Policy
                value: same-origin
      backendRefs:
        - name: portfolio-api
          port: 80
