# The API (ADR 0015), deployed by cluster/apps/portfolio-api.yaml.
#
# No `namespace:` transformer on purpose: two of the Roles in rbac.yaml live in `sandbox` and
# `kube-bench`, next to the objects they grant access to, and a transformer would move them here.
# Every object names its namespace itself.
#
# The scenario catalogue (ConfigMap `scenarios`, key scenarios.yaml, namespace portfolio-api) is
# owned with the scenarios themselves, in cluster/infra/sandbox/scenarios/, and deployed as the second
# source of cluster/apps/portfolio-api.yaml. The Deployment's volume is optional, so the API starts
# (and lists no scenarios) if that source is missing.
#
# The API's SIEM client certificate (ADR 0034, the one SIEM credential in git) is a KSOPS Secret,
# siem-client.sops.yaml, made by scripts/siem-api-cert.sh: the key is generated on the operator's
# host, only its CSR goes to siem01, which signs it for portfolio-api-g<N> through the remote entry
# point. Its volume is optional too: without it the API runs with the SIEM part off.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - ciliumnetworkpolicy.yaml
  - rbac.yaml
  - configmap-stats.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml

# Built by .github/workflows/build-images.yml (ADR 0016). Only the digest is referenced; the tag is
# informational. Bump = commit.
#
# Bump with the digest from a build-images run summary:
#   scripts/bump-image-digest.sh api sha256:<digest>
# A placeholder digest is refused by `make validate` and CI (scripts/check-image-digests.sh).
images:
  - name: ghcr.io/hubertmj/self-defending-portfolio/api
    newTag: main
    digest: sha256:394a7c220bcde2f93b6e39d01aa166ce3cfdebba2ffeab2f718c94c8c4074886

generators:
  - ksops.yaml
