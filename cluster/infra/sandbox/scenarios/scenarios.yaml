    - id: drop-run
      input: "cp /bin/busybox /srv/shop/busybox && /srv/shop/busybox echo"
      aliases: ["drop and execute"]
      objective: execution
      technique: T1105
      # Named `busybox` on disk so the applet dispatch works (busybox picks its applet from argv[0]); a
