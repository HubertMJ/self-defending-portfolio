# The controlled attacks a visitor can trigger: four one-click scenarios (phase 5; ADR 0017 for the
# safety model, ADR 0018 for the detection -> response mapping) and one interactive `terminal` scenario
# the visitor types into (ADR 0032). This file is data for the portfolio API: kustomize turns it into
# ConfigMap `scenarios` in `portfolio-api`, key `scenarios.yaml` (./kustomization.yaml), and the API
# executes it. The format is the phase 5/6 contract:
#
#   id               stable identifier, the {id} of POST /api/attack/{id}; the API must not hardcode ids
#   title, summary   what the visitor reads before clicking
#   technique        MITRE ATT&CK technique id
#   detection        the Falco rule that fires (stock rules are in the Falco 0.45.0 image's
#                    /etc/falco/falco_rules.yaml, custom ones in cluster/infra/falco/kustomization.yaml customRules);
#                    "" for the interactive terminal, whose detections are per command below
#   response         what Falco Talon does: terminate (pod deleted) | quarantine (pod labelled, cut off);
#                    "" for the interactive terminal
#   timeout_seconds  <= 120; the API sets activeDeadlineSeconds from it and gives up after it
#   pod              a PodSpec. The API adds metadata (name <id>-<run id prefix>; namespace `sandbox`, or
#                    for a `compare` run also the no-egress twin `sandbox-unguarded`, ADR 0031; labels
#                    sdp.hubertjablon.ski/run-id, sdp.hubertjablon.ski/scenario,
#                    sdp.hubertjablon.ski/quarantine: "false" and app.kubernetes.io/managed-by:
#                    portfolio-api) and activeDeadlineSeconds, forces restartPolicy Never, no
#                    ServiceAccount token and no service links (which every spec here already sets),
#                    and changes nothing else
#   exec             {command, tty} run in container `target` once the pod is Ready, or null
#   pre_exec         optional {command}, run to completion in the same container *before* exec, never
#                    with a TTY (the API refuses tty: true); for an attack whose detected step fires
#                    the instant it starts, so its visible effect has to come first (scenario 1)
#   victim           true: the pod serves the "SDP Shop" on :8080 and the API polls its /state.json
#                    during the run (ADR 0022); absent or false: nothing to poll
#
# The interactive terminal (ADR 0032) adds these fields; the four one-click scenarios never set them:
#   interactive      true: no exec/pre_exec; the API runs the commands below one at a time, each only
#                    when the visitor asks, by command id (never free text - contract hard rule)
#   idle_seconds     no command for this long ends the run
#   objectives[]     {id, title} - what the visitor tries to reach, in kill-chain order; a command may
#                    count towards one (commands[].objective)
#   commands[]       the catalogue of what the visitor may run; the only thing the API accepts is an id:
#       id           stable, [a-z0-9-]{1,32}
#       input        what the visitor types; unique across the catalogue; <= 80 printable ASCII
#       aliases      other accepted spellings (the web's completion offers `input`, accepts these too)
#       objective    optional: the objectives[].id this counts towards
#       technique    MITRE ATT&CK id
#       command      argv run in container `target`
#       tty          a TTY is allocated (only `shell` needs one, for the terminal-shell rule)
#       outcome      allowed | prevented | detected - what happens, for the defence map's verdict
#       layer        which defence layer answers: edge | host | network | supply-chain | admission |
#                    pod-security | runtime (the one the web lights for this command)
#       control      one line naming what answers
#       detection    (outcome detected only) the Falco rule that fires
#       response     (outcome detected only) terminate | quarantine
#       explain      one or two sentences shown after the command ran
#
# What every pod spec has in common, and why (each one passes pod-security-restricted,
# require-pod-resources, restrict-image-registries and verify-portfolio-images - checked for every
# scenario by `make validate`, which renders them as Pods; scripts/lib/scenario_pods.py):
#   * the scenario image only, pinned by digest (one anchor, &scenario-image, so a bump is one line);
#   * PSS restricted: non-root uid 10001, no privilege escalation, every capability dropped, seccomp
#     RuntimeDefault; read-only root filesystem except where a scenario is *about* writing to it;
#   * no ServiceAccount token, no service links: nothing in the pod can talk to the API server, and the
#     environment lists no cluster services;
#   * the victim (ADR 0022) as the container's process: app/scenario's static fake-shop server on
#     :8080, docroot on a 1 MiB emptyDir at /srv/shop (the root filesystem stays read-only), Ready once
#     its exec probe has read /state.json back - so "Ready" means "the shop is up", and the exec never
#     races the server writing the healthy page. An exec probe, not httpGet: the kubelet's probes come
#     from the host, and the sandbox policy admits only the portfolio API to :8080
#     (../ciliumnetworkpolicy-victim.yaml). No Service, no route: the shop is not on the internet;
#   * terminationGracePeriodSeconds 0: a terminated scenario pod is gone at once;
#   * small requests and a hard memory and CPU limit, inside the sandbox LimitRange and ResourceQuota
#     (../limitrange.yaml, ../resourcequota.yaml).
#
# What each exec does to the victim *before* the step Falco detects (rewrite the page, rewrite
# state.json, both with busybox echo and mv), then `sleep 1`: the API polls the victim every 500 ms, so
# the visitor sees the shop change before Talon kills or cuts the pod. The detected step itself is the
# same process as before ADR 0022, started with `exec` so it replaces the shell: proc.name, its
# arguments and its parent are what the rule saw before. tests/scenarios/offline.sh checks both, the
# mutation and the rule's preconditions. The one exception is shell-in-container: there the detected
# step *is* the TTY shell starting, and Talon deletes the pod about 0.35 s later - a defacement written
# by that shell is gone before the 500 ms poll sees it. So the defacement is a separate pre_exec without
# a TTY (which no Talon rule acts on), with a 1.5 s pause, and the exec is the plain interactive shell.
#
# Exec exit codes are not a success signal: `wget` fails by design (nothing listens on the target) and
# a terminated pod ends the exec with an error. The API judges a run by the Falco and Talon events.

# ---------------------------------------------------------------------------------------------------
# 1. An interactive shell in a running container: Falco's stock "Terminal shell in container" (NOTICE)
#    requires a shell started directly by the container runtime (container_entrypoint) with a TTY, which
#    is exactly `kubectl exec -it <pod> -- sh`. Talon rule "Kill terminal shell in sandbox" deletes the
#    pod. tty: true is load-bearing: without a TTY this rule does not fire.
- id: shell-in-container
  title: Shell in a container
  summary: >-
    Opens an interactive shell inside a running, fully hardened pod - the first thing an attacker does
    after landing remote code execution. Falco sees a shell with a terminal attached; Talon deletes the
    pod within seconds.
  technique: T1059.004
  detection: Terminal shell in container
  response: terminate
  timeout_seconds: 90
  victim: true
  pod:
    restartPolicy: Never
    automountServiceAccountToken: false
    enableServiceLinks: false
    terminationGracePeriodSeconds: 0
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: target
        # Built by build-images.yml on main; bump with
        # `scripts/bump-image-digest.sh scenario sha256:<digest from the run's summary>`.
        # One unbroken line, so a bump is a one-line diff that a grep for the digest finds.
        # yamllint disable-line rule:line-length
        image: &scenario-image ghcr.io/hubertmj/self-defending-portfolio/scenario@sha256:79ce6670191eb019ffe8abdd11c7a6a872220a89c77ff4318fa95858f07efa7a
        # The victim (ADR 0022). Anchored here, aliased in the other three scenarios.
        command: &victim-command ["/usr/local/bin/victim", "-docroot", "/srv/shop"]
        ports: &victim-ports
          - name: shop
            containerPort: 8080
            protocol: TCP
        readinessProbe: &victim-probe
          exec:
            command: ["/usr/local/bin/victim", "-check"]
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 3
        volumeMounts: &victim-mounts
          - name: shop
            mountPath: /srv/shop
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
    # The shop's docroot. 1 MiB: a page and a state file; the scenario user can write it (emptyDir is
    # world-writable) and nothing else.
    volumes: &victim-volumes
      - name: shop
        emptyDir:
          sizeLimit: 1Mi
  # First, without a TTY: deface the shop (page and state) and wait 1.5 s, three of the API's polls,
  # so the visitor sees it. A shell without a TTY matches no rule Talon acts on (see the top).
  pre_exec:
    command:
      - sh
      - -c
      - >-
        cd /srv/shop
        && echo '<h1>SDP Shop has been defaced</h1><p>Owned through remote code execution.</p>' > .index
        && mv .index index.html
        && echo '{"status":"defaced","title":"H4CK3D - SDP Shop","banner":"Page defaced, attacker opening a shell"}' > .state
        && mv .state state.json
        && sleep 1.5
  # Then the interactive shell, exactly as before ADR 0022: `id` and `hostname` give the visitor
  # something to see; `sleep` keeps the shell alive so the kill is what ends it.
  exec:
    command: ["sh", "-c", "id; hostname; sleep 60"]
    tty: true

# ---------------------------------------------------------------------------------------------------
# 2. A network tool: the custom rule "SDP network tool in sandbox" (WARNING, cluster/infra/falco)
#    fires on the *start* of wget/nc/curl in a sandbox container; Talon rule "Quarantine network tool
#    in sandbox" labels the pod sdp.hubertjablon.ski/quarantine=true and the standing quarantine
#    CiliumClusterwideNetworkPolicy cuts all of its traffic. The pod keeps running, isolated.
#
#    The target is the pod's own loopback, discard port: nothing listens there, so wget fails with
#    "connection refused" without a packet leaving the pod. No external host, no cluster service, and
#    no DNS query is involved. No TTY (the shell that marks the victim has none), so rule 1 does not
#    fire as well.
- id: network-tool
  title: Download tool in a container
  summary: >-
    Runs wget inside a pod, the way an attacker fetches a second stage or talks to a command-and-control
    server. Falco flags the network tool; Talon quarantines the pod - it keeps running, but loses all
    network access, both ways.
  technique: T1071.001
  detection: SDP network tool in sandbox
  response: quarantine
  timeout_seconds: 90
  victim: true
  pod:
    restartPolicy: Never
    automountServiceAccountToken: false
    enableServiceLinks: false
    terminationGracePeriodSeconds: 0
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: target
        image: *scenario-image
        command: *victim-command
        ports: *victim-ports
        readinessProbe: *victim-probe
        volumeMounts: *victim-mounts
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
    volumes: *victim-volumes
  # Marks the shop as beaconing, then wget (exec'd, so wget is the process Falco sees start).
  exec:
    command:
      - sh
      - -c
      - >-
        cd /srv/shop
        && echo '{"status":"compromised","title":"SDP Shop","banner":"Beaconing to a command-and-control server"}' > .state
        && mv .state state.json
        && sleep 1
        && exec wget -q -T 2 -O /dev/null http://127.0.0.1:9/
    tty: false

# ---------------------------------------------------------------------------------------------------
# 3. A credential file read: Falco's stock "Read sensitive file untrusted" (WARNING) fires on a
#    *successful* open for reading (open_read requires fd.num >= 0) of /etc/shadow and friends by any
#    program not on its trusted list (`cat` is not on it). Talon rule "Kill sensitive file read in
#    sandbox" deletes the pod.
#
#    The non-root problem, and the answer: uid 10001 cannot open Alpine's /etc/shadow (root:shadow
#    0640); the open fails with EACCES and the rule, by design, does not fire on a failed open. So the
#    pod is given the `shadow` group (gid 42 in Alpine) as a supplemental group - PSS restricted allows
#    supplementalGroups - and the read succeeds without root and without loosening the file's mode in
#    the image. What the visitor sees is real but worthless: every account in the image is locked
#    (`*` / `!`), there is no password hash in the file.
- id: sensitive-file-read
  title: Read /etc/shadow
  summary: >-
    Reads the system password database from inside a pod, as an attacker hunting for credentials would.
    Falco flags an untrusted program opening a sensitive file; Talon deletes the pod.
  technique: T1003.008
  detection: Read sensitive file untrusted
  response: terminate
  timeout_seconds: 90
  victim: true
  pod:
    restartPolicy: Never
    automountServiceAccountToken: false
    enableServiceLinks: false
    terminationGracePeriodSeconds: 0
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      # The `shadow` group of the Alpine base image; see the scenario comment above.
      supplementalGroups: [42]
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: target
        image: *scenario-image
        command: *victim-command
        ports: *victim-ports
        readinessProbe: *victim-probe
        volumeMounts: *victim-mounts
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
    volumes: *victim-volumes
  # Marks the customer data as gone, then the read itself (cat, exec'd: `cat` opens the file).
  exec:
    command:
      - sh
      - -c
      - >-
        cd /srv/shop
        && echo '{"status":"compromised","title":"SDP Shop","banner":"Customer data exfiltrated"}' > .state
        && mv .state state.json
        && sleep 1
        && exec cat /etc/shadow
    tty: false

# ---------------------------------------------------------------------------------------------------
# 4. Container drift, drop and execute: Falco's stock "Drop and execute new binary in container"
#    (CRITICAL) fires when a process starts from an executable that is in the container's overlayfs
#    *upper* layer (proc.is_exe_upper_layer), i.e. one that was written after the container started
#    rather than shipped in the image. Talon rule "Kill drifted binary in sandbox" deletes the pod.
#
#    The "dropped binary" is a copy of the image's own busybox: no download (the sandbox allows DNS
#    and nothing else, the twin not even that, and the image has no package manager), no foreign code.
#    Named `busybox` so it actually runs (busybox picks its applet from argv[0]) and sleeps, so the kill
#    is what ends it.
#
#    The one deliberate relaxation in this file: readOnlyRootFilesystem is false here. The rule only
#    sees files in the overlay upper layer; an emptyDir at /tmp is a separate mount, not overlayfs, and
#    a binary run from it would not match. The writable layer is bounded by an ephemeral-storage limit,
#    and the pod is non-root, so it can write /tmp (1777) and nothing that belongs to the image.
- id: drop-and-execute
  title: Drop and run a new binary
  summary: >-
    Writes a new executable into a running container and starts it - the classic "download a payload
    and run it" step. Falco sees a process whose binary was not part of the image; Talon deletes the pod.
  technique: T1105
  detection: Drop and execute new binary in container
  response: terminate
  timeout_seconds: 90
  victim: true
  pod:
    restartPolicy: Never
    automountServiceAccountToken: false
    enableServiceLinks: false
    terminationGracePeriodSeconds: 0
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: target
        image: *scenario-image
        command: *victim-command
        ports: *victim-ports
        readinessProbe: *victim-probe
        volumeMounts: *victim-mounts
        securityContext:
          allowPrivilegeEscalation: false
          # Must be writable: see the scenario comment above.
          readOnlyRootFilesystem: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
            ephemeral-storage: 4Mi
          limits:
            cpu: 100m
            memory: 32Mi
            # busybox is under 1 MiB; anything that writes more than this gets the pod evicted.
            ephemeral-storage: 8Mi
    volumes: *victim-volumes
  # Marks an unknown binary as running, then the drop and the execution, unchanged.
  exec:
    command:
      - sh
      - -c
      - >-
        cd /srv/shop
        && echo '{"status":"compromised","title":"SDP Shop","banner":"Compromised: unknown binary running"}' > .state
        && mv .state state.json
        && sleep 1
        && cp /bin/busybox /tmp/busybox && exec /tmp/busybox sleep 60
    tty: false

# ---------------------------------------------------------------------------------------------------
# 5. The interactive terminal (ADR 0032). Unlike the four above, nothing runs on its own: the API
#    starts the pod, and the visitor types commands that are run one at a time, by id, in container
#    `target`. The pod is the same hardened victim shop on :8080, read-only root filesystem, no token,
#    plus the `shadow` group (so `cat /etc/shadow` can succeed, as scenario 3) and a per-run capture
#    flag the API injects as env SDP_FLAG; the victim writes it to /srv/shop/.flag (0600) and never
#    serves it (app/scenario/victim). The shop volume is 2 MiB here, not 1: `drop-run` copies busybox
#    into it, and it must fit next to the page, the state and the flag.
#
#    The commands are grouped by the kill chain. The quiet ones (recon, deface, read the flag) are
#    `allowed` or `prevented` and the run goes on; the loud ones (`beacon`, `read-shadow`, `shell`,
#    `drop-run`) are `detected` and end it - `beacon` by quarantine (the pod keeps running, cut off),
#    the others by termination. So a visitor who does the quiet things first gets further, which is the
#    lesson. Each command is proven under this pod's own security context in tests/scenarios/offline.sh:
#    an `allowed` one really succeeds, a `prevented` one really fails with the kernel's own error and
#    kills nothing, and a `detected` one really meets its Falco rule's preconditions.
#
#    Two custom Falco rules carry this scenario (cluster/infra/falco/kustomization.yaml): the existing
#    "SDP network tool in sandbox" (for `beacon`), and a new "SDP execution from shop volume" for
#    `drop-run` - the stock drift rule only sees the overlay upper layer, and /srv/shop is an emptyDir,
#    not overlayfs, so a binary run from it would otherwise slip past. Both fire in `sandbox` and in the
#    unguarded twin; the matching Talon rules pin k8s.ns.name=sandbox, so only the guarded pod is acted
#    on (ADR 0031).
- id: terminal
  title: Attacker's terminal
  summary: >-
    Drops you into a shell on a running, fully hardened pod and lets you try things by hand - look
    around, deface the shop, hunt for credentials, phone home - and watch which layer answers each move
    and how fast. Some commands the pod simply refuses; some Falco only watches; some get you cut off or
    killed mid-keystroke.
  technique: T1059.004
  detection: ""
  response: ""
  interactive: true
  timeout_seconds: 120
  idle_seconds: 30
  victim: true
  objectives:
    - {id: recon, title: "Look around"}
    - {id: tamper, title: "Deface the shop"}
    - {id: credentials, title: "Steal credentials"}
    - {id: execution, title: "Run your own code"}
    - {id: exfiltration, title: "Phone home"}
  pod:
    restartPolicy: Never
    automountServiceAccountToken: false
    enableServiceLinks: false
    terminationGracePeriodSeconds: 0
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      # Alpine's `shadow` group (gid 42), as scenario 3: so the `read-shadow` command can open
      # /etc/shadow without root and without loosening the file's mode. Every account in the image is
      # locked, so there is no hash to find - the detection is the point, not the contents.
      supplementalGroups: [42]
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: target
        image: *scenario-image
        command: *victim-command
        ports: *victim-ports
        readinessProbe: *victim-probe
        volumeMounts: *victim-mounts
        securityContext:
          allowPrivilegeEscalation: false
          # Read-only on purpose: it is what makes `touch /bin/backdoor` fail, and `drop-run` has to go
          # through the writable shop volume instead (which the custom execution rule then catches).
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
    volumes:
      # 2 MiB (the other scenarios use 1): the page, the state file, the flag, and room for the busybox
      # copy `drop-run` writes here. Still an emptyDir, so the root filesystem stays read-only.
      - name: shop
        emptyDir:
          sizeLimit: 2Mi
  commands:
    # ---- recon: allowed, Falco watching, no rule matches ----
    - id: whoami
      input: "id"
      aliases: ["whoami"]
      objective: recon
      technique: T1033
      command: ["id"]
      tty: false
      outcome: allowed
      layer: runtime
      control: "Falco is watching; plain recon matches no rule"
      explain: >-
        You are an unprivileged user (uid 10001) in a hardened pod. Falco sees this and lets it pass -
        looking around is not, by itself, an attack.
    - id: hostname
      input: "hostname"
      aliases: []
      objective: recon
      technique: T1082
      command: ["hostname"]
      tty: false
      outcome: allowed
      layer: runtime
      control: "Falco is watching; plain recon matches no rule"
      explain: >-
        The pod name, nothing more. No node name, no cluster detail - the pod was built without that
        information to leak.
    - id: ps
      input: "ps"
      aliases: ["ps aux"]
      objective: recon
      technique: T1057
      command: ["ps"]
      tty: false
      outcome: allowed
      layer: runtime
      control: "Falco is watching; plain recon matches no rule"
      explain: >-
        Only the shop server and your own command run here: one container, one job, nothing else to
        pivot to.
    - id: ls-shop
      input: "ls -la /srv/shop"
      aliases: []
      objective: recon
      technique: T1083
      command: ["ls", "-la", "/srv/shop"]
      tty: false
      outcome: allowed
      layer: runtime
      control: "Falco is watching; plain recon matches no rule"
      explain: >-
        The shop's files, writable by you because this directory is the one writable spot in the pod.
        Note the .flag - that is a goal.
    - id: caps
      input: "grep Cap /proc/self/status"
      aliases: []
      objective: recon
      technique: T1082
      command: ["grep", "Cap", "/proc/self/status"]
      tty: false
      outcome: allowed
      layer: pod-security
      control: "Pod Security: runs non-root, holds no Linux capabilities"
      explain: >-
        CapEff is all zeros: the pod runs as a non-root user and holds no Linux capabilities at all. That
        is why the next few tricks will not work.
    # ---- tamper: allowed and visible, because nothing watches an app writing its own docroot ----
    - id: deface
      input: "echo pwned>/srv/shop/index.html;echo '{\"status\":\"defaced\"}'>/srv/shop/state.json"
      aliases: ["deface"]
      objective: tamper
      technique: T1491.001
      # The argv is exactly the input, wrapped for the shell. It overwrites the shop's page and flips its
      # status file, both in the writable shop volume - no temp-and-rename here, since the terminal is a
      # person typing, not a poller that must never see a half-written file.
      command:
        - sh
        - -c
        - "echo pwned>/srv/shop/index.html;echo '{\"status\":\"defaced\"}'>/srv/shop/state.json"
      tty: false
      outcome: allowed
      layer: runtime
      control: "Falco is watching; an app rewriting its own files is not drift"
      explain: >-
        The shop window next to you just changed - you rewrote its page and its status. Nothing stopped
        you: writing to your own working directory is normal for an app, so no rule here watches for it.
    # ---- credentials: one allowed (the flag), one detected (/etc/shadow) ----
    - id: read-flag
      input: "cat /srv/shop/.flag"
      aliases: []
      objective: credentials
      technique: T1552.001
      command: ["cat", "/srv/shop/.flag"]
      tty: false
      outcome: allowed
      layer: runtime
      control: "Falco is watching; reading a file you can already open is not flagged"
      explain: >-
        You found this run's flag. Reading it was allowed - but detection is not prevention, and reading
        a secret inside the pod is not the same as getting it out past a default-deny network.
    - id: read-shadow
      input: "cat /etc/shadow"
      aliases: []
      objective: credentials
      technique: T1003.008
      command: ["cat", "/etc/shadow"]
      tty: false
      outcome: detected
      layer: runtime
      control: "Falco rule Read sensitive file untrusted -> terminate"
      detection: Read sensitive file untrusted
      response: terminate
      explain: >-
        Falco caught an untrusted program opening the password database and Talon deleted the pod. What
        you got was worthless anyway: every account in the image is locked, there is no hash in the file.
    # ---- prevented: the pod refuses, nothing is killed ----
    - id: touch-bin
      input: "touch /bin/backdoor"
      aliases: []
      technique: T1543
      command: ["touch", "/bin/backdoor"]
      tty: false
      outcome: prevented
      layer: pod-security
      control: "Read-only root filesystem (pod hardening, not required by PSS)"
      explain: >-
        "Read-only file system." The container's root filesystem is mounted read-only, so you cannot plant
        a backdoor in /bin. Nothing had to kill you - the write simply never happened.
    - id: read-token
      input: "cat /var/run/secrets/kubernetes.io/serviceaccount/token"
