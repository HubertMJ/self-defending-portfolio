# Falco Talon's permissions in `sandbox`, the only namespace it acts in (ADR 0013). Bound to the
# ServiceAccount in falco-response (cluster/infra/falco-response/talon-rbac.yaml).
#
#   pods get/delete  - kubernetes:terminate reads the pod (owner checks) and deletes it
#   pods patch       - kubernetes:label sets the quarantine label (JSON patch)
#
# Taken from Talon 0.3.0's source for the two actionners and the notifier in use, which is narrower
# than plan section 4.4: no pods `list` (only the drain and sysdig actionners list pods), and no events at
# all since the k8sevents notifier is off (talon/config.yaml). No `update` on pods, no pods/exec, no
# secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: falco-talon
  namespace: sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: falco-talon
  namespace: sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: falco-talon
subjects:
  - kind: ServiceAccount
    name: falco-talon
    namespace: falco-response
