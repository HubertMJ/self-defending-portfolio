# KSOPS is a kustomize KRM exec plugin, so both alpha plugins and exec must be enabled for
# `kustomize build` inside the repo-server. Without this the ksops generator is silently a no-op
# and the Secret never appears.
#
# Those two flags date from phase 2 (ADR 0006); phase 4 adds only the third.
# --enable-helm lets a kustomization render a Helm chart (`helmCharts`) with the helm binary Argo CD
# bundles, so a chart can be patched after rendering - Argo CD has no post-render step for Helm
# sources. Used by cluster/infra/falco to make the chart's host mounts read-only (ADR 0013, amendment
# 2026-10-01). The option is global, but it only does anything for a kustomization in this
# repository that declares helmCharts, i.e. it is reviewed like any other manifest.
#
# Bootstrap-owned: a change here is applied by hand, once (ADR 0005 amendment), after checking that
# the diff is only this ConfigMap:
#   kubectl diff -k cluster/bootstrap/argocd
#   kubectl apply -k cluster/bootstrap/argocd --server-side --force-conflicts
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  kustomize.buildOptions: --enable-alpha-plugins --enable-exec --enable-helm
  # Kinds the application controller does not watch, cache or show at all (ADR 0005, amendment
  # 2026-10-01).
  #
  # This key is a single string, and a strategic-merge patch replaces a ConfigMap value whole: it
  # cannot append to the list install.yaml ships. Since Argo CD 3.0 the upstream defaults live in
  # that string (they used to be compiled in), so everything above the Trivy block is copied
  # verbatim from v3.5.4/manifests/install.yaml. An Argo CD bump must re-diff this block against the
  # new install.yaml, or new upstream defaults are silently dropped:
  #   kubectl kustomize cluster/bootstrap/argocd | grep -A80 'resource.exclusions'
  #
  # The Trivy block: Trivy Operator (phase 4) writes one VulnerabilityReport, ConfigAuditReport,
  # SbomReport, ... per workload, rewritten on every rescan - thousands of objects on a cluster this
  # size, none of them in git. Tracking them would cost controller memory on an 8 GB node and fill
  # the UI with orphans, and the report numbers belong to Policy Reporter, not to Argo CD.
  # ClusterComplianceReport is deliberately NOT excluded: those objects are the compliance specs the
  # trivy-operator chart itself renders (templates/specs/*.yaml), so Argo CD must keep managing them;
  # an excluded kind that is also in an Application's manifests can never sync.
  resource.exclusions: |
    ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
    - apiGroups:
      - ''
      - discovery.k8s.io
      kinds:
      - Endpoints
      - EndpointSlice
    ### Internal Kubernetes resources excluded reduce the number of watched events
    - apiGroups:
      - coordination.k8s.io
      kinds:
      - Lease
    ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
    - apiGroups:
      - authentication.k8s.io
      - authorization.k8s.io
      kinds:
      - SelfSubjectReview
      - TokenReview
      - LocalSubjectAccessReview
      - SelfSubjectAccessReview
      - SelfSubjectRulesReview
      - SubjectAccessReview
    ### Intermediate Certificate Request excluded reduce the number of watched events
    - apiGroups:
      - certificates.k8s.io
      kinds:
      - CertificateSigningRequest
    - apiGroups:
      - cert-manager.io
      kinds:
      - CertificateRequest
    ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumIdentity
      - CiliumEndpoint
      - CiliumEndpointSlice
    ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
    - apiGroups:
      - kyverno.io
      - reports.kyverno.io
      - wgpolicyk8s.io
      kinds:
      - PolicyReport
      - ClusterPolicyReport
      - EphemeralReport
      - ClusterEphemeralReport
      - AdmissionReport
      - ClusterAdmissionReport
      - BackgroundScanReport
      - ClusterBackgroundScanReport
      - UpdateRequest
    ### Trivy Operator scan results (this repository, not upstream; see the comment above)
    - apiGroups:
      - aquasecurity.github.io
      kinds:
      - VulnerabilityReport
      - ClusterVulnerabilityReport
      - ConfigAuditReport
      - ClusterConfigAuditReport
      - ExposedSecretReport
      - RbacAssessmentReport
      - ClusterRbacAssessmentReport
      - InfraAssessmentReport
      - ClusterInfraAssessmentReport
      - SbomReport
      - ClusterSbomReport
