# Argo CD's repo-server needs no elevated capabilities, but it does run an init container that
# writes into an emptyDir, which "restricted" allows. "baseline" would also pass; restricted is
# the tighter of the two and the upstream manifests are compliant with it.
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
