# KSOPS integration (ADR 0006). Strategic merge patch, so the lists below are merged into the
# upstream Deployment by `name` rather than replacing it.
#
# The ksops image is distroless and has no shell, so the copy is done by the binary itself:
# `ksops install <dir>` drops the `ksops` binary into the shared emptyDir, and a subPath mount puts
# it on the repo-server's PATH, where kustomize finds it as an exec KRM function
# (`exec: path: ksops` in each ksops.yaml; needs --enable-alpha-plugins --enable-exec, argocd-cm).
#
# Only the plugin, not the kustomize the ksops image also carries. Until 2026-10-01 this used
# `--with-kustomize` and mounted that binary over /usr/local/bin/kustomize, so the repo-server ran
# kustomize v5.3.0 (ksops build) instead of the v5.8.1 Argo CD v3.5.3 ships. v5.3.0's helmCharts
# calls `helm version -c --short`, which the bundled Helm 4 rejects, so no kustomization could render
# a chart (ADR 0013, amendment). KSOPS itself only needs exec KRM functions, which v5.8.1 runs the
# same way (checked offline: a sops/age-encrypted Secret decrypts with kustomize 5.8.1 + this ksops).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      # The repo-server runs as uid 999 and the mounted age key must not be world-readable, so the
      # secret volume is group-owned by the pod's fsGroup and mode 0440.
      securityContext:
        fsGroup: 999
      initContainers:
        - name: install-ksops
          # Our build of KSOPS v4.5.1 (app/ksops, ADR 0020): only the static binary, compiled with a
          # current Go, signed by build-images.yml. viaductoss/ksops:v4.5.1 carried 109 CRITICAL/HIGH
          # findings with a fix (Go 1.25.0 stdlib, plus kustomize, git and glibc it ships but we never use).
          # Pinned by digest in kustomization.yaml (`images:`).
          image: ghcr.io/hubertmj/self-defending-portfolio/ksops
          command:
            - /usr/local/bin/ksops
            - install
            - /custom-tools
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # distroless nonroot (65532), stated so runAsNonRoot can be checked against a number.
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools
      containers:
        - name: argocd-repo-server
          env:
            # SOPS looks for the age identity relative to XDG_CONFIG_HOME; the repo-server's HOME
            # is not writable, so both are pointed at an explicit path.
            - name: XDG_CONFIG_HOME
              value: /.config
            - name: SOPS_AGE_KEY_FILE
              value: /.config/sops/age/keys.txt
          volumeMounts:
            # No mount over /usr/local/bin/kustomize: the repo-server keeps Argo CD's own kustomize.
            - name: custom-tools
              mountPath: /usr/local/bin/ksops
              subPath: ksops
            - name: sops-age
              mountPath: /.config/sops/age
              readOnly: true
      volumes:
        - name: custom-tools
          emptyDir: {}
        - name: sops-age
          secret:
            # Created by cluster/bootstrap/bootstrap.sh from $SOPS_AGE_KEY_FILE on the operator
            # machine. It is the one secret that cannot come from git, because it is the key that
            # decrypts everything that does come from git.
            secretName: sops-age
            defaultMode: 288  # 0440, readable by fsGroup 999 only
            items:
              - key: keys.txt
                path: keys.txt
