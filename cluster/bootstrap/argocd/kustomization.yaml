# Argo CD install, patched for KSOPS and for a LAN-only (no public) UI, without Dex (no SSO), the
# ApplicationSet controller or the notifications controller (none of them used; ADR 0023, ADR 0024),
# running this repository's build of the same release (ADR 0027).
# Pinned by the release commit in the resource URL (ADR 0008); an Argo CD bump is a one-line diff.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  # Argo CD v3.5.4 non-HA install, by the commit tag v3.5.4 points at (the same commit app/argocd's
  # ARGOCD_COMMIT pins), so a moved tag cannot change what is applied; there is no "stable" alias.
  - https://raw.githubusercontent.com/argoproj/argo-cd/d6d5b248ce00e1a2c512068002a93d3319767087/manifests/install.yaml
  - root-application.yaml

# Argo CD's Redis (a cache only: nothing in it survives a restart or needs to) one patch release ahead
# of the 8.2.3-alpine that v3.5.4's install.yaml names, because v3.5.4 is still the newest Argo CD
# 3.5 release and 8.2.3-alpine carries 11 CRITICAL+HIGH findings in the cluster (OpenSSL in the
# Alpine base among them), all fixed in later 8.2 patches. Same 8.2 line, so the same protocol and
# configuration; 8.2.10-alpine scans 0 CRITICAL/HIGH (ADR 0023). Pinned by tag and digest
# (ADR 0008); the digest is the multi-arch index, identical on public.ecr.aws and docker.io:
#   docker buildx imagetools inspect public.ecr.aws/docker/library/redis:8.2.10-alpine
# An Argo CD bump that moves install.yaml past this Redis makes this entry the older one: drop it
# then rather than pin Redis backwards.
images:
  - name: public.ecr.aws/docker/library/redis
    newTag: 8.2.10-alpine
    digest: sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
  # KSOPS for the repo-server's init container (argocd-repo-server-ksops.yaml): this repository's
  # build of the v4.5.1 release, app/ksops (ADR 0024), built, Trivy-gated and signed by
  # build-images.yml. Pinned by digest (ADR 0008); `scripts/bump-image-digest.sh ksops <digest>`
  # rewrites the line below, scripts/validate-cluster.sh reads it (so a local KSOPS render runs the
  # same binary), and a placeholder is refused by `make validate` and CI
  # (scripts/check-image-digests.sh). Bootstrap-owned like everything here: a new digest reaches
  # the cluster only through `kubectl apply -k cluster/bootstrap/argocd` (docs/bootstrap.md 8.6).
  - name: ghcr.io/hubertmj/self-defending-portfolio/ksops
    newTag: main
    digest: sha256:4946421eb86eecebab52a1bc151090c069b6221eb2503ad65a419b54019db542
  # Argo CD itself - argocd-server, the repo-server and its copyutil init container, the application
  # controller and Redis's secret-init init container all run install.yaml's
  # quay.io/argoproj/argocd:v3.5.4 - replaced by this repository's build of the same release,
  # app/argocd (ADR 0027): argo-cd at the v3.5.4 commit with the helm, kustomize and git-lfs releases
  # it ships, all with fixed dependencies, on upstream's own base, user and paths. This one entry
  # rewrites all five references, so no Deployment is patched for it. The image's ARGOCD_COMMIT and
  # the install.yaml URL above must name the same commit: an Argo CD bump changes both together.
  # Pinned by digest (ADR 0008); `scripts/bump-image-digest.sh argocd <digest>` rewrites the line
  # below, a placeholder is refused by `make validate` and CI, and a new digest reaches the cluster
  # only through `kubectl apply -k cluster/bootstrap/argocd` (docs/bootstrap.md 8.9). Not checked by
  # Kyverno at admission, by design (ADR 0027).
  - name: quay.io/argoproj/argocd
    newName: ghcr.io/hubertmj/self-defending-portfolio/argocd
    newTag: main
    digest: sha256:c6fce0b42d3e0cf360edc1f383b0777c1f0680137e6daed9169e34025976305b

patches:
  - path: argocd-cm.yaml
  - path: argocd-cmd-params-cm.yaml
  - path: argocd-repo-server-ksops.yaml
  # No SSO, so no Dex: every Dex object in install.yaml is deleted (ADR 0023).
  - path: argocd-dex-server-delete.yaml
  # No ApplicationSets and no notification triggers anywhere, so neither controller runs (ADR 0024).
  # The ApplicationSet CRD and the empty argocd-notifications-secret stay; each file says why.
  - path: argocd-applicationset-controller-delete.yaml
  - path: argocd-notifications-controller-delete.yaml
