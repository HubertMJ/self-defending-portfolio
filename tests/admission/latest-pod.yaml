# A floating tag (ADR 0008). Same restricted-compliant shape as unsigned-pod.yaml, for the same
# reason: the only thing a policy can object to here is the image reference.
#
# Namespace `default`, explicitly, and for the same reason as workload-policy-pods.yaml: it is outside
# restrict-image-registries and verify-portfolio-images, which are failurePolicy Fail webhooks that
# would reject a docker.io image in `hello` before disallow-latest-tag (failurePolicy Ignore, a separate
# webhook) is evaluated, so the denial would not be attributable. Everything else here is valid, so
# :latest is the only violation.
apiVersion: v1
kind: Pod
metadata:
  name: admission-test-latest-tag
  namespace: default
  labels:
    app.kubernetes.io/name: admission-test
  annotations:
    tests.hubertjablon.ski/expect-policy: disallow-latest-tag
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: docker.io/library/busybox:latest
      command: ["/bin/false"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
