# Managed by Ansible (role: sysctl)
# Cilium requires reverse path filtering off on every interface. The glob
# is the point: rp_filter is per interface, systemd-sysctl re-applies
# matching globs through udev for each device Cilium creates, and this
# file sorts after anything that might set rp_filter back to 1 or 2
# (upstream systemd's 50-default.conf does; Debian 13 omits it).
net.ipv4.conf.*.rp_filter = 0
