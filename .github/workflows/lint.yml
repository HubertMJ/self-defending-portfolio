name: lint
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ansible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ansible-galaxy collection install -r ansible/requirements.yml -p .ansible/collections
      - run: yamllint -c .yamllint.yml .
      - run: ansible-lint --offline ansible
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
      - name: ansible-playbook --syntax-check
        working-directory: ansible
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
        run: for p in playbooks/*.yml; do ansible-playbook --syntax-check "$p"; done

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >-
          shellcheck scripts/*.sh cluster/bootstrap/*.sh tests/*.sh tests/admission/*.sh tests/runtime/*.sh tests/abuse/*.sh
          tests/scenarios/*.sh app/*/test/*.sh

  validate:
    # Argo CD auto-syncs cluster/, so this job is the last cheap place a broken manifest can be
    # caught. It renders every kustomization and validates the output against the real Kubernetes
    # and CRD schemas, then renders every Helm chart Application and runs the Kyverno policies over
    # all of it (ADR 0012). Tooling runs in containers pinned by digest inside the scripts (ADR 0008).
    # Needs the network at run time - chart repositories, ghcr.io (kyverno-cli image, hello's signature
    # and SBOM bundles) and the Sigstore TUF CDN - and fails closed when any of them is down.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: python helpers
        # PyYAML and Jinja2 only; the scripts read YAML, and the Cilium check renders the Ansible
        # role's Jinja templates to compare resolved values.
        run: pip install 'PyYAML==6.0.2' 'Jinja2==3.1.6'
      - name: no plaintext Secret objects (ADR 0006)
        run: scripts/check-secrets-encrypted.sh
      - name: ansible and argo cd must agree about cilium
        run: scripts/check-cilium-values.sh
      - name: the hello route serves the web image's CSP (ADR 0019)
        run: scripts/check-web-csp.sh
      - name: no placeholder image digests (ADR 0016)
        run: scripts/check-image-digests.sh
      - name: kustomize build + kubeconform, helm template + kyverno apply
        run: scripts/validate-cluster.sh
      - name: the SIEM shipper's filter under the pinned Fluent Bit (ADR 0034)
        # HMAC-SHA256 against RFC 4231 and Python's hmac, allow-list projection, the F1/F2/F3/F13
        # rules, on the F0 fixtures (debian:13 by digest + the pinned deb, SHA256-checked).
        run: tests/siem/lua-hmac.sh

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (pinned container, same as `make gitleaks`)
        run: >
          docker run --rm -v "$PWD":/repo
          zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          git /repo --redact --no-banner

  smoke:
    # Applies hardening.yml twice to a throwaway systemd container; the second run must be changed=0.
    runs-on: ubuntu-24.04
    needs: [ansible]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tests/smoke.sh
