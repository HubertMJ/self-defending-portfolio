# Every image this project runs is built here: one job per app/<name>/Dockerfile, each published as
# ghcr.io/hubertmj/self-defending-portfolio/<name>, Trivy-gated, described by an SPDX SBOM and signed
# keylessly with cosign. Kyverno refuses to admit any of them unless this workflow signed it
# (ADR 0011 for the pipeline, ADR 0016 for why it is one workflow for all images).
#
# The signature is keyless: the identity is *this file on main*, minted by GitHub's OIDC provider
# and certified by Sigstore Fulcio. There is no private key anywhere, so there is no key to leak,
# and the thing Kyverno trusts is a workflow path in a public repo that anyone can read.
#
# One workflow with a matrix, not a reusable workflow called once per image: Fulcio puts the
# *called* workflow's path into the certificate of a reusable workflow, so the identity Kyverno pins
# would be one that any workflow - and, for a public repository, any other repository - can obtain
# by calling it. A matrix job's identity is this file, and only this file (ADR 0016).
#
# Adding an image is adding app/<name>/Dockerfile. Nothing here names an image.
#
# Every action is pinned to a full commit SHA with the tag it corresponded to in a comment
# (ADR 0008); a tag is mutable, a commit is not.
name: build-images

on:
  push:
    branches: [main]
    paths:
      - app/**
      - .github/workflows/build-images.yml
  workflow_dispatch:

# Two pushes to main must not race to publish the `main` tag of an image and leave it pointing at the
# older digest. Not cancel-in-progress: a build that already signed should finish and be recorded.
concurrency:
  group: build-images
  cancel-in-progress: false

# Nothing by default; each job asks for what it uses.
permissions: {}

jobs:
  # Which images to build: on a push, those whose app/<name>/ changed; everything when this workflow
  # itself changed, when the push cannot be diffed (first push of the branch, force push), and on a
  # manual run.
  discover:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: list images
        id: list
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mapfile -t all < <(find app -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n' | xargs -rn1 basename | sort)
          for name in "${all[@]}"; do
            # The name becomes part of an image reference and a cache scope; refuse anything odd
            # rather than quote around it.
            [[ $name =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || { echo "::error::invalid image directory app/$name"; exit 1; }
          done

          selected=("${all[@]}")
          if [ "$EVENT" = push ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            if ! grep -qx '.github/workflows/build-images.yml' <<<"$changed"; then
              selected=()
              for name in "${all[@]}"; do
                grep -q "^app/$name/" <<<"$changed" && selected+=("$name")
              done
            fi
          fi
          json=$(printf '%s\n' "${selected[@]}" | jq -R . | jq -cs 'map(select(. != ""))')
          echo "images=$json" >> "$GITHUB_OUTPUT"
          echo "building: $json"

  build:
    needs: discover
    if: needs.discover.outputs.images != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # OIDC token for cosign keyless signing
      security-events: write # Trivy SARIF -> code scanning
    strategy:
      # One broken image must not stop the others from being published.
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.discover.outputs.images) }}
    env:
      IMAGE: ghcr.io/hubertmj/self-defending-portfolio/${{ matrix.name }}
      CONTEXT: app/${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # An image with a browser test suite (app/<name>/playwright.config.ts - today only web) must
      # pass it before anything is built or pushed. Lint, unit tests and the bundle run inside the
      # image's own builder stage; end-to-end tests need a browser, which does not belong in it.
      # Still generic: the condition is a file, not an image name.
      - name: set up node (e2e)
        if: hashFiles(format('app/{0}/playwright.config.ts', matrix.name)) != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.CONTEXT }}/package-lock.json

      - name: e2e tests (playwright, chromium)
        if: hashFiles(format('app/{0}/playwright.config.ts', matrix.name)) != ''
        working-directory: ${{ env.CONTEXT }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: upload playwright report
        if: failure() && hashFiles(format('app/{0}/playwright.config.ts', matrix.name)) != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.name }}-${{ github.sha }}
          path: ${{ env.CONTEXT }}/playwright-report
          if-no-files-found: ignore

      - name: set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `latest`. A Kyverno policy forbids it in the cluster (ADR 0008) and the manifests pin a
      # digest anyway; `main` exists only so a human can see what the branch currently points at.
      # Every image is labelled with the commit and the run that built it, so `docker inspect` on any
      # digest leads back to a public Actions run (ADR 0035).
      - name: tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            ski.hubertjablon.ci.run-id=${{ github.run_id }}

      # provenance/sbom off: buildx would attach its own attestation manifests to the image index,
      # which changes the digest shape and makes `cosign sign <image>@<digest>` ambiguous about what
      # it covered. We produce the SBOM explicitly below and sign the image manifest we pushed.
      # The GHA cache is scoped per image, so the images do not evict each other's layers.
      #
      # GIT_SHA and CI_RUN_ID go to the api and web images only: the page shows what each was built
      # from and links the commit and the run (ADR 0035), and the api links its rule and policy
      # references to the exact commit (ADR 0021). The one place this file names images, because a
      # build argument no Dockerfile declares is a warning on every other build, and a declared one
      # invalidates the build cache from its ARG onward on every push - a cost only an image that uses
      # the value should pay. (Digests change on every build anyway, through the run-id label.)
      - name: build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ contains(fromJSON('["api","web"]'), matrix.name) && format('GIT_SHA={0}', github.sha) || '' }}
            ${{ contains(fromJSON('["api","web"]'), matrix.name) && format('CI_RUN_ID={0}', github.run_id) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # An image with its own smoke test (app/<name>/test/image-smoke.sh: web and the four Cilium
      # images) runs it against the digest just pushed, the way the cluster runs it, before anything
      # signs it: a failure means the digest is never signed, so Kyverno never admits it. Generic, like
      # the e2e step: the condition is a file, not an image name.
      #
      # The scripts report each failed check as an `::error::` annotation, readable from the run's
      # public annotations without the (login-only) job log. A script that dies before it can say why
      # still leaves one, from here.
      - name: image smoke test
        if: hashFiles(format('app/{0}/test/image-smoke.sh', matrix.name)) != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          rc=0
          "${CONTEXT}/test/image-smoke.sh" "${IMAGE}@${DIGEST}" || rc=$?
          if [ "$rc" -ne 0 ]; then
            msg="${CONTEXT}/test/image-smoke.sh exited ${rc} for ${IMAGE}@${DIGEST}; failed checks are annotated above"
            echo "::error title=image smoke test (${NAME})::${msg}"
            exit "$rc"
          fi

      # The gate, on the digest that was actually pushed rather than on a tag that could have moved
      # between the push and now. ignore-unfixed: a CVE with no upstream patch is not something this
      # pipeline can act on, so failing on it would only teach us to ignore red builds.
      #
      # It runs after the push on purpose, as it did for the web image alone: the digest is then
      # exactly what was scanned, and a failed gate means the digest is never signed, so Kyverno
      # will never admit it anyway.
      - name: trivy gate (CRITICAL,HIGH)
        id: gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # The same image for the Security tab, but *without* ignore-unfixed: the gate above deliberately
      # lets unpatchable CVEs through, and the Security tab is where they should still be visible
      # rather than silently dropped. exit-code 0 keeps the gate as the only verdict, and `always()`
      # means a failed gate still reports what it found instead of just that it failed.
      #
      # Only when the gate actually ran: this step reuses the trivy binary and DB the gate installed
      # (skip-setup-trivy), so after an earlier failure (say the smoke test) the gate is skipped and
      # this step would only add a second, misleading "trivy: command not found" failure.
      - name: trivy sarif
        id: sarif
        if: always() && steps.build.outputs.digest != '' && (steps.gate.outcome == 'success' || steps.gate.outcome == 'failure')
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # The gate already installed trivy and populated the DB cache in this job.
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          # Without this the SARIF ignores `severity` and reports every level; keep the two runs
          # scoped to the same severities so the Security tab matches what the gate judges.
          limit-severities-for-sarif: true
          exit-code: "0"
          skip-setup-trivy: true

      # Code scanning is not available on every plan and is not what this pipeline is for, so an
      # upload problem must not turn a good, signed build red. One category per image, or each
      # upload would replace the previous image's alerts.
      - name: upload sarif
        if: always() && steps.sarif.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy-image-${{ matrix.name }}

      - name: sbom (spdx json)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          # Uploaded explicitly below so the artifact action is pinned here and not transitively.
          upload-artifact: false

      - name: upload sbom
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx-${{ matrix.name }}-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: error

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Keyless: cosign swaps the job's OIDC token for a short-lived Fulcio certificate whose SAN is
      # this workflow at this ref, signs, and logs the entry in Rekor. The private key exists for
      # seconds, in memory, on the runner. scripts/verify-image.sh is the other half of this.
      - name: cosign sign
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      # The SBOM as a signed statement about this digest, not just a build artifact that expires in
      # 90 days: "what is in this image" becomes verifiable by anyone, forever, with the same trust
      # root as the signature.
      - name: cosign attest sbom
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      # Digest bumps in cluster/ are still a manual commit (ADR 0011, known gap), so hand the human
      # the exact lines instead of making them reconstruct them from the log.
      - name: summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          refs=$(grep -rl --include='*.yaml' "$IMAGE" cluster/ | sort || true)
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## ${IMAGE##*/} image published

          \`\`\`
          ${IMAGE}@${DIGEST}
          \`\`\`

          Files under \`cluster/\` that reference this image (pin the digest there):

          \`\`\`
          ${refs:-(none yet)}
          \`\`\`

          \`\`\`yaml
          images:
            - name: ${IMAGE}
              digest: ${DIGEST}
          \`\`\`

          Verify locally:

          \`\`\`sh
          scripts/verify-image.sh ${IMAGE}@${DIGEST}
          \`\`\`
          SUMMARY
