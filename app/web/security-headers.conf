# Response headers for every content location in nginx.conf. A separate file because nginx drops
# all inherited add_header directives in any block that declares its own (here: Cache-Control), so
# each location has to include the full set; one include keeps that a single list. `always` sets
# them on error responses too.
#
# The CSP is the policy ADR 0019 describes. The page loads only same-origin files, so every fetch
# directive is 'self' or 'none'; the API (/api/*, including the SSE stream) is same-origin, so
# connect-src 'self' covers it. Trusted Types are enforced: the code never writes HTML strings into
# the DOM (scripts/check-dom-sinks.mjs), and with this header a regression throws instead of
# becoming an XSS. scripts/serve.mjs parses this file so the local server and the Playwright suite
# enforce exactly the same policy.
#
# HSTS is deliberately absent: it is set by the Gateway HTTPRoute and at the Cloudflare edge, which
# is where TLS terminates; this pod only ever speaks plain HTTP to the Gateway.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
