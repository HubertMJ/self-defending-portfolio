# nginx for a container with a read-only root filesystem, running as uid 101.
#
# Two constraints shape this file. First, nothing outside /tmp is writable (the Deployment mounts
# emptyDirs; the local smoke test uses --read-only --tmpfs /tmp), so every path nginx writes --
# the pid file and all request body/proxy scratch space -- is moved under /tmp. Second, logs go to
# the container's stdout/stderr, not to files, because a pod's logs belong to the kubelet.
#
# Response security headers come from security-headers.conf, included in every location below. The
# HTTPRoute (cluster/infra/hello/httproute.yaml) sets the same family of headers at the Gateway and,
# because its filter uses `set`, its values win in the cluster; the two must carry the same CSP
# (ADR 0019). Setting them here as well means the image is safe on its own -- in `docker run`, in
# the Playwright suite, behind any other proxy -- instead of only behind one particular route.

worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Every writable path, under the single tmpfs the container gets.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  # No version in the `Server` header or in error pages: free reconnaissance otherwise.
  server_tokens off;

  # Cache-Control by response status, because `add_header ... always` also stamps error responses.
  # An error must never be cacheable: during a rolling update a page from the new pod can ask an
  # old pod for an asset it does not have, and a 404 marked "immutable, one year" is then served by
  # the Cloudflare edge to every visitor for a year (ADR 0019, amendment). Only a successful
  # response (or a 304 revalidating one) carries the long-lived policy.
  map $status $asset_cache_control {
    ~^(200|304)$  "public, max-age=31536000, immutable";
    default       "no-store";
  }
  map $status $page_cache_control {
    ~^(200|304)$  "no-cache";
    default       "no-store";
  }

  access_log /dev/stdout combined;

  sendfile    on;
  tcp_nopush  on;

  keepalive_timeout     30s;
  client_header_timeout 10s;
  client_body_timeout   10s;
  send_timeout          10s;
  # A static site accepts no uploads; cap the body so a slow-POST costs nothing.
  client_max_body_size  1k;

  gzip            on;
  gzip_vary       on;
  gzip_min_length 512;
  gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

  # index.html and the text/plain answers below declare their charset in the header, not by sniffing.
  charset utf-8;

  server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Static content only: anything but a read is a client error, not a 404 hunt.
    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }

    # Hidden files are never content. 404 rather than 403 so probing cannot confirm a path exists.
    location ~ /\. {
      access_log off;
      log_not_found off;
      return 404;
    }

    # Cheap endpoint for probes that does not touch the filesystem.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # The API is a separate service routed by the Gateway (HTTPRoute /api). If that route is ever
    # missing, /api must fail loudly here rather than be answered with a page: the frontend treats
    # a non-JSON answer as "API offline", and nginx must never look like it is the API.
    location ^~ /api/ {
      access_log off;
      default_type text/plain;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
      return 404 "not found\n";
    }
    location = /api {
      access_log off;
      default_type text/plain;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
      return 404 "not found\n";
    }

    # Content-hashed bundles (scripts/build.mjs): a changed file is a new name, so the old one can
    # be cached for a year and never revalidated. A miss is a plain 404, never a fallback page.
    location ^~ /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control $asset_cache_control always;
      try_files $uri =404;
    }

    # Everything else -- index.html, favicon, robots.txt -- has a stable name, so it must be
    # revalidated (cheap: ETag/Last-Modified) or a deploy would not reach returning visitors.
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control $page_cache_control always;
      try_files $uri $uri/ =404;
    }
  }
}
