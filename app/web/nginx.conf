# nginx for a container with a read-only root filesystem, running as uid 101.
#
# Two constraints shape this file. First, nothing outside /tmp is writable (the Deployment mounts
# emptyDirs; the local smoke test uses --read-only --tmpfs /tmp), so every path nginx writes --
# the pid file and all request body/proxy scratch space -- is moved under /tmp. Second, logs go to
# the container's stdout/stderr, not to files, because a pod's logs belong to the kubelet.
#
# Response security headers are deliberately *not* set here: they live in the HTTPRoute
# (cluster/infra/hello/httproute.yaml) so they apply to every backend on the Gateway and survive
# replacing nginx. The only header business here is removing the version from `Server`.

worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Every writable path, under the single tmpfs the container gets.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  # No version in the `Server` header or in error pages: free reconnaissance otherwise.
  server_tokens off;

  access_log /dev/stdout combined;

  sendfile    on;
  tcp_nopush  on;

  keepalive_timeout     30s;
  client_header_timeout 10s;
  client_body_timeout   10s;
  send_timeout          10s;
  # A static site accepts no uploads; cap the body so a slow-POST costs nothing.
  client_max_body_size  1k;

  gzip            on;
  gzip_min_length 512;
  gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Static content only: anything but a read is a client error, not a 404 hunt.
    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }

    # Hidden files are never content. 404 rather than 403 so probing cannot confirm a path exists.
    location ~ /\. {
      access_log off;
      log_not_found off;
      return 404;
    }

    # Cheap endpoint for probes that does not touch the filesystem.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
