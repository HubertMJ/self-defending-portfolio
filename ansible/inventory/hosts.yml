# Two groups: the single-node k3s cluster and the SIEM host that watches it (ADR 0034).
# Both VMs are created by scripts/pve-create-vm.sh (cloud-init); everything after first
# boot is done by Ansible.
all:
  children:
    k3s_nodes:
      hosts:
        k3s01:
          ansible_host: 10.4.1.20
    siem_nodes:
      hosts:
        siem01:
          ansible_host: 10.4.2.10
