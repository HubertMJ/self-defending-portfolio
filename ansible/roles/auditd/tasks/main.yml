---
- name: Ensure auditd is installed
  ansible.builtin.apt:
    name:
      - auditd
      - audispd-plugins
    state: present

- name: Configure auditd
  ansible.builtin.template:
    src: auditd.conf.j2
    dest: /etc/audit/auditd.conf
    owner: root
    group: root
    mode: "0640"
    backup: true
  notify: Reload the auditd configuration

# The kernel binds a watch (-w) to the parent directory, so a rule on a path whose parent does
# not exist yet fails with ENOENT and augenrules aborts the whole load. The k3s paths only appear
# in the cluster play, so their parents are created here with the modes k3s itself uses.
- name: Ensure the directories watched by the k3s rules exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: "{{ [auditd_k3s_config_dir, auditd_k3s_state_dir]
            + auditd_k3s_state_watch_subpaths | map('regex_replace', '^', auditd_k3s_state_dir ~ '/') | list }}"
  when:
    - auditd_k3s_enabled | bool
    - item | basename != 'token'

- name: Install audit rule files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/audit/rules.d/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ ['10-base.rules', '30-identity.rules', '40-privileged.rules']
            + (['50-k3s.rules'] if auditd_k3s_enabled | bool else [])
            + (['60-extra.rules'] if auditd_extra_watches | length > 0 else [])
            + ['99-finalize.rules'] }}"
  notify: Load audit rules

# augenrules compiles every file in rules.d, so a rule set that no longer
# applies to this host has to be deleted, not merely left unrendered.
- name: Remove rule files this host does not use
  ansible.builtin.file:
    path: "/etc/audit/rules.d/{{ item }}"
    state: absent
  loop: "{{ ([] if auditd_k3s_enabled | bool else ['50-k3s.rules'])
            + ([] if auditd_extra_watches | length > 0 else ['60-extra.rules']) }}"
  notify: Load audit rules

# A run that failed before its handlers left rule files on disk that were never compiled or loaded,
# and the next run sees no file change. augenrules --check compares rules.d with the compiled
# /etc/audit/audit.rules (read-only), so such a gap is closed by the next run.
- name: Check whether the compiled rules match rules.d
  ansible.builtin.command:
    cmd: /usr/sbin/augenrules --check
  register: auditd_augenrules_check
  check_mode: false
  changed_when: "'should be updated' in auditd_augenrules_check.stdout"
  notify: Load audit rules

- name: Ensure auditd is enabled and running
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true
