---
# Kernel audit backlog. 8192 is the usual floor for a Kubernetes node; a
# too-small buffer makes the kernel drop events under load.
auditd_buffer_size: 8192

# Failure mode: 0 silent, 1 printk (chosen), 2 panic.
auditd_failure_mode: 1

# Lowest uid considered a real login user; audit rules ignore service accounts.
auditd_uid_min: 1000

# Make the ruleset immutable (-e 2). This is deliberately false by default:
# with -e 2 the kernel refuses any further rule change until the next reboot,
# so a subsequent Ansible run that reloads rules fails. Enable it only on a
# host you are ready to reboot after each policy change.
auditd_immutable: false

# auditd.conf log rotation.
auditd_max_log_file: 50
auditd_max_log_file_action: ROTATE
auditd_num_logs: 5
auditd_space_left_action: SYSLOG

# The k3s ruleset (50-k3s.rules) and the directories it watches exist only on
# k3s nodes; elsewhere the file is removed. The switch defaults to the inventory
# group so k3s01's rendered rules stay byte-identical (tests/golden/render.sh;
# ADR 0009 amendment 2026-10-04).
auditd_k3s_enabled: "{{ 'k3s_nodes' in group_names }}"

# Host-specific write watches, rendered into 60-extra.rules (absent when the
# list is empty): [{path, key}], each watched for writes and attribute changes.
# siem01 watches its OpenSearch configuration, plugins and the rules sync
# (siem contract M19).
auditd_extra_watches: []

# Paths watched by the k3s ruleset.
auditd_k3s_config_dir: /etc/rancher/k3s
auditd_k3s_state_dir: /var/lib/rancher/k3s/server
auditd_k3s_binary: /usr/local/bin/k3s

# Subpaths of auditd_k3s_state_dir that are watched for writes. The state
# directory as a whole is deliberately NOT watched: it contains the kine/SQLite
# datastore, whose write-ahead churn generates a continuous stream of audit
# events that drowns every other record and fills /var/log/audit. These three
# hold the material an attacker would actually need - the cluster CA and
# serving keys (tls), the encryption and bootstrap secrets (cred) and the node
# join token (token).
auditd_k3s_state_watch_subpaths:
  - tls
  - cred
  - token
