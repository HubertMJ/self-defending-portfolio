---
# Ruleset file rendered and loaded by the nftables service.
firewall_config_path: /etc/nftables.conf

# CIDRs allowed to reach SSH. Defaults to the node's own LAN so the role is
# usable without inventory variables; set lan_cidr (or this var) in group_vars
# to narrow it down.
firewall_admin_cidrs:
  - "{{ lan_cidr | default(firewall_default_lan_cidr) }}"

# IPv6 equivalent of firewall_admin_cidrs. Empty by default: the node gets a
# static IPv4 address from cloud-init and accept_ra is off, so there is no
# IPv6 admin path to open. Populate it (e.g. with the LAN ULA prefix) and SSH
# plus the kube-apiserver are opened for those sources as well.
firewall_admin_cidrs6: []

# The k3s-shaped rules (kube-apiserver, pod/service CIDR to host ports, the
# Cilium interfaces and proxy marks, the accepting forward chain) exist only on
# k3s nodes. The switch defaults to the inventory group so k3s01's rendered
# ruleset stays byte-identical (tests/golden/render.sh) and every other host,
# such as siem01, gets none of them (ADR 0009 amendment 2026-10-04).
firewall_k3s_enabled: "{{ 'k3s_nodes' in group_names }}"

# Per-service allow-list, one accept rule per entry, for hosts that serve
# something other than SSH: [{name, port, proto, sources}]. siem01 opens
# OpenSearch's 9200/tcp to k3s01 only (ADR 0034); empty on k3s nodes.
firewall_services: []

# CIDRs allowed to reach the kube-apiserver on 6443.
firewall_k3s_api_cidrs:
  - "{{ lan_cidr | default(firewall_default_lan_cidr) }}"

# The subnet of the host's primary interface, derived from facts. Used only as
# a fallback when lan_cidr is not supplied by the inventory.
firewall_default_lan_cidr: >-
  {{ ansible_default_ipv4.network }}/{{ ansible_default_ipv4.prefix }}

# SSH port. Derived from ssh_hardening_port so the two roles cannot drift apart
# and lock the host out; the fallback is only used when the ssh_hardening role
# is not part of the play.
firewall_ssh_port: "{{ ssh_hardening_port | default(22) }}"

# kube-apiserver port.
firewall_k3s_api_port: 6443

# Cluster networks. Keep in sync with k3s_cluster_cidr / k3s_service_cidr.
firewall_pod_cidr: "{{ k3s_cluster_cidr | default('10.42.0.0/16') }}"
firewall_service_cidr: "{{ k3s_service_cidr | default('10.43.0.0/16') }}"

# Ports on the host that pods and host-network components may reach, per
# protocol. The pod and service ranges are NOT trusted wholesale: a compromised
# pod would otherwise have the entire host as an attack surface, including sshd
# and anything an operator starts later. Only what the cluster actually needs on
# the node is opened:
#   6443  kube-apiserver, reached by in-cluster clients and by the Cilium agent
#   10250 kubelet API, used by the apiserver for exec/logs and by metrics-server
#   4240  cilium-agent health endpoint
#   4244  hubble peer service (cilium-agent, host network); hubble-relay dials it from a pod
#   53    CoreDNS, which runs as a pod but is queried through the node address
# Extend these lists instead of widening the CIDR rules.
firewall_pod_to_host_tcp_ports: [53, 4240, 4244, 6443, 10250]
firewall_pod_to_host_udp_ports: [53]

# Extra ports to open, e.g. Cilium health checks (4240/tcp) or VXLAN
# (8472/udp) once a second node joins. Empty on a single node with native
# routing because no node-to-node tunnel or health probe exists.
firewall_extra_tcp_ports: []
firewall_extra_udp_ports: []

# CIDRs the extra ports above are opened to.
firewall_cluster_cidrs:
  - "{{ lan_cidr | default(firewall_default_lan_cidr) }}"

# Log dropped input packets (rate limited) with this prefix.
firewall_log_dropped: true
firewall_log_prefix: "nft-drop: "
firewall_log_rate: 10/minute

# Rate limit for accepted ICMP echo requests.
firewall_icmp_echo_rate: 10/second
