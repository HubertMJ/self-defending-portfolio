---
- name: Ensure nftables is installed
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Render the nftables ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: "{{ firewall_config_path }}"
    owner: root
    group: root
    mode: "0750"
    backup: true
    validate: /usr/sbin/nft -c -f %s
  notify: Reload nftables

- name: Ensure nftables is enabled and running
  ansible.builtin.systemd_service:
    name: nftables
    state: started
    enabled: true
