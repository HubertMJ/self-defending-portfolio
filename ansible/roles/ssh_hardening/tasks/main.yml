---
# A fresh Debian 13 (trixie) cloud image runs sshd as a classic daemon:
# ssh.service is the listener and ssh.socket exists but is disabled. Socket
# activation is still handled here because an operator (or a future Debian
# default) may enable it, and in that mode ssh.service is started per
# connection, so the Port keyword in sshd_config is ignored and only
# ListenStream= on the socket decides where sshd listens.
#
# service_facts cannot answer this question: it enumerates .service units only,
# so ansible_facts.services never contains an entry for ssh.socket and any test
# against it silently evaluates to false.
# noqa command-instead-of-module: the systemd modules cannot report a unit's
# enablement state without also enforcing it, and `systemctl is-enabled` is the
# only read-only answer. rc 1 (disabled) and rc 4 (no such unit) are both valid
# outcomes here, hence failed_when: false.
- name: Read the enablement state of ssh.socket # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: /usr/bin/systemctl is-enabled ssh.socket
  register: ssh_hardening_socket_state
  changed_when: false
  failed_when: false

- name: Record the sshd activation mode
  ansible.builtin.set_fact:
    ssh_hardening_socket_activated: "{{ ssh_hardening_socket_state.stdout | trim in ['enabled', 'enabled-runtime'] }}"

- name: Ensure sshd_config.d exists
  ansible.builtin.file:
    path: "{{ ssh_hardening_dropin_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Assert the main sshd_config includes sshd_config.d
  ansible.builtin.command:
    cmd: "grep -Eq '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config\\.d/\\*\\.conf' /etc/ssh/sshd_config"
  changed_when: false

# A drop-in cannot be validated before it is written, because sshd -t only
# parses the full configuration. Writing it and then validating therefore has a
# window in which a bad file is on disk: the validation task failing is enough
# to keep the RUNNING sshd safe (the handlers never fire), but the next reboot
# or any unrelated `systemctl restart ssh` would load the rejected file and lock
# the host out. The rescue below closes that window by putting the previous
# state back before failing.
- name: Install and validate the sshd hardening drop-in
  block:
    - name: Install sshd hardening drop-in
      ansible.builtin.template:
        src: 00-hardening.conf.j2
        dest: "{{ ssh_hardening_dropin_path }}"
        owner: root
        group: root
        mode: "0600"
        backup: true
      register: ssh_hardening_dropin
      notify: Reload sshd

    - name: Validate the effective sshd configuration
      ansible.builtin.command:
        cmd: "{{ ssh_hardening_sshd_binary }} -t -f /etc/ssh/sshd_config"
      changed_when: false
  rescue:
    - name: Restore the previous drop-in that sshd accepted
      ansible.builtin.copy:
        src: "{{ ssh_hardening_dropin.backup_file }}"
        dest: "{{ ssh_hardening_dropin_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when: ssh_hardening_dropin.backup_file is defined

    - name: Remove the rejected drop-in when there was no previous version
      ansible.builtin.file:
        path: "{{ ssh_hardening_dropin_path }}"
        state: absent
      when: ssh_hardening_dropin.backup_file is not defined

    - name: Fail because sshd rejected the rendered configuration
      ansible.builtin.fail:
        msg: >-
          sshd rejected the rendered hardening drop-in. The previous sshd
          configuration has been restored on disk and the running sshd was
          never reloaded, so this host is still reachable.

- name: Ensure the ssh.socket drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.socket.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - ssh_hardening_socket_activated | bool
    - ssh_hardening_manage_socket_port | bool

- name: Set the listening port on the ssh socket
  ansible.builtin.copy:
    dest: /etc/systemd/system/ssh.socket.d/10-port.conf
    content: |
      # Managed by Ansible (role: ssh_hardening)
      # The empty ListenStream clears the vendor default before adding ours.
      [Socket]
      ListenStream=
      ListenStream={{ ssh_hardening_port }}
    owner: root
    group: root
    mode: "0644"
  when:
    - ssh_hardening_socket_activated | bool
    - ssh_hardening_manage_socket_port | bool
  notify: Restart the ssh socket

- name: Apply the validated configuration before continuing
  ansible.builtin.meta: flush_handlers

- name: Ensure the active SSH unit is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ ssh_hardening_socket_activated | bool | ternary('ssh.socket', 'ssh.service') }}"
    state: started
    enabled: true
