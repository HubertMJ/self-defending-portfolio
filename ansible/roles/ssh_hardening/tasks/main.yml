---
# Debian 13 ships OpenSSH with systemd socket activation enabled, in which case
# ssh.service is not the listener and Port in sshd_config is ignored. Everything
# below branches on this fact rather than assuming either layout.
- name: Collect service facts
  ansible.builtin.service_facts:

- name: Record the sshd activation mode
  ansible.builtin.set_fact:
    ssh_hardening_socket_activated: >-
      {{ ansible_facts.services['ssh.socket'].status | default('') == 'enabled' }}

- name: Ensure sshd_config.d exists
  ansible.builtin.file:
    path: "{{ ssh_hardening_dropin_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Assert the main sshd_config includes sshd_config.d
  ansible.builtin.command:
    cmd: "grep -Eq '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config\\.d/\\*\\.conf' /etc/ssh/sshd_config"
  changed_when: false

# The drop-in cannot be validated on its own, so validation happens after the
# file is in place by running a full parse. If the parse fails the task below
# fails, the handlers never fire and the running sshd keeps its old config.
- name: Install sshd hardening drop-in
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: "{{ ssh_hardening_dropin_path }}"
    owner: root
    group: root
    mode: "0600"
    backup: true
  notify: Reload sshd

- name: Ensure the ssh.socket drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.socket.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - ssh_hardening_socket_activated
    - ssh_hardening_manage_socket_port | bool

- name: Set the listening port on the ssh socket
  ansible.builtin.copy:
    dest: /etc/systemd/system/ssh.socket.d/10-port.conf
    content: |
      # Managed by Ansible (role: ssh_hardening)
      # The empty ListenStream clears the vendor default before adding ours.
      [Socket]
      ListenStream=
      ListenStream={{ ssh_hardening_port }}
    owner: root
    group: root
    mode: "0644"
  when:
    - ssh_hardening_socket_activated
    - ssh_hardening_manage_socket_port | bool
  notify: Restart the ssh socket

- name: Validate the effective sshd configuration
  ansible.builtin.command:
    cmd: "{{ ssh_hardening_sshd_binary }} -t -f /etc/ssh/sshd_config"
  changed_when: false

- name: Apply the validated configuration before continuing
  ansible.builtin.meta: flush_handlers

- name: Ensure the active SSH unit is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ ssh_hardening_socket_activated | ternary('ssh.socket', 'ssh.service') }}"
    state: started
    enabled: true
