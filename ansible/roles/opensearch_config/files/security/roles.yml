---
# Managed by Ansible (role: opensearch_config). The sdp roles as proven 108/108 in the S0 spike
# (siem contract S0-#5), with one narrowing from the P1 review: sdp_api_read reads named streams only. Nothing else is
# defined here, so the reserved roles of the package's default roles.yml (among them
# security_analytics_full_access) do not exist. Never map anyone to the static kibana_server role:
# like security_analytics_full_access it carries index-template rights, i.e. the power to drop
# final_pipeline (S0-i).
_meta:
  type: "roles"
  config_version: 2

sdp_shipper_k3s01:
  cluster_permissions: ["indices:data/write/bulk"]
  index_permissions:
    - index_patterns: ["sdp-falco", "sdp-talon", "sdp-hubble", "sdp-k8s-audit", "sdp-api", "sdp-host"]
      allowed_actions: ["indices:data/write/index", "indices:data/write/bulk*"]
sdp_shipper_siem01:
  cluster_permissions: ["indices:data/write/bulk"]
  index_permissions:
    - index_patterns: ["sdp-siem01"]
      allowed_actions: ["indices:data/write/index", "indices:data/write/bulk*"]
sdp_api_read:
  cluster_permissions:
    - "cluster:admin/opensearch/securityanalytics/alerts/get"
    - "cluster:admin/opensearch/securityanalytics/findings/get"
    - "cluster:admin/opensearch/securityanalytics/correlations/list"
    - "cluster:admin/opensearch/securityanalytics/correlationAlerts/get"
    - "cluster:admin/opensearch/securityanalytics/detector/search"
    - "cluster:admin/opensearch/securityanalytics/rule/search"
    - "cluster:admin/opendistro/alerting/alerts/get"
    - "cluster:admin/opendistro/alerting/monitor/search"
  index_permissions:
    # Review L6: the k3s01 streams and the sync record by name - not sdp-siem01 (the SIEM host's own
    # logins and audit records are host data the page never shows, ADR 0034 "counts only"), and not
    # any future sdp-* stream by accident. A search must name the streams; sdp-* is refused.
    - index_patterns: ["sdp-falco", "sdp-talon", "sdp-hubble", "sdp-k8s-audit", "sdp-api", "sdp-host", "siem-sync"]
      allowed_actions: ["read"]
    - index_patterns: [".opensearch-sap-correlation-history*"]   # S0: correlations list searches it as the caller
      allowed_actions: ["read"]
sdp_rules_sync:
  cluster_permissions:
    # S0: SA actions enumerated, NOT securityanalytics/*: mapping/create|update let SA rewrite our index
    # templates (adds "<stream>*" + its component, F11) in its own context, which this role must not reach.
    - "cluster:admin/opensearch/securityanalytics/alerts/*"
    - "cluster:admin/opensearch/securityanalytics/correlationAlerts/*"
    - "cluster:admin/opensearch/securityanalytics/correlations/*"
    - "cluster:admin/opensearch/securityanalytics/correlation/*"
    - "cluster:admin/opensearch/securityanalytics/detector/*"
    - "cluster:admin/opensearch/securityanalytics/findings/*"
    - "cluster:admin/opensearch/securityanalytics/logtype/*"
    - "cluster:admin/opensearch/securityanalytics/rule/*"
    - "cluster:admin/opensearch/securityanalytics/mapping/get"
    - "cluster:admin/opensearch/securityanalytics/mapping/view/get"
    - "cluster:admin/opendistro/alerting/*"
    - "cluster:admin/opensearch/alerting/*"
    - "cluster:admin/opensearch/notifications/feature/publish"
    - "cluster:admin/index/correlation/rules/*"
    - "cluster_monitor"
    - "indices:data/write/bulk"            # S0: single-doc writes to siem-sync run as bulk
  index_permissions:
    - index_patterns: [".opensearch-sap-correlation-history*"]   # S0: correlations list searches it as the caller
      allowed_actions: ["read"]
    - index_patterns: [".opensearch-sap-custom-rules-config"]    # S0: rule delete looks the rule up as the caller
      allowed_actions: ["read"]
    - index_patterns: ["sdp-*"]
      allowed_actions: ["read", "indices:admin/mappings/get", "indices:admin/mapping/put", "indices:admin/aliases/get", "indices_monitor"]
    - index_patterns: ["siem-sync"]
      allowed_actions: ["write", "create_index"]
sdp_analyst:
  cluster_permissions:
    - "cluster:admin/opensearch/securityanalytics/alerts/get"
    - "cluster:admin/opensearch/securityanalytics/correlationAlerts/get"
    - "cluster:admin/opensearch/securityanalytics/correlations/findings"
    - "cluster:admin/opensearch/securityanalytics/correlations/list"
    - "cluster:admin/opensearch/securityanalytics/detector/get"
    - "cluster:admin/opensearch/securityanalytics/detector/search"
    - "cluster:admin/opensearch/securityanalytics/findings/get"
    - "cluster:admin/opensearch/securityanalytics/logtype/search"
    - "cluster:admin/opensearch/securityanalytics/mapping/get"
    - "cluster:admin/opensearch/securityanalytics/mapping/view/get"
    - "cluster:admin/opensearch/securityanalytics/rule/get"
    - "cluster:admin/opensearch/securityanalytics/rule/search"
    - "cluster:admin/opendistro/alerting/alerts/get"
    - "cluster:admin/opendistro/alerting/monitor/get"
    - "cluster:admin/opendistro/alerting/monitor/search"
    - "cluster:admin/opensearch/alerting/findings/get"
    - "cluster_composite_ops_ro"
    - "indices:data/write/bulk"            # S0: saved-object writes to .kibana* run as bulk
    - "cluster_monitor"                    # S0-j: Dashboards start-up needs cluster:monitor/nodes/info
    - "indices:data/read/scroll*"          # S0-j: from the static kibana_server role, minus its template rights
    - "manage_point_in_time"
  index_permissions:
    - index_patterns: [".opensearch-sap-correlation-history*"]
      allowed_actions: ["read"]
    - index_patterns: ["sdp-*", "siem-sync"]
      allowed_actions: ["read"]
    - index_patterns: [".kibana", ".kibana_*", ".opensearch_dashboards", ".opensearch_dashboards_*"]
      allowed_actions: ["indices_all"]
    - index_patterns: ["*"]                # S0-j: Dashboards resolves aliases across indices (read-only metadata)
      allowed_actions: ["indices:admin/aliases/get"]
