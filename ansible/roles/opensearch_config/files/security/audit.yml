---
# Managed by Ansible (role: opensearch_config). The security plugin's audit log (review M2), written
# through log4j (opensearch.yml) to a local file: FAILED_LOGIN, MISSING_PRIVILEGES, SSL_EXCEPTION,
# BAD_HEADERS and the other refusal categories; successful authentications and granted privileges
# are not logged (volume), and neither are request bodies (they would copy evidence and secrets).
_meta:
  type: "audit"
  config_version: 2
config:
  enabled: true
  audit:
    enable_rest: true
    disabled_rest_categories:
      - AUTHENTICATED
      - GRANTED_PRIVILEGES
    enable_transport: true
    disabled_transport_categories:
      - AUTHENTICATED
      - GRANTED_PRIVILEGES
    ignore_users: []
    ignore_requests: []
    resolve_bulk_requests: false
    log_request_body: false
    resolve_indices: true
    exclude_sensitive_headers: true
  compliance:
    enabled: true
    internal_config: true
    external_config: false
    read_metadata_only: true
    read_watched_fields: {}
    read_ignore_users: []
    write_metadata_only: true
    write_log_diffs: false
    write_watched_indices: []
    write_ignore_users: []
