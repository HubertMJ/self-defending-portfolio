---
argument_specs:
  main:
    short_description: Debian 13 baseline configuration
    description:
      - Installs the minimal package set and applies host-level baseline settings.
    options:
      base_timezone:
        description: IANA timezone name applied to the host.
        type: str
        default: Europe/Warsaw
      base_hostname:
        description: Hostname to set on the target.
        type: str
      base_packages:
        description: Packages installed as part of the baseline.
        type: list
        elements: str
      base_apt_cache_valid_time:
        description: Seconds an existing apt cache is considered fresh.
        type: int
        default: 3600
      base_disable_cloud_init_network:
        description: Disable cloud-init network rendering via a drop-in file.
        type: bool
        default: true
      base_journald_storage:
        description: journald Storage= value.
        type: str
        default: persistent
      base_journald_max_use:
        description: journald SystemMaxUse= value.
        type: str
        default: 500M
      base_dns_servers:
        type: list
        elements: str
        default: []
        description: Upstream DNS servers written to a systemd-resolved drop-in; empty leaves the resolver untouched.
      base_time_sync:
        type: bool
        default: true
        description: Install systemd-timesyncd and keep it enabled and running (outside containers).
