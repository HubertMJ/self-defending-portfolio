---
# Timezone applied to the host (IANA name).
base_timezone: Europe/Warsaw

# Hostname to set. Defaults to the inventory hostname so the role is usable
# without inventory variables.
base_hostname: "{{ inventory_hostname_short }}"

# Minimal package set required by the rest of this playbook set.
# nftables/auditd/unattended-upgrades are configured by their own roles but
# installed here so the baseline is complete in a single pass.
base_packages:
  - curl
  - ca-certificates
  - gnupg
  - python3-apt
  - nftables
  - auditd
  - unattended-upgrades
  - apt-listchanges
  - needrestart
  # The VM is created with agent=1, so Proxmox expects this to be running. It is
  # also the documented recovery path in docs/bootstrap.md: `qm guest exec` from
  # the hypervisor is the only way back in when the firewall or sshd locks SSH
  # out, and the cloud-init user has no password for the serial console.
  - qemu-guest-agent

# Accept a cached apt index younger than this many seconds (1 hour).
base_apt_cache_valid_time: 3600

# Stop cloud-init from rewriting /etc/network/* on every boot. The VM is
# created by cloud-init, so cloud-init itself is kept; only its network
# rendering is disabled. Set to false to keep cloud-init network management.
base_disable_cloud_init_network: true

# Persistent journald storage with an upper bound on disk usage.
base_journald_storage: persistent
base_journald_max_use: 500M

# Upstream resolvers for systemd-resolved. Empty list = leave the resolver configuration from
# cloud-init/netplan alone. On the DMZ node this is set to public resolvers so the node never asks
# the home gateway, whose resolver forwards to the internal DNS and would leak LAN hostnames.
base_dns_servers: []

# Keep the clock synchronised with systemd-timesyncd (the Debian 13 image's own
# client; k3s01 already runs it). Correlation across k3s01 and siem01 compares
# timestamps written on both hosts, so both must keep time (ADR 0034).
# Containers share the host's clock and the unit refuses to start in one
# (ConditionVirtualization=!container), so there the package is only installed.
base_time_sync: true
