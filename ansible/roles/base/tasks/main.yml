---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ base_apt_cache_valid_time }}"

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

# Debian's qemu-guest-agent.service is device activated: it has BindsTo= on the
# virtio serial port and an empty [Install] section, so there is nothing to
# enable - udev starts it when the port appears. It is only managed here where a
# virtio port can exist at all; the smoke-test container is not a KVM guest, and
# ansible_virtualization_type reports docker there.
- name: Ensure the QEMU guest agent is running
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    state: started
  when: ansible_virtualization_type == 'kvm'

- name: Install systemd-timesyncd
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: present
  when: base_time_sync | bool

- name: Ensure systemd-timesyncd is enabled and running
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: started
    enabled: true
  when:
    - base_time_sync | bool
    - ansible_virtualization_type not in ['docker', 'podman', 'container', 'lxc', 'containerd']

- name: Set timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ base_hostname }}"
  # Containers own no UTS namespace we can write to; the smoke test skips this tag.
  tags: [hostname]

- name: Ensure hostname resolves locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ base_hostname }}"
    owner: root
    group: root
    mode: "0644"
  tags: [hostname]

- name: Check whether cloud-init is installed
  ansible.builtin.stat:
    path: /etc/cloud/cloud.cfg.d
  register: base_cloud_cfg_dir

- name: Disable cloud-init network reconfiguration
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    content: |
      # Managed by Ansible (role: base)
      network: {config: disabled}
    owner: root
    group: root
    mode: "0644"
  when:
    - base_disable_cloud_init_network | bool
    - base_cloud_cfg_dir.stat.isdir | default(false)

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure persistent journald storage with a size cap
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-persistent.conf
    content: |
      # Managed by Ansible (role: base)
      [Journal]
      Storage={{ base_journald_storage }}
      SystemMaxUse={{ base_journald_max_use }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-journald

- name: Ensure the systemd-resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: base_dns_servers | length > 0

- name: Pin upstream DNS servers for every domain
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/10-upstream.conf
    content: |
      # Managed by Ansible (role: base). Domains=~. makes these global servers win over the
      # per-link servers netplan/cloud-init learned from the gateway.
      [Resolve]
      DNS={{ base_dns_servers | join(' ') }}
      Domains=~.
    owner: root
    group: root
    mode: "0644"
  when: base_dns_servers | length > 0
  notify: Restart systemd-resolved

# cloud-init's netplan file carries the gateway as per-link DNS plus a search domain, and
# systemd-resolved routes queries for that domain to the link's server regardless of the global
# drop-in above. Netplan merges list values across files (a 60-*.yaml override only appends), so
# the role takes over the primary interface's netplan file. cloud-init network rendering is
# disabled above, so nothing rewrites it on reboot.
- name: Check whether netplan manages the network
  ansible.builtin.stat:
    path: /etc/netplan
  register: base_netplan_dir
  when: base_dns_servers | length > 0

- name: Render the primary interface netplan file with pinned DNS
  ansible.builtin.template:
    src: netplan-primary.yaml.j2
    dest: /etc/netplan/50-cloud-init.yaml
    owner: root
    group: root
    mode: "0600"
    backup: true
  when:
    - base_dns_servers | length > 0
    - base_netplan_dir.stat.isdir | default(false)
  notify: Apply netplan

- name: Remove the obsolete netplan DNS overlay
  ansible.builtin.file:
    path: /etc/netplan/60-ansible-dns.yaml
    state: absent
  when: base_dns_servers | length > 0
  notify: Apply netplan
