---
- name: Restart systemd-journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Restart systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted

- name: Apply netplan
  ansible.builtin.command:
    cmd: /usr/sbin/netplan apply
  changed_when: true
