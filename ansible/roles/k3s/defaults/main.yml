---
# Pinned k3s release. Bump deliberately: the binary and its checksum are
# fetched from the matching GitHub release, and a change here restarts k3s.
k3s_version: v1.35.9+k3s1

# Release architecture suffix used for the checksum file name.
k3s_arch: amd64

# Where the release assets live.
k3s_release_base_url: https://github.com/k3s-io/k3s/releases/download

# Installed binary and the CLI symlinks k3s provides through argv[0].
k3s_binary_path: /usr/local/bin/k3s
k3s_symlinks:
  - kubectl
  - crictl
  - ctr

# Network ranges. Must match firewall_pod_cidr / firewall_service_cidr and
# cilium_ipv4_native_routing_cidr.
k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16

# Address the node advertises and binds services on. Defaults to the primary
# IPv4 address from facts.
k3s_node_ip: "{{ ansible_default_ipv4.address }}"

# Additional names and addresses placed in the apiserver serving certificate.
k3s_tls_sans:
  - "{{ inventory_hostname_short }}"
  - "{{ k3s_node_ip }}"

# Bundled components that are disabled. Traefik and servicelb are replaced by
# Cloudflare Tunnel plus Cilium; local-storage is kept so PVCs work out of the
# box for the portfolio workloads. metrics-server is deployed by Argo CD from
# this repository's own build instead (cluster/apps/metrics-server.yaml,
# ADR 0025): k3s pins the image of a bundled add-on inside its binary. Adding
# it here on a running cluster makes k3s delete its copy's objects on restart;
# docs/bootstrap.md 8.10 has the order.
k3s_disable_components:
  - traefik
  - servicelb
  - metrics-server

# CoreDNS from this repository (ADR 0026). While true, the role adds `coredns` to the disabled
# components and writes templates/coredns-sdp.yaml.j2 into k3s's auto-deploy directory, where
# k3s's deploy controller applies it on every start. The objects keep k3s's names, labels and
# ClusterIP, so the switch in either direction is a rolling update of the same Deployment
# (docs/bootstrap.md 8.7). false is the rollback: the file is removed, k3s's own manifest comes back
# and takes the objects over again on the restart that follows.
k3s_coredns_own: true

# The image, pinned by digest; only CI on main builds and signs it (build-images.yml, ADR 0016).
# Bumped with scripts/bump-image-digest.sh coredns <digest>; scripts/check-image-digests.sh refuses
# the all-zero placeholder here as it does under cluster/. Applied only by running this role.
k3s_coredns_image: >-
  ghcr.io/hubertmj/self-defending-portfolio/coredns:main@sha256:9aafd8a87ef2742ad153dbc22936551fb47f92e042592a76d05e42c2f00cbacc

# ClusterIP of the kube-dns Service and kubelet's --cluster-dns, from this one value. k3s's default
# (the tenth address of k3s_service_cidr); every running pod's resolv.conf already names it, so it
# must not change on a live cluster.
k3s_cluster_dns: 10.43.0.10

# The auto-deploy file. Its name sorts before k3s's coredns.yaml, so on a k3s start that both
# applies it and removes the disabled coredns.yaml, the takeover comes first and the removal finds
# no objects left to delete (ADR 0026).
k3s_coredns_manifest_path: /var/lib/rancher/k3s/server/manifests/coredns-sdp.yaml

# How long to wait for the CoreDNS Deployment to be taken over and rolled (retries x delay seconds).
k3s_coredns_rollout_retries: 36
k3s_coredns_rollout_delay: 5

# CNI handover: flannel, the built-in network policy controller and kube-proxy
# are all disabled because Cilium provides them (kube-proxy replacement in eBPF).
k3s_flannel_backend: none
k3s_disable_network_policy: true
k3s_disable_kube_proxy: true

# How the apiserver reaches kubelets and service endpoints. k3s defaults to
# "agent", which its own documentation says "requires that the servers also run
# the kubelet, CNI, and kube-proxy, or the apiserver will not be able to access
# service endpoints" (https://docs.k3s.io/networking/basic-network-options) -
# a precondition this cluster breaks on purpose, because Cilium replaces
# kube-proxy. "cluster" routes tunnelled connections by watching Pods and
# Endpoints instead and is documented as having "the highest portability across
# different cluster configurations"; symptoms of getting this wrong are 503/502
# errors from kubectl logs, exec and port-forward. "pod" was rejected because it
# relies on the CNI respecting the node's PodCIDR allocation, which Cilium's
# IPAM does not guarantee. Known caveat: cluster and pod modes have reported
# edge cases reaching endpoints backed by host-network pods (k3s-io/k3s#5637).
# Changing this value on a live cluster requires restarting every node.
k3s_egress_selector_mode: cluster

# Encrypt Secrets at rest in the datastore.
k3s_secrets_encryption: true

# kubelet refuses to start unless the kernel already matches its expected
# defaults. The sysctl role sets exactly those values; keep the two in sync.
k3s_protect_kernel_defaults: true

# Permissions of /etc/rancher/k3s/k3s.yaml. 0600 keeps it root-only.
k3s_write_kubeconfig_mode: "0600"

# API server audit log. The policy file is rendered from a template.
k3s_audit_log_dir: /var/lib/rancher/k3s/server/logs
k3s_audit_log_path: /var/lib/rancher/k3s/server/logs/audit.log
k3s_audit_policy_path: /etc/rancher/k3s/audit-policy.yaml
k3s_audit_log_maxage: 30
k3s_audit_log_maxbackup: 10
k3s_audit_log_maxsize: 100

# Namespaces whose pod exec/attach/portforward calls are captured with full
# request and response bodies, not just metadata.
k3s_audit_verbose_namespaces:
  - sandbox
  - sandbox-unguarded

# Extra flags appended verbatim to the rendered config.yaml.
k3s_kube_apiserver_extra_args: []
k3s_kubelet_extra_args: []

# Copy the admin kubeconfig back to the control machine, rewriting the server
# address so it is usable from there. The destination is gitignored.
k3s_fetch_kubeconfig: true
k3s_kubeconfig_dest: "{{ playbook_dir }}/../../kubeconfig"

# How long to wait for the apiserver to report /readyz. The node itself stays
# NotReady until the cilium role runs, which is expected.
k3s_readyz_retries: 30
k3s_readyz_delay: 10
