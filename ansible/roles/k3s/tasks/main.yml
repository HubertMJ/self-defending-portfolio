---
- name: Create k3s directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /etc/rancher/k3s
    - /var/lib/rancher/k3s
    - "{{ k3s_audit_log_dir }}"

# The published install script has no checksum, so the binary is fetched
# straight from the release and verified against the release's own
# sha256sum-<arch>.txt, which get_url matches by file name.
- name: Install the k3s binary
  ansible.builtin.get_url:
    url: "{{ k3s_release_base_url }}/{{ k3s_version | urlencode }}/k3s"
    dest: "{{ k3s_binary_path }}"
    checksum: "sha256:{{ k3s_release_base_url }}/{{ k3s_version | urlencode }}/sha256sum-{{ k3s_arch }}.txt"
    owner: root
    group: root
    mode: "0755"
  notify: Restart k3s

- name: Link the bundled CLIs
  ansible.builtin.file:
    src: "{{ k3s_binary_path }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    owner: root
    group: root
    mode: "0755"
    follow: false
  loop: "{{ k3s_symlinks }}"

- name: Render the API server audit policy
  ansible.builtin.template:
    src: audit-policy.yaml.j2
    dest: "{{ k3s_audit_policy_path }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s

# CoreDNS from this repository (ADR 0026). On a live cluster the order is the cutover: the manifest
# goes in while k3s's own coredns is still enabled, k3s's deploy controller (15 s poll) takes the
# same-named objects over, and the Deployment rolls to the new image surge-first, so a ready DNS
# server exists throughout. k3s cannot take the kube-dns Service over by itself (its fixed ClusterIP
# makes the create fail before AlreadyExists), so coredns-handover.yml hands it over and waits until
# the new Addon owns all objects and applied cleanly. Only then does config.yaml disable k3s's
# copy; the restart that follows removes k3s's coredns.yaml and deletes what it still owns - nothing,
# since k3s finds its objects by an owner hash the takeover replaced.
- name: Check whether k3s is already running
  ansible.builtin.service_facts:

- name: Remember whether this is a live cluster
  ansible.builtin.set_fact:
    k3s_was_running: "{{ ansible_facts.services['k3s.service'].state | default('') == 'running' }}"

- name: Create the k3s auto-deploy directory
  ansible.builtin.file:
    path: "{{ k3s_coredns_manifest_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: k3s_coredns_own | bool

- name: Install this repository's CoreDNS manifest
  ansible.builtin.template:
    src: coredns-sdp.yaml.j2
    dest: "{{ k3s_coredns_manifest_path }}"
    owner: root
    group: root
    mode: "0600"
  register: k3s_coredns_manifest
  when: k3s_coredns_own | bool

# Rollback: without the file and with coredns no longer disabled, the restart re-stages k3s's own
# manifest, which takes the objects back. Removing the file alone deletes nothing in the cluster.
- name: Remove this repository's CoreDNS manifest
  ansible.builtin.file:
    path: "{{ k3s_coredns_manifest_path }}"
    state: absent
  notify: Restart k3s
  when: not (k3s_coredns_own | bool)

# Before the restart that disables k3s's copy: every object, the kube-dns Service included, must
# belong to the new manifest (ADR 0026, correction).
- name: Make the new manifest the complete owner of CoreDNS before k3s's copy is disabled
  ansible.builtin.include_tasks: coredns-handover.yml
  vars:
    k3s_coredns_addon: "{{ k3s_coredns_manifest_path | basename | splitext | first }}"
    k3s_coredns_addon_manifest: "{{ k3s_coredns_manifest_path }}"
  when:
    - k3s_coredns_own | bool
    - k3s_coredns_manifest is changed
    - k3s_was_running | bool
    - not ansible_check_mode

- name: Render the k3s server configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s

- name: Install the k3s systemd unit
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- name: Ensure k3s is enabled and running
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true

- name: Apply pending k3s changes before waiting for the API server
  ansible.builtin.meta: flush_handlers

- name: Wait for the admin kubeconfig to appear
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    timeout: 300

# Only the API server is checked here. The node stays NotReady until the
# cilium role installs a CNI, so waiting on node readiness would deadlock.
- name: Wait for the API server to report ready
  ansible.builtin.command:
    cmd: "{{ k3s_binary_path }} kubectl get --raw /readyz"
  register: k3s_readyz
  changed_when: false
  retries: "{{ k3s_readyz_retries }}"
  delay: "{{ k3s_readyz_delay }}"
  until: k3s_readyz.rc == 0

# Either direction, on a cluster that was already running: the expected manifest owns every CoreDNS
# object and has applied cleanly, and the Deployment has rolled. On a rollback this is where the
# kube-dns Service is handed back to k3s's own Addon. Skipped on a first install, where no CNI
# exists yet (cilium role).
- name: Make the expected manifest the complete owner of CoreDNS
  ansible.builtin.include_tasks: coredns-handover.yml
  vars:
    k3s_coredns_addon: >-
      {{ (k3s_coredns_manifest_path | basename | splitext | first) if (k3s_coredns_own | bool) else 'coredns' }}
    k3s_coredns_addon_manifest: >-
      {{ k3s_coredns_manifest_path if (k3s_coredns_own | bool)
         else (k3s_coredns_manifest_path | dirname) ~ '/coredns.yaml' }}
  when:
    - k3s_was_running | bool
    - not ansible_check_mode

# CIS k3s 1.1.20 (kube-bench k3s-cis-1.9): k3s writes the certificates in server/tls world-readable
# (0644); the benchmark wants 0600, and the check's own remediation is a manual
# `chmod 600 /var/lib/rancher/k3s/server/tls/*.crt`. Only the k3s process (root) reads them on this
# node - no pod mounts server/tls except kube-bench, read-only and as root, to stat them. Top level
# only, the files the check looks at. Runs after the API server is ready, i.e. after a restart has
# written any missing or renewed certificate: k3s creates those 0644 again, and the next run of this
# role (or the next kube-bench FAIL) brings them back.
- name: Find the k3s server certificates
  ansible.builtin.find:
    paths: /var/lib/rancher/k3s/server/tls
    patterns: "*.crt"
    file_type: file
  register: k3s_server_certs

- name: Restrict the k3s server certificates to root (CIS 1.1.20)
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0600"
  loop: "{{ k3s_server_certs.files }}"
  loop_control:
    label: "{{ item.path }}"

# no_log on both tasks below: the kubeconfig embeds the cluster CA plus the
# admin client certificate and key, and without it Ansible prints the whole
# base64 blob (and the decoded content) on -v or on failure.
- name: Read the admin kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig_raw
  no_log: true
  when: k3s_fetch_kubeconfig | bool

- name: Store the kubeconfig on the control machine
  ansible.builtin.copy:
    content: >-
      {{ k3s_kubeconfig_raw.content | b64decode
         | replace('https://127.0.0.1:6443', 'https://' ~ k3s_kubeconfig_server ~ ':6443') }}
    dest: "{{ k3s_kubeconfig_dest }}"
    mode: "0600"
  no_log: true
  become: false
  delegate_to: localhost
  vars:
    k3s_kubeconfig_server: "{{ ansible_host | default(k3s_node_ip) }}"
  when: k3s_fetch_kubeconfig | bool
