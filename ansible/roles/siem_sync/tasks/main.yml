---
# The rules sync (ADR 0034 "Rules from git", siem contract P3). Order: packages, user and directories,
# the program, the unit and the timer - the timer is enabled last, so no run starts half installed.
- name: Look for the rules-sync certificate and key
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: [ "{{ siem_sync_cert }}", "{{ siem_sync_key }}", "{{ siem_sync_ca }}" ]
  register: siem_sync_identity

# The opensearch role makes the rules-sync identity on siem01 (it never passes the remote entry
# point); a check run before that role has run once cannot have it yet.
- name: Assert the rules-sync identity exists
  ansible.builtin.assert:
    that:
      - siem_sync_identity.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      {{ siem_sync_identity.results | rejectattr('stat.exists') | map(attribute='item') | join(', ') }} missing:
      the opensearch role makes the rules-sync identity, run it first.
    success_msg: The rules-sync identity is in place.
  when: not ansible_check_mode

- name: Install git and PyYAML
  ansible.builtin.apt:
    name: [git, python3-yaml]
    state: present
    install_recommends: false

- name: Create the system group the sync runs as
  ansible.builtin.group:
    name: "{{ siem_sync_user }}"
    system: true

- name: Create the system user the sync runs as
  ansible.builtin.user:
    name: "{{ siem_sync_user }}"
    group: "{{ siem_sync_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ siem_sync_state_dir }}"
    create_home: false

- name: Create the program and state directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ siem_sync_lib_dir }}", owner: root, mode: "0755"}
    - {path: "{{ siem_sync_state_dir }}", owner: "{{ siem_sync_user }}", mode: "0750"}
  loop_control:
    label: "{{ item.path }}"

# From the operator's checkout, pinned by this role: the fetched tree is only ever read as data.
- name: Install the sync program, the lint and the flag remover
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ siem_sync_lib_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop: [sdp_siem_sync.py, siem_lint.py, consume-flags]

- name: Write the sync's settings
  ansible.builtin.template:
    src: sync.env.j2
    dest: /etc/sdp-siem/sync.env
    owner: root
    group: root
    mode: "0644"

- name: Install the unit and the timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop: [sdp-siem-sync.service, sdp-siem-sync.timer]
  register: siem_sync_units
  notify: Reload systemd

- name: Load the unit files before the timer is touched
  ansible.builtin.meta: flush_handlers

# A check run before the first apply has no unit to look at.
- name: Start and enable the timer, or stop and disable it
  ansible.builtin.systemd_service:
    name: sdp-siem-sync.timer
    enabled: "{{ siem_sync_timer_enabled | bool }}"
    state: "{{ 'started' if siem_sync_timer_enabled | bool else 'stopped' }}"
  when: not (ansible_check_mode and siem_sync_units is changed)
