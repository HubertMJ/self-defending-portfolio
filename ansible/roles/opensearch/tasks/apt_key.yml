---
# The repository key is trusted only after its primary fingerprint equals the pin (ADR 0008
# amendment): apt then verifies every index against it, and tasks/apt_package.yml checks the
# package hash in that index. The key is downloaded once; refreshing it (the signing subkey expires
# 2027-03-06) means deleting the staging file and running the role again.
- name: Create the staging directory for downloaded trust material
  ansible.builtin.file:
    path: /var/lib/sdp-siem
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Download the OpenSearch release key to the staging file
  ansible.builtin.get_url:
    url: "{{ opensearch_apt_key_url }}"
    dest: /var/lib/sdp-siem/opensearch-release.pgp
    owner: root
    group: root
    mode: "0600"

# --show-keys lists the file's packets without importing anything; gpg still wants a home.
- name: Create a private gpg home for reading the key
  ansible.builtin.file:
    path: /var/lib/sdp-siem/gnupg
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Read the key's packets without importing it
  ansible.builtin.command:
    cmd: >-
      gpg --homedir /var/lib/sdp-siem/gnupg --batch --no-autostart --show-keys --with-colons --fixed-list-mode
      /var/lib/sdp-siem/opensearch-release.pgp
  register: opensearch_apt_key_colons
  changed_when: false
  # A read: in check mode too, or the fingerprint assert below sees nothing.
  check_mode: false

- name: Assert the file holds exactly the pinned primary key
  ansible.builtin.assert:
    that:
      - opensearch_apt_key_pub | length == 1
      - opensearch_apt_key_primary_fpr == opensearch_apt_key_fingerprint
    fail_msg: >-
      The downloaded OpenSearch key is not the pinned one (primary keys: {{ opensearch_apt_key_pub | length }},
      first fingerprint {{ opensearch_apt_key_primary_fpr }}, pin {{ opensearch_apt_key_fingerprint }}).
      Nothing was trusted.
    success_msg: The OpenSearch key is the pinned primary key.
  vars:
    opensearch_apt_key_pub: "{{ opensearch_apt_key_colons.stdout_lines | select('match', '^pub:') | list }}"
    # With a single primary key the first fpr record is the primary's (sub keys follow it).
    opensearch_apt_key_primary_fpr: >-
      {{ opensearch_apt_key_colons.stdout_lines | select('match', '^fpr:') | first | default('')
         | regex_replace('^fpr:{9}([0-9A-F]{40}):.*$', '\1') }}

- name: Trust the verified key for the OpenSearch repositories only
  ansible.builtin.copy:
    src: /var/lib/sdp-siem/opensearch-release.pgp
    dest: "{{ opensearch_apt_keyring }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
