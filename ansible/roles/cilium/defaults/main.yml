---
# Pinned helm client. Downloaded from get.helm.sh and verified against the
# published .sha256sum for the same tarball.
# The unprefixed inventory variable helm_version is honoured for convenience,
# but ansible-lint (var-naming[no-role-prefix]) forbids declaring it here, so
# cilium_helm_version is the canonical name.
cilium_helm_version: "{{ helm_version | default('v3.22.0') }}"
cilium_helm_arch: amd64
cilium_helm_base_url: https://get.helm.sh
cilium_helm_binary: /usr/local/bin/helm
cilium_helm_tarball_name: "helm-{{ cilium_helm_version }}-linux-{{ cilium_helm_arch }}.tar.gz"
cilium_helm_tarball_url: "{{ cilium_helm_base_url }}/{{ cilium_helm_tarball_name }}"

# k3s ships kubectl through an argv[0] symlink on the binary itself.
cilium_kubectl_binary: /usr/local/bin/k3s

# Pinned Cilium chart version (chart and image versions match upstream; the images overridden in
# cilium_values are this release rebuilt here, ADR 0028).
cilium_version: 1.19.8
cilium_chart_repo_name: cilium
cilium_chart_repo_url: https://helm.cilium.io
cilium_chart_ref: cilium/cilium
cilium_release_name: cilium
cilium_namespace: kube-system

# kubeconfig used by helm. k3s writes it root-only, so the role runs with become.
cilium_kubeconfig: /etc/rancher/k3s/k3s.yaml

# Cilium must reach the API server directly: kube-proxy is disabled, so the
# in-cluster 10.43.0.1 service VIP does not exist until Cilium itself is up.
cilium_k8s_service_host: "{{ k3s_node_ip | default(ansible_default_ipv4.address) }}"
cilium_k8s_service_port: 6443

# Pod CIDR. Must equal k3s_cluster_cidr, otherwise native routing drops traffic.
cilium_cluster_cidr: "{{ k3s_cluster_cidr | default('10.42.0.0/16') }}"

# Gateway API CRDs. Applied before the helm install so that Cilium comes up with its Gateway
# support already functional: the operator only starts its Gateway controller when the CRDs exist
# at operator start, and the chart only creates the `cilium` GatewayClass when the CRDs are
# registered at render time (gatewayAPI.gatewayClass.create defaults to `auto`).
# Pinned to the same version and URL as cluster/infra/gateway-api-crds/kustomization.yaml; Argo CD
# keeps owning these CRDs afterwards (cluster/apps/gateway-api-crds.yaml, server-side apply).
cilium_install_gateway_api_crds: true
cilium_gateway_api_version: v1.4.1
cilium_gateway_api_crds_base_url: https://github.com/kubernetes-sigs/gateway-api/releases/download
cilium_gateway_api_crds_url: "{{ cilium_gateway_api_crds_base_url }}/{{ cilium_gateway_api_version }}/standard-install.yaml"
# sha256 of the pinned standard-install.yaml. Upstream publishes no checksum file for release
# assets, so this digest was computed from the downloaded artefact and must be recomputed when
# cilium_gateway_api_version changes:
#   curl -fsSL <cilium_gateway_api_crds_url> | sha256sum
cilium_gateway_api_crds_checksum: "sha256:73b91b77f6be023a8c92c969fc664e5bd3b1a28aea59eac9ebc904607354dad2"
cilium_gateway_api_crds_path: "/tmp/gateway-api-standard-install-{{ cilium_gateway_api_version }}.yaml"

# Chart values. Overriding this variable replaces the map wholesale.
cilium_values:
  # eBPF replaces kube-proxy entirely; k3s is started with disable-kube-proxy.
  kubeProxyReplacement: true
  k8sServiceHost: "{{ cilium_k8s_service_host }}"
  k8sServicePort: "{{ cilium_k8s_service_port }}"
  # Single node: no tunnel, pods are routed natively inside the node.
  routingMode: native
  ipv4NativeRoutingCIDR: "{{ cilium_cluster_cidr }}"
  autoDirectNodeRoutes: true
  ipam:
    mode: kubernetes
  bpf:
    masquerade: true
  operator:
    replicas: 1
    prometheus:
      enabled: false
    # Built here from the chart's release with fixed dependencies (ADR 0028); identical to
    # cluster/apps/cilium.yaml, bumped together by scripts/bump-image-digest.sh.
    image:
      # yamllint disable-line rule:line-length
      override: ghcr.io/hubertmj/self-defending-portfolio/cilium-operator-generic:main@sha256:04f4695b73b283f33b22b2d27b301df8214f35916f4d24129d71ee8f558c5db0
  # Hubble gives flow visibility, which is the point of a self-defending
  # deployment. The UI stays off until it is fronted by the tunnel.
  hubble:
    enabled: true
    relay:
      enabled: true
      # ADR 0028, as operator.image above.
      image:
        # yamllint disable-line rule:line-length
        override: ghcr.io/hubertmj/self-defending-portfolio/hubble-relay:main@sha256:23fb1c3769503fd2a322e386d65df2fe0402c3ba4185f338d6de53ae4d5bbf3e
    ui:
      enabled: false
  # Default means policy applies only to endpoints selected by a policy.
  policyEnforcementMode: default
  # Gateway API (ADR 0010). Identical to cluster/apps/cilium.yaml so the Argo CD takeover is a
  # no-op; scripts/check-cilium-values.sh enforces that.
  gatewayAPI:
    # The chart creates the `cilium` GatewayClass only when the Gateway API CRDs are already
    # registered (gatewayClass.create defaults to `auto`, which inspects the cluster's API
    # versions at render time), which is why this role applies the CRDs first.
    enabled: true
    # Trust one proxy hop for X-Forwarded-For/X-Forwarded-Proto. The only path to the Gateway
    # is cloudflared (NetworkPolicy), which relays Cloudflare's headers; with 0 hops Envoy
    # overwrites X-Forwarded-Proto with its own scheme, so the http->https redirect and any
    # per-visitor rate limit would see the tunnel instead of the visitor.
    xffNumTrustedHops: 1
    # Nothing binds a host port: the only path in is the tunnel (ADR 0003).
    hostNetwork:
      enabled: false
    # Copies Secrets referenced by a listener's certificateRefs into cilium-secrets so Envoy's
    # SDS can read them without cluster-wide Secret access.
    secretsNamespace:
      create: true
      name: cilium-secrets
      sync: true
  envoy:
    # Envoy as its own DaemonSet rather than embedded in the agent. The chart already defaults to
    # this for new installations, but the default is `null`, so it is stated here: a chart bump
    # must not be able to move the L7 data plane by changing a default.
    enabled: true
    # Upstream's image at the chart's digest plus Ubuntu's OpenSSL update; Envoy is untouched
    # (ADR 0028, as operator.image above).
    image:
      # yamllint disable-line rule:line-length
      override: ghcr.io/hubertmj/self-defending-portfolio/cilium-envoy:main@sha256:6ad67d1d41da91b9b93b7b42cc16c1f899fefd2e4dfc425438c00017f95c91e0

# helm install/upgrade behaviour.
cilium_helm_wait: true
cilium_helm_timeout: 10m0s

# Post-install wait for the node to leave NotReady.
cilium_node_ready_retries: 30
cilium_node_ready_delay: 10
