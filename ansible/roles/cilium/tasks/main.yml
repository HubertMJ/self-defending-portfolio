---
- name: Check the installed helm version
  ansible.builtin.command:
    cmd: "{{ cilium_helm_binary }} version --short"
  register: cilium_helm_installed
  changed_when: false
  failed_when: false

- name: Install the pinned helm client
  when: cilium_helm_installed.stdout | default('') is not search(cilium_helm_version)
  block:
    # The tarball name is kept intact because get_url looks the expected digest
    # up in the published .sha256sum file by file name.
    - name: Download the helm release with checksum verification
      ansible.builtin.get_url:
        url: "{{ cilium_helm_tarball_url }}"
        dest: "/tmp/{{ cilium_helm_tarball_name }}"
        checksum: "sha256:{{ cilium_helm_tarball_url }}.sha256sum"
        owner: root
        group: root
        mode: "0600"

    - name: Unpack the helm release
      ansible.builtin.unarchive:
        src: "/tmp/{{ cilium_helm_tarball_name }}"
        dest: /tmp
        remote_src: true
        extra_opts:
          - --no-same-owner
        creates: "/tmp/linux-{{ cilium_helm_arch }}/helm"

    - name: Place the helm binary
      ansible.builtin.copy:
        src: "/tmp/linux-{{ cilium_helm_arch }}/helm"
        dest: "{{ cilium_helm_binary }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Remove the helm download artefacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/linux-{{ cilium_helm_arch }}"
        - "/tmp/{{ cilium_helm_tarball_name }}"

# The Gateway API CRDs must exist before Cilium starts, not after: cilium-operator only starts its
# Gateway controller when the CRDs are present at operator start, and the chart only renders the
# `cilium` GatewayClass when they are registered at template time (gatewayAPI.gatewayClass.create
# defaults to `auto`). Applying them afterwards -- for example by leaving them to the
# gateway-api-crds Argo CD Application -- costs a manual restart of cilium-operator, and because
# gatewayAPI.enabled also rewrites cilium-config, of the agent DaemonSet and cilium-envoy too.
- name: Install the Gateway API CRDs
  when: cilium_install_gateway_api_crds | bool
  block:
    # The upstream release stamps every CRD with the bundle version it came from, which is the
    # cheapest way to ask the cluster whether the pinned release is already installed.
    # Plain JSON instead of a jsonpath with escaped dots: the command module would mangle the
    # backslashes and the guard would never match.
    - name: Read the installed Gateway API CRD
      ansible.builtin.command:
        cmd: "{{ cilium_kubectl_binary }} kubectl get crd gateways.gateway.networking.k8s.io -o json"
      environment:
        KUBECONFIG: "{{ cilium_kubeconfig }}"
      register: cilium_gateway_api_installed
      changed_when: false
      failed_when: false

    - name: Record the installed Gateway API bundle version
      ansible.builtin.set_fact:
        cilium_gateway_api_installed_version: >-
          {{ (cilium_gateway_api_installed.stdout | from_json).metadata.annotations['gateway.networking.k8s.io/bundle-version']
             if cilium_gateway_api_installed.rc == 0 else '' }}

    - name: Apply the pinned Gateway API standard channel CRDs
      when: cilium_gateway_api_installed_version | trim != cilium_gateway_api_version
      block:
        # Upstream publishes no checksum file next to the release asset, so the digest is pinned in
        # the role's defaults instead of being looked up by file name.
        - name: Download the Gateway API CRDs with checksum verification
          ansible.builtin.get_url:
            url: "{{ cilium_gateway_api_crds_url }}"
            dest: "{{ cilium_gateway_api_crds_path }}"
            checksum: "{{ cilium_gateway_api_crds_checksum }}"
            owner: root
            group: root
            mode: "0600"

        # Server-side apply for two reasons: the CRDs are far larger than the 262 144-byte limit of
        # the client-side last-applied-configuration annotation, and it is the apply mode the
        # gateway-api-crds Application uses (ServerSideApply=true), so Argo CD adopts these objects
        # field by field instead of fighting a different field manager.
        #
        # kubectl reports `serverside-applied` per object and does not distinguish a create from an
        # update, so only the client-side wording is treated as a no-op; the task itself is only
        # reached when the installed bundle version differs from the pin.
        - name: Apply the Gateway API CRDs
          ansible.builtin.command:
            cmd: >-
              {{ cilium_kubectl_binary }} kubectl apply --server-side
              -f {{ cilium_gateway_api_crds_path }}
          environment:
            KUBECONFIG: "{{ cilium_kubeconfig }}"
          register: cilium_gateway_api_crds_apply
          changed_when: cilium_gateway_api_crds_apply.stdout_lines
            | reject('search', ' unchanged$') | list | length > 0

        - name: Remove the Gateway API CRD download
          ansible.builtin.file:
            path: "{{ cilium_gateway_api_crds_path }}"
            state: absent

# After bootstrap, Argo CD (cluster/apps/cilium.yaml) owns the Cilium release: it applies the chart's
# rendered manifests itself and creates new objects without Helm ownership metadata, which a later
# `helm upgrade` from here would refuse to adopt. Once the hand-over has happened this role only
# guarantees the prerequisites (CRDs, sysctl) and leaves the release alone. The hand-over is
# detected by the presence of the Argo CD Application; a rebuild from zero has none and installs.
- name: Check whether Argo CD already owns the Cilium release
  ansible.builtin.command:
    cmd: "{{ cilium_kubectl_binary }} kubectl get application.argoproj.io {{ cilium_release_name }} -n argocd -o name"
  environment:
    KUBECONFIG: "{{ cilium_kubeconfig }}"
  register: cilium_argocd_app
  changed_when: false
  failed_when: false

- name: Record whether the release is GitOps-managed
  ansible.builtin.set_fact:
    cilium_managed_by_argocd: "{{ cilium_argocd_app.rc == 0 and (cilium_argocd_app.stdout | trim | length > 0) }}"

- name: Add the Cilium helm repository
  when: not cilium_managed_by_argocd
  kubernetes.core.helm_repository:
    name: "{{ cilium_chart_repo_name }}"
    repo_url: "{{ cilium_chart_repo_url }}"
    binary_path: "{{ cilium_helm_binary }}"

- name: Install Cilium
  when: not cilium_managed_by_argocd
  kubernetes.core.helm:
    name: "{{ cilium_release_name }}"
    chart_ref: "{{ cilium_chart_ref }}"
    chart_version: "{{ cilium_version }}"
    release_namespace: "{{ cilium_namespace }}"
    kubeconfig: "{{ cilium_kubeconfig }}"
    binary_path: "{{ cilium_helm_binary }}"
    values: "{{ cilium_values }}"
    wait: "{{ cilium_helm_wait }}"
    timeout: "{{ cilium_helm_timeout }}"
    atomic: false

# Until Cilium is running the node has no CNI and stays NotReady, so this is
# the first point where node readiness is a meaningful signal.
- name: Wait for the node to become Ready
  ansible.builtin.command:
    cmd: "{{ cilium_kubectl_binary }} kubectl get node {{ inventory_hostname_short }} --no-headers"
  register: cilium_node_state
  changed_when: false
  retries: "{{ cilium_node_ready_retries }}"
  delay: "{{ cilium_node_ready_delay }}"
  until: cilium_node_state.stdout is search(' Ready ')
