# Parsers of the SIEM shipper (ADR 0034). CRI pod logs use Fluent Bit's built-in `cri` multiline
# parser; their JSON body, the audit log and the Hubble export are decoded with sdp_json. Times are
# not taken here: sdp.lua sets each record's time from the event's own field.
[PARSER]
    Name   sdp_json
    Format json

# OpenSearch's security audit log on siem01: "[<log4j time>] <one JSON audit event>".
[PARSER]
    Name   sdp_osaudit
    Format regex
    Regex  ^\[[^\]]*\] (?<payload>\{.*\})$
