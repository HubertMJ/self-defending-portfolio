---
# The shipper's two secrets (ADR 0034 "Privacy" and "Who may talk to 9200"; siem contract P2, C1, B8):
#   - the HMAC key, 32 random bytes made on this host, root-only, never fetched; rotating it = deleting
#     it (pseudonym continuity breaks, accepted);
#   - the client key. On k3s01 it is made here and only its CSR travels: siem01 signs it through the
#     remote entry point (roles/opensearch/tasks/sign_client_csr.yml) for the name this role expects,
#     never one taken from the CSR. On siem01 the local identity shipper-siem01 is used as the
#     opensearch role made it; its key stays where it is and reaches the unit as a credential.
# Public files (the CA and the client certificate) go to /etc/fluent-bit/tls.
- name: Create the key and certificate directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/fluent-bit/keys, mode: "0700"}
    - {path: /etc/fluent-bit/tls, mode: "0755"}
  loop_control:
    label: "{{ item.path }}"

- name: Make the HMAC key once
  ansible.builtin.shell:
    cmd: umask 077 && head -c 32 /dev/urandom > /etc/fluent-bit/keys/hmac.key
    creates: /etc/fluent-bit/keys/hmac.key
  notify: Restart fluent-bit

# In check mode a deleted key is not made again; the permission task must not fail on it.
- name: Look for the HMAC key
  ansible.builtin.stat:
    path: /etc/fluent-bit/keys/hmac.key
  register: fluent_bit_hmac_stat

- name: Keep the HMAC key root-only
  ansible.builtin.file:
    path: /etc/fluent-bit/keys/hmac.key
    owner: root
    group: root
    mode: "0400"
  when: fluent_bit_hmac_stat.stat.exists

- name: Use siem01's local shipper identity
  when: fluent_bit_profile == 'siem01'
  block:
    - name: Publish the CA and the shipper-siem01 certificate to the unit
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop:
        - {src: /etc/sdp-siem/pki/ca.crt, dest: /etc/fluent-bit/tls/ca.crt}
        - {src: /etc/sdp-siem/pki/shipper-siem01.crt, dest: /etc/fluent-bit/tls/client.crt}
      loop_control:
        label: "{{ item.dest }}"
      notify: Restart fluent-bit

- name: Get k3s01's certificate signed on siem01
  when: fluent_bit_profile == 'k3s01'
  block:
    - name: Install what the key and request tasks need
      ansible.builtin.apt:
        name: [openssl, python3-cryptography]
        state: present

    - name: Create the client key
      community.crypto.openssl_privatekey:
        path: /etc/fluent-bit/keys/client.key
        type: RSA
        size: 4096
        format: pkcs8
        owner: root
        group: root
        mode: "0400"
      notify: Restart fluent-bit

    - name: Look for the current client certificate
      ansible.builtin.stat:
        path: /etc/fluent-bit/tls/client.crt
      register: fluent_bit_cert_stat

    - name: Read the current client certificate
      community.crypto.x509_certificate_info:
        path: /etc/fluent-bit/tls/client.crt
        valid_at:
          renew: "{{ fluent_bit_cert_renew_before }}"
      register: fluent_bit_cert_info
      when: fluent_bit_cert_stat.stat.exists

    - name: Look for the client key
      ansible.builtin.stat:
        path: /etc/fluent-bit/keys/client.key
      register: fluent_bit_key_stat

    - name: Read the client key's public half
      community.crypto.openssl_privatekey_info:
        path: /etc/fluent-bit/keys/client.key
      register: fluent_bit_key_info
      when: fluent_bit_cert_stat.stat.exists and fluent_bit_key_stat.stat.exists

    # A new certificate when there is none, it is close to its end, the generation was bumped
    # (group_vars/siem_nodes.yml opensearch_cert_generations) or the key was replaced.
    - name: Decide whether a certificate is needed
      ansible.builtin.set_fact:
        fluent_bit_cert_needed: >-
          {{ not fluent_bit_cert_stat.stat.exists
             or not fluent_bit_key_stat.stat.exists
             or not fluent_bit_cert_info.valid_at.renew
             or fluent_bit_cert_info.subject.commonName | default('') != fluent_bit_cert_cn
             or fluent_bit_cert_info.public_key != fluent_bit_key_info.public_key }}

    - name: Build the certificate request from role-fixed values
      community.crypto.openssl_csr_pipe:
        privatekey_path: /etc/fluent-bit/keys/client.key
        subject_ordered: "{{ fluent_bit_cert_subject }}"
        use_common_name_for_san: false
      register: fluent_bit_csr
      changed_when: false
      # In check mode there may be no key yet to build a request from; nothing is signed.
      when: fluent_bit_cert_needed | bool and not ansible_check_mode

    - name: Sign the request on siem01 through the remote entry point
      ansible.builtin.include_role:
        name: opensearch
        tasks_from: sign_client_csr
        apply:
          delegate_to: "{{ fluent_bit_signer }}"
          become: true
      vars:
        opensearch_csr_pem: "{{ fluent_bit_csr.csr }}"
        opensearch_csr_name: "{{ fluent_bit_profiles[fluent_bit_profile].identity }}"
        opensearch_csr_generation: "{{ fluent_bit_cert_generation }}"
        # The signer's own variables, which this host's inventory does not carry.
        opensearch_cert_generations: "{{ hostvars[fluent_bit_signer].opensearch_cert_generations }}"
        opensearch_node_name: "{{ hostvars[fluent_bit_signer].inventory_hostname_short }}"
      when: fluent_bit_cert_needed | bool and not ansible_check_mode

    - name: Install the signed certificate
      ansible.builtin.copy:
        content: "{{ opensearch_csr_certificate }}"
        dest: /etc/fluent-bit/tls/client.crt
        owner: root
        group: root
        mode: "0644"
      notify: Restart fluent-bit
      when: fluent_bit_cert_needed | bool and not ansible_check_mode

    - name: Read the SIEM's CA certificate on siem01
      ansible.builtin.slurp:
        src: /etc/sdp-siem/pki/ca.crt
      delegate_to: "{{ fluent_bit_signer }}"
      register: fluent_bit_ca

    - name: Publish the CA certificate to the unit
      ansible.builtin.copy:
        content: "{{ fluent_bit_ca.content | b64decode }}"
        dest: /etc/fluent-bit/tls/ca.crt
        owner: root
        group: root
        mode: "0644"
      notify: Restart fluent-bit
