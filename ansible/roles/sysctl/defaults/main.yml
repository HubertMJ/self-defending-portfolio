---
# Single file so the whole set can be inspected or removed at once.
sysctl_file: /etc/sysctl.d/90-hardening.conf

# Second drop-in, deliberately separate and ordered last (99-), holding the one
# setting Cilium cannot tolerate being wrong: net.ipv4.conf.*.rp_filter = 0.
# conf.all and conf.default in sysctl_file above are not a complete guarantee.
# rp_filter is a per-interface knob; a device only inherits conf.default at
# creation time, and systemd-sysctl re-applies matching globs to every interface
# as udev creates it. Upstream systemd ships `net.ipv4.conf.*.rp_filter = 2` in
# /usr/lib/sysctl.d/50-default.conf for exactly that reason, and Debian 13
# installs it too (package linux-sysctl-defaults: `net.ipv4.conf.*.rp_filter = 2`,
# seen on k3s01 and siem01 on 2026-10-04; an earlier note here said otherwise).
# This file is the only construct that keeps every veth and cilium_* device at 0
# against that glob, and a silent regression here breaks pod networking with no
# error message anywhere.
sysctl_rp_filter_file: /etc/sysctl.d/99-cilium-rp-filter.conf

# The kernel parameter map is built from three parts (ADR 0009 amendment
# 2026-10-04): hardening keys every host gets, the keys a k3s node with Cilium
# needs (rp_filter off, forwarding on, kubelet's protect-kernel-defaults
# values) and host-specific extras. Each part is replaced as a whole when
# overridden (Ansible does not deep-merge by default).
#
# The effective map, in loop order. On k3s nodes it must equal the single map
# the role had before the split, key for key and in the same order, because
# the loop order is the drop-in's line order on a fresh host
# (tests/golden/render.sh compares it with the pre-split render). combine()
# keeps the position of a key that already exists and appends new keys, so the
# two rp_filter keys, which sat in the middle of the old map, keep their slot in
# sysctl_common_settings as null placeholders; null entries are dropped here,
# so a host without the k3s part never sets them.
sysctl_settings: >-
  {{ sysctl_common_settings
     | combine(sysctl_k3s_settings if sysctl_k3s_enabled | bool else {}, sysctl_extra_settings)
     | dict2items | rejectattr('value', 'none') | items2dict }}

# Whether this host gets sysctl_k3s_settings and the rp_filter drop-in.
sysctl_k3s_enabled: "{{ 'k3s_nodes' in group_names }}"

# Host-specific additions, appended after the other parts (siem01:
# vm.max_map_count for OpenSearch's mmapped index files, vm.swappiness 1).
sysctl_extra_settings: {}

sysctl_common_settings:
  # --- Kernel information leaks and attack surface ---
  kernel.kptr_restrict: "2"
  kernel.dmesg_restrict: "1"
  # Cilium's agent runs as root, so it is unaffected by this restriction while
  # unprivileged workloads lose the bpf() syscall entirely.
  kernel.unprivileged_bpf_disabled: "1"
  # Deliberately 1, not 2: value 2 adds constant blinding, which measurably
  # slows Cilium's datapath. 1 keeps the JIT hardening that matters.
  net.core.bpf_jit_harden: "1"
  kernel.yama.ptrace_scope: "1"
  kernel.sysrq: "0"
  # Debian's default is 3, a Debian-only level (kernel patch "perf: allow further restriction of
  # perf_event_open") that refuses perf_event_open() to every process without CAP_SYS_ADMIN - and
  # CAP_PERFMON does not count. Falco's modern eBPF probe attaches its TOCTOU-mitigation programs
  # to syscall tracepoints through perf_event_open(), so at 3 the least-privileged sensor (BPF,
  # PERFMON, SYS_RESOURCE, SYS_PTRACE) dies with EACCES (ADR 0013, amendment). 2 is the upstream
  # kernel default: unprivileged processes may only measure their own user-space activity, and
  # tracepoints and kernel profiling still need CAP_PERFMON. The alternative was CAP_SYS_ADMIN for
  # Falco, which is a far larger grant than this.
  kernel.perf_event_paranoid: "2"

  # --- Filesystem hardening ---
  fs.protected_hardlinks: "1"
  fs.protected_symlinks: "1"
  fs.protected_fifos: "2"
  fs.protected_regular: "2"

  # --- Network: position of the Cilium rp_filter keys (set in sysctl_k3s_settings) ---
  net.ipv4.conf.all.rp_filter: null
  net.ipv4.conf.default.rp_filter: null

  # --- Network hardening ---
  net.ipv4.conf.all.accept_redirects: "0"
  net.ipv4.conf.default.accept_redirects: "0"
  net.ipv4.conf.all.send_redirects: "0"
  net.ipv4.conf.default.send_redirects: "0"
  net.ipv4.conf.all.accept_source_route: "0"
  net.ipv4.conf.default.accept_source_route: "0"
  net.ipv4.conf.all.log_martians: "1"
  net.ipv4.tcp_syncookies: "1"
  net.ipv6.conf.all.accept_redirects: "0"
  net.ipv6.conf.default.accept_redirects: "0"
  # The node has a static address from cloud-init, so router advertisements
  # are not needed. Set to 1 if the LAN relies on SLAAC.
  net.ipv6.conf.all.accept_ra: "0"

sysctl_k3s_settings:
  # --- Network: required by Cilium ---
  # Cilium REQUIRES reverse path filtering to be disabled. Its datapath sends
  # replies from interfaces the kernel does not consider the route source
  # (veth pairs, cilium_host); with rp_filter enabled those packets are
  # silently dropped and pod networking breaks. Do not raise these to 1 or 2.
  net.ipv4.conf.all.rp_filter: "0"
  net.ipv4.conf.default.rp_filter: "0"

  # --- Routing required by Kubernetes ---
  net.ipv4.ip_forward: "1"
  net.ipv6.conf.all.forwarding: "1"

  # --- Limits: many watches are consumed by kubelet and controllers ---
  fs.inotify.max_user_instances: "8192"
  fs.inotify.max_user_watches: "1048576"

  # --- Values kubelet protect-kernel-defaults=true verifies ---
  # k3s is started with protect-kernel-defaults, which makes kubelet refuse to
  # start unless these already hold. Changing any of them requires the matching
  # change in the k3s role.
  vm.overcommit_memory: "1"
  vm.panic_on_oom: "0"
  kernel.panic: "10"
  kernel.panic_on_oops: "1"
  kernel.keys.root_maxkeys: "1000000"
  kernel.keys.root_maxbytes: "25000000"
