---
- name: Apply kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: "{{ sysctl_file }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ sysctl_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"

- name: Ensure the sysctl drop-in is world readable but root owned
  ansible.builtin.file:
    path: "{{ sysctl_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Disable reverse path filtering on every present and future interface
  ansible.builtin.copy:
    dest: "{{ sysctl_rp_filter_file }}"
    content: |
      # Managed by Ansible (role: sysctl)
      # Cilium requires reverse path filtering off on every interface. The glob
      # is the point: rp_filter is per interface, systemd-sysctl re-applies
      # matching globs through udev for each device Cilium creates, and this
      # file sorts after anything that might set rp_filter back to 1 or 2
      # (upstream systemd's 50-default.conf does; Debian 13 omits it).
      net.ipv4.conf.*.rp_filter = 0
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-sysctl
