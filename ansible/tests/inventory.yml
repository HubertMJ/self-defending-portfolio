# Inventory for tests/smoke.sh: the target is a docker container, not a VM.
all:
  children:
    k3s_nodes:
      hosts:
        sdp-smoke:
          ansible_connection: community.docker.docker_api
          ansible_user: root
          ansible_python_interpreter: /usr/bin/python3
          base_hostname: sdp-smoke
          k3s_node_ip: 172.17.0.2
          lan_cidr: 172.17.0.0/16
          k3s_cluster_cidr: 10.42.0.0/16
          k3s_service_cidr: 10.43.0.0/16
          ssh_hardening_allow_users: [ansible]
          firewall_admin_cidrs: [172.17.0.0/16]
          firewall_k3s_api_cidrs: [172.17.0.0/16]
